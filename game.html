        }
        
        .back-btn {
            font-family: 'Orbitron', sans-serif;

            border-radius: 30px;
            font-weight: 900;
            font-size: 0.9em;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 25px var(--neon-purple);
            border: none;
            cursor: pointer;
        }
        
        .back-btn:hover {
            box-shadow: 0 0 50px var(--neon-purple);
            transform: scale(1.05);
        }
        
        /* FULLSCREEN GAME CONTAINER */

            border-radius: 10px;
            box-shadow: 
                0 0 60px rgba(0, 243, 255, 0.6),
                inset 0 0 60px rgba(0, 243, 255, 0.1);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Make Ruffle player fill container */
        #game ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
        
        #loading {
            position: absolute;
            top: 50%;

        @keyframes slideIn {
            from {
                transform: translateX(400px);

            }

                transform: translateX(0);

        }

        }
        
        @keyframes spin {

        }
        
        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 30px var(--neon-blue);
            letter-spacing: 3px;
            animation: pulse 2s ease infinite;
        }
        
        @keyframes pulse {
            0%, 100% { 
                opacity: 1; 
                text-shadow: 0 0 30px var(--neon-blue);
            }
            50% { 
                opacity: 0.6; 
                text-shadow: 0 0 60px var(--neon-blue), 0 0 90px var(--neon-purple);
            }
        }
        
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 16, 0.98);
            border: 3px solid var(--neon-pink);
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            max-width: 700px;
            box-shadow: 0 0 60px var(--neon-pink);
            display: none;
            z-index: 200;
        }
        
        .error-message h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-pink);
            font-size: 2.5em;
            margin-bottom: 25px;
            text-shadow: 0 0 30px var(--neon-pink);
        }
        
        @media (max-width: 768px) {
            .game-container {
                height: calc(100vh - 100px);
            }

<body>
    <div class="top-bar">
        <div class="game-title" id="game-title">LOADING GAME...</div>
        <a href="index.html" class="back-btn">← BACK</a>
    </div>
    
    <div class="xp-notification" id="xp-notification">
        🎮 +50 XP | +10 🪙 Coins
    </div>
    
    <div class="game-container">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">LOADING GAME...</div>
        </div>
        
        <div id="game"></div>
        
        <div class="error-message" id="error-msg">
            <h2>⚠️ OH DEAR...</h2>
            <p style="font-size: 1.3em; line-height: 1.6; margin-bottom: 20px;">
                The game file couldn't be loaded. It might be missing or temporarily unavailable.
            </p>
            <p style="font-size: 0.95em; opacity: 0.8; margin-top: 20px;">
                Game: <strong id="error-game-name">Unknown</strong><br>
                Error: Flash SWF file failed to load
            </p>
            <div style="margin-top: 30px;">
                <button class="back-btn" onclick="location.reload()">🔄 TRY AGAIN</button>
                <a href="index.html" class="back-btn" style="margin-left: 15px;">← BACK TO ARCADE</a>
            </div>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameName = urlParams.get('game');
        
        const games = {
            'motherload': { name: 'MOTHERLOAD', file: '1269 - MotherLoad.swf' },
            'happywheels': { name: 'HAPPY WHEELS', file: 'HappyWheels.swf' },
            'gunblood': { name: 'GUN BLOOD', file: 'gunblood.swf' },
            'raftwars': { name: 'RAFT WARS', file: 'raftwars.swf' },
            'raftwars2': { name: 'RAFT WARS 2', file: 'raftwars2.swf' },
            'robotunicornattack': { name: 'ROBOT UNICORN ATTACK', file: 'robotunicornattack_flash.swf' },
            'ruahm': { name: 'ROBOT UNICORN HEAVY METAL', file: 'ruahm.swf' },
            'retrounicornattack': { name: 'RETRO UNICORN ATTACK', file: 'Retrounicornattack.swf' },
            'earntodie': { name: 'EARN TO DIE', file: 'EarnToDie_NotDoppler_dec.swf' },
            'earntodie2012': { name: 'EARN TO DIE 2012', file: 'earn-to-die-2012.swf' },
            'EarntoDie2016': { name: 'EARN TO DIE 2016', file: 'Earn to Die 2016.swf' },
            'EarntoDiePart2': { name: 'EARN TO DIE PART 2', file: 'Earn to Die Part 2.swf' },
            'bushshootout': { name: 'BUSH SHOOTOUT', file: '1452__bushshootout_game.swf' },
            'candymachine': { name: 'CANDY MACHINE DELUXE', file: 'flash_candymachinedeluxe.swf' },
            'jawbreaker': { name: 'JAWBREAKER', file: 'jawbreaker.swf' },
            'gold01': { name: 'GOLD MINER', file: 'gold01.swf' },
            'tomandjerrybowling': { name: 'TOM & JERRY BOWLING', file: 'tomandjerrybowling.swf' },
            'hive-hero': { name: 'HIVE HERO', file: 'hive-hero.swf' },
            'tj_trapomatic': { name: 'TJ TRAPOMATIC', file: 'tj_trapomatic.swf' },
            'britney_brawl_featuring_bill_vs_britney': { name: 'BRITNEY BRAWL', file: 'britney_brawl_featuring_bill_vs_britney.swf' },
            'bush_vs_kerry': { name: 'BUSH VS KERRY', file: 'bush_vs_kerry.swf' },
            'TheSimpsonsPac-Man': { name: 'SIMPSONS PAC-MAN', file: 'TheSimpsonsPac-Man.swf' },
            'the_simpsons_in_homers_beer_run': { name: 'HOMER BEER RUN', file: 'the_simpsons_in_homers_beer_run.swf' },
            'SpongeBob_bcbowling': { name: 'SPONGEBOB BOWLING', file: 'SpongeBob_bcbowling.swf' },
            'SnowLine': { name: 'SNOW LINE', file: 'SnowLine.swf' },
            'snowline2': { name: 'SNOW LINE 2', file: 'snowline2.swf' },
            'simpsons_the_ball_of_death': { name: 'BALL OF DEATH', file: 'simpsons_the_ball_of_death.swf' },
            'simpsons_magic_ball': { name: 'SIMPSONS MAGIC BALL', file: 'simpsons_magic_ball.swf' },
            'BattleBowlers': { name: 'BATTLE BOWLERS', file: 'BattleBowlers.swf' },
            'rickandmorty': { name: 'RICK AND MORTY', file: 'Rick-and-Morty.swf' }
        };
        
        // XP TRACKING FUNCTION
        function addGameXP() {
            const user = JSON.parse(localStorage.getItem('arcadeUser'));
            if (!user) {
                console.log('No user profile found - create profile to earn XP!');
                return;
            }
            
            const XP_PER_GAME = 50;
            const COINS_PER_GAME = 10;
            
            user.xp = (user.xp || 0) + XP_PER_GAME;
            user.coins = (user.coins || 0) + COINS_PER_GAME;
            user.gamesPlayed = (user.gamesPlayed || 0) + 1;
            user.level = Math.floor(Math.sqrt(user.xp / 100)) + 1;
            
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            
            // Show XP notification
            const notification = document.getElementById('xp-notification');
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 5000);
            
            console.log(`✅ +${XP_PER_GAME} XP, +${COINS_PER_GAME} Coins! Level: ${user.level}`);
        }
        
        // LOAD GAME
        if (gameName && games[gameName]) {
            const currentGame = games[gameName];
            document.getElementById('game-title').textContent = currentGame.name;
            document.getElementById('error-game-name').textContent = currentGame.name;
            document.title = `Playing ${currentGame.name} | Diane Keaton Memorial Arcade`;
            
            // Initialize Ruffle with FULLSCREEN settings
            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                "autoplay": "on",
                "unmuteOverlay": "hidden",
                "backgroundColor": "#000000",
                "letterbox": "fullscreen",
                "warnOnUnsupportedContent": false,
                "contextMenu": false,
                "quality": "high",
                "scale": "showAll",
                "upgradeToHttps": false,
                "maxExecutionDuration": 15,
                "logLevel": "warn",
                "width": "100%",
                "height": "100%"
            };
            
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById('game');
            container.appendChild(player);
            
            player.style.width = "100%";
            player.style.height = "100%";
            
            // Load game with XP tracking
            player.load(`games/${currentGame.file}`)
                .then(() => {
                    console.log('✅ Game loaded successfully');
                    document.getElementById('loading').style.display = 'none';
                    
                    // 🎮 AWARD XP FOR PLAYING GAME
                    addGameXP();
                })
                .catch(error => {
                    console.error('❌ Error loading game:', error);
                    showGameError(currentGame.name, error.message);
                });
            
            player.addEventListener('error', (event) => {
                console.error('Ruffle error:', event);
                showGameError(currentGame.name, 'Ruffle failed to load the Flash file');
            });
            
            setTimeout(() => {
                if (document.getElementById('loading').style.display !== 'none') {
                    showGameError(currentGame.name, 'Game loading timeout');
                }
            }, 10000);
            
        } else {
            document.getElementById('loading').innerHTML = `
                <div style="font-family: Orbitron; font-size: 2em; color: #ff00ff; text-align: center;">
                    ⚠️ GAME NOT FOUND
                </div>
                <a href="index.html" class="back-btn" style="margin-top: 30px; display: inline-block;">← BACK TO ARCADE</a>
            `;
        }
        
        function showGameError(gameName, errorMessage) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-game-name').textContent = gameName;
            document.getElementById('error-msg').style.display = 'block';
            console.error(`Game Error: ${gameName} - ${errorMessage}`);
        }
    </script>
</body>
</html>
