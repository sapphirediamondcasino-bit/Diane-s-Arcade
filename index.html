                try {
                    const scores = JSON.parse(localStorage.getItem(`leaderboard_${currentGameId}`) || '[]');
                    
                    const existingIndex = scores.findIndex(s => s.username === user.username);

                        score: score,
                        avatar: user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.username}`,
                        date: new Date().toISOString()
                    };
                    
                    if (existingIndex !== -1) {

                        } else {
                            showNotification('Score not high enough!');
                            closeScoreModal();
                            return;
                        }
                    } else {
                        scores.push(newScore);
                    }
                    
                    scores.sort((a, b) => (b.score || 0) - (a.score || 0));
                    const topScores = scores.slice(0, 100);
                    localStorage.setItem(`leaderboard_${currentGameId}`, JSON.stringify(topScores));
                    
                    // Award XP
                    const xpGain = Math.floor(score / 10);
                    user.xp = (user.xp || 0) + xpGain;
                    user.coins = (user.coins || 0) + Math.floor(score / 100);
                    localStorage.setItem('arcadeUser', JSON.stringify(user));
                    localStorage.setItem(`user_${user.username}`, JSON.stringify(user));
                    
                    showNotification(`✅ Score saved! +${xpGain} XP`);
                    closeScoreModal();
                } catch (error) {
                    console.error('Error saving score:', error);
                    showNotification('❌ Error saving score');
                }
            }
        }

            if (e.key === 'Enter') {
                saveScore();

        });

            document.getElementById('iframe-code').textContent = iframeCode;
            
            // Direct link
            document.getElementById('direct-link').textContent = gameURL;
            
            document.getElementById('embed-modal').classList.add('active');
        }
        
        function closeEmbedModal() {
            document.getElementById('embed-modal').classList.remove('active');
        }
        
        function copyCode(elementId) {
            const code = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = event.target;
                btn.textContent = '✓ COPIED!';
                btn.classList.add('copied');
                
                showNotification('Copied to clipboard!');
                
                setTimeout(() => {
                    btn.textContent = '📋 COPY';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Copy failed:', err);
                showNotification('Copy failed - try selecting the text manually');
            });
        }
        
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
        
        // Close modals on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeEmbedModal();
                closeScoreModal();
            }
        });
    <\/script>

        function getUser() {
            const userData = localStorage.getItem('arcadeUser');
            return userData ? JSON.parse(userData) : null;
        }
        
        function saveUser(user) {
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            localStorage.setItem('user_' + user.username, JSON.stringify(user));
        }
        
        function checkAndUnlockAchievements() {
            const user = getUser();
            if (!user) return;
            
            if (!user.achievements) user.achievements = [];
            if (!user.unlockedAchievements) user.unlockedAchievements = [];
            
            let newUnlocks = 0;
            
            ALL_ACHIEVEMENTS.forEach(ach => {
                if (user.unlockedAchievements.includes(ach.id)) return;
                
                let shouldUnlock = false;
                
                // Check conditions for auto-unlock

                    case 'first_steps':
                        shouldUnlock = true;
                        break;
                    case 'annie_hall':
                        shouldUnlock = (user.gamesPlayed || 0) >= 1;
                        break;

                        break;

                        shouldUnlock = user.unlockedAchievements.length >= 10;
                        break;
                    case 'curator':
                        shouldUnlock = user.unlockedAchievements.length >= 50;
                        break;
                    case 'archivist':
                        shouldUnlock = user.unlockedAchievements.length >= 100;
                        break;
                    case 'interiors':
                        shouldUnlock = user.avatar && user.banner;
                        break;
                    case 'badge_hunter':
                        shouldUnlock = (user.badges || []).length >= 5;
                        break;
                    case 'first_purchase':
                        shouldUnlock = (user.totalPurchases || 0) >= 1;
                        break;
                    case 'big_spender':
                        shouldUnlock = (user.totalSpent || 0) >= 10000;
                        break;
                    case 'whale':
                        shouldUnlock = (user.totalSpent || 0) >= 100000;
                        break;
                    case 'xp_apprentice':
                        shouldUnlock = (user.xp || 0) >= 1000;
                        break;
                    case 'xp_expert':
                        shouldUnlock = (user.xp || 0) >= 10000;
                        break;
                    case 'xp_legend':
                        shouldUnlock = (user.xp || 0) >= 100000;
                        break;
                    case 'mad_money':
                        shouldUnlock = (user.xp || 0) >= 100000;
                        break;
                }
                
                if (shouldUnlock) {
                    user.unlockedAchievements.push(ach.id);
                    user.xp = (user.xp || 0) + ach.xp;
                    newUnlocks++;
                }
            });
            
            if (newUnlocks > 0) {
                saveUser(user);
            }
        }
        
        function calculateLevel(xp) {
            return Math.floor(Math.sqrt(xp / 100)) + 1;
        }
        
        function loadAchievements() {
            checkAndUnlockAchievements();
            
            const user = getUser();
            const unlockedIds = user ? (user.unlockedAchievements || []) : [];
            
            const container = document.getElementById('achievements-container');
            container.innerHTML = '';
            
            let unlockedCount = 0;
            let totalXP = 0;
            
            ALL_ACHIEVEMENTS.forEach(achievement => {
                const isUnlocked = unlockedIds.includes(achievement.id);
                
                if (isUnlocked) {
                    unlockedCount++;
                    totalXP += achievement.xp;
                }
                
                // Apply filter
                if (currentFilter === 'unlocked' && !isUnlocked) return;
                if (currentFilter === 'locked' && isUnlocked) return;
                if (currentFilter !== 'all' && currentFilter !== 'unlocked' && currentFilter !== 'locked') {
                    if (achievement.category !== currentFilter) return;
                }
                
                const card = document.createElement('div');
                card.className = 'achievement-card' + (isUnlocked ? '' : ' locked');
                
                card.innerHTML = `
                    ${!isUnlocked ? '<div class="lock-icon">🔒</div>' : ''}
                    <div class="achievement-badge">${achievement.icon}</div>
                    <h4>${achievement.name}</h4>
                    <p>${achievement.desc}</p>
                    <div class="achievement-film">${achievement.film}</div>
                    <div class="achievement-xp">+${achievement.xp} XP</div>
                `;
                
                container.appendChild(card);
            });
            
            // Update stats
            document.getElementById('unlocked-count').textContent = unlockedCount;
            document.getElementById('total-count').textContent = ALL_ACHIEVEMENTS.length;
            const completion = Math.round((unlockedCount / ALL_ACHIEVEMENTS.length) * 100);
            document.getElementById('completion').textContent = completion + '%';
            document.getElementById('total-xp').textContent = totalXP.toLocaleString();
        }
        
        function filterAchievements(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            loadAchievements();
        }
        
        // Auto-check achievements every 30 seconds
        setInterval(checkAndUnlockAchievements, 30000);
        
        loadAchievements();
    <\/script>

        function populateGlobalTable(players, tbodyId) {
            const tbody = document.getElementById(tbodyId);
            if (!tbody) return;
            tbody.innerHTML = '';

            if (players.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="no-data"><div class="no-data-icon">🎮</div>No players yet!</td></tr>`;
                return;
            }

            players.forEach((p, i) => {
                const rank = i + 1;
                const rankClass = rank <= 3 ? 'rank-top3' : '';
                const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
                const avatar = p.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${p.username}`;

                tbody.innerHTML += `

                        <td class="rank-cell ${rankClass}">${rankEmoji} #${rank}</td>
                        <td>

                                    <div class="player-name">${p.username}</div>
                                    <div class="player-level">Level ${p.level || 1}</div>
                                </div>
                            </div>
                        </td>
                        <td>${p.level || 1}</td>
                        <td class="score-cell">${(p.xp || 0).toLocaleString()}</td>
                        <td>${p.achievementsCount || 0}/125+</td>
                        <td><a href="profile.html?user=${p.username}" class="view-profile-btn">VIEW</a></td>
                    </tr>
                `;
            });
        }
        
        function populateGameTable(scores, tbodyId) {
            const tbody = document.getElementById(tbodyId);
            if (!tbody) return;
            tbody.innerHTML = '';

            if (scores.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="no-data"><div class="no-data-icon">🎮</div>No scores yet!</td></tr>`;
                return;
            }

            scores.forEach((s, i) => {
                const rank = i + 1;
                const rankClass = rank <= 3 ? 'rank-top3' : '';
                const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
                const avatar = s.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${s.username}`;
                const date = s.date ? new Date(s.date).toLocaleDateString() : 'N/A';

                tbody.innerHTML += `
                    <tr>
                        <td class="rank-cell ${rankClass}">${rankEmoji} #${rank}</td>
                        <td>

                        <td><a href="profile.html?user=${s.username}" class="view-profile-btn">VIEW</a></td>
                    </tr>
                `;
            });
        }
        
        function buildLeaderboards() {
            const tabsContainer = document.getElementById('category-tabs');
            const lbContainer = document.getElementById('leaderboards-container');

            tabsContainer.innerHTML = '';
            Object.keys(GAMES).forEach((key, idx) => {
                const game = GAMES[key];
                const btn = document.createElement('button');
                btn.textContent = `${game.icon} ${game.name.toUpperCase()}`;
                btn.className = 'category-tab' + (idx === 0 ? ' active' : '');
                btn.dataset.category = key;
                btn.onclick = () => showCategory(key);
                tabsContainer.appendChild(btn);
            });

            lbContainer.innerHTML = '';
            Object.keys(GAMES).forEach(key => {
                const game = GAMES[key];
                const isGlobal = key === 'global';
                
                lbContainer.innerHTML += `
                    <div class="leaderboard-section ${key === 'global' ? 'active' : ''}" id="${key}-section">
                        <div class="leaderboard-header">
                            <h2 class="leaderboard-title">${game.icon} ${game.name.toUpperCase()}</h2>
                            <p class="leaderboard-subtitle">${game.subtitle}</p>

                                        <th>ACTION</th>
                                    </tr>
                                </thead>
                                <tbody id="${key}-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            checkWeeklyReset();
            showCategory('global');
        }
        
        // Save score function for game.html to use
        window.saveGameScore = function(gameId, score) {
            const user = JSON.parse(localStorage.getItem('arcadeUser'));
            if (!user || !user.username) {
                console.error('❌ No user logged in - cannot save score');
                return false;
            }
            
            try {
                // Get existing scores for this game
                const scores = getGameScores(gameId);
                
                // Check if user already has a score
                const existingIndex = scores.findIndex(s => s.username === user.username);
                
                const newScore = {
                    username: user.username,
                    score: score,
                    avatar: user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.username}`,
                    date: new Date().toISOString()
                };
                
                // Update or add score
                if (existingIndex !== -1) {
                    // Only update if new score is higher
                    if (score > scores[existingIndex].score) {
                        scores[existingIndex] = newScore;
                        console.log('✅ Updated high score for', user.username);
                    } else {
                        console.log('ℹ️ Score not high enough to update leaderboard');
                        return false;
                    }
                } else {
                    // Add new score
                    scores.push(newScore);
                    console.log('✅ Added new score for', user.username);
                }
                
                // Sort by score descending
                scores.sort((a, b) => (b.score || 0) - (a.score || 0));
                
                // Keep only top 100 scores
                const topScores = scores.slice(0, 100);
                
                // Save to localStorage
                localStorage.setItem(`leaderboard_${gameId}`, JSON.stringify(topScores));
                
                // Award XP for playing
                const xpGain = Math.floor(score / 10); // 1 XP per 10 points
                user.xp = (user.xp || 0) + xpGain;
                
                // Update user data
                localStorage.setItem('arcadeUser', JSON.stringify(user));
                localStorage.setItem(`user_${user.username}`, JSON.stringify(user));
                
                console.log(`✅ Score saved! Earned ${xpGain} XP`);
                return true;
            } catch (error) {
                console.error('❌ Error saving score:', error);
                return false;
            }
        };
        
        // Initialize leaderboards on page load
        document.addEventListener('DOMContentLoaded', function() {
            buildLeaderboards();
        });
    <\/script>

</script>

        let mediaType = null;
        
        function getUser() {
            try {
                const userData = localStorage.getItem('arcadeUser');
                if (!userData) {
                    console.log('❌ No arcadeUser in localStorage');
                    return null;
                }
                
                const user = JSON.parse(userData);
                console.log('✅ User loaded:', user);
                
                if (!user || !user.username) {
                    console.log('❌ User invalid or no username');
                    return null;
                }
                
                return user;
            } catch(e) {
                console.error('❌ Error getting user:', e);
                return null;
            }
        }
        
        function loadMemories() {
            try {
                const memoriesData = localStorage.getItem('dianeMemories');
                const memories = memoriesData ? JSON.parse(memoriesData) : [];
                const container = document.getElementById('memories-grid');
                
                console.log('📚 Loading', memories.length, 'memories');
                
                if (memories.length === 0) {
                    container.innerHTML = `
                        <div class="no-memories" style="grid-column: 1/-1;">
                            <div class="no-memories-icon">❤️</div>
                            <h3 style="font-family: 'Orbitron', sans-serif; font-size: 2em; margin-bottom: 20px; color: var(--neon-pink);">No memories shared yet</h3>
                            <p style="font-size: 1.2em;">Be the first to share a memory of Diane Keaton!</p>
                        </div>
                    `;
                    return;
                }
                
                memories.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                
                container.innerHTML = memories.map(memory => {
                    const date = new Date(memory.timestamp).toLocaleDateString('en-US', { 
                        month: 'long', 
                        day: 'numeric', 
                        year: 'numeric' 
                    });
                    
                    // Get avatar from cache or generate
                    const avatarKey = 'avatar_' + memory.username;
                    const avatar = localStorage.getItem(avatarKey) || memory.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(memory.username)}`;
                    
                    let mediaHTML = '';
                    // Load media from separate key if it exists
                    if (memory.mediaKey) {
                        const mediaData = localStorage.getItem(memory.mediaKey);
                        if (mediaData && memory.mediaType) {
                            if (memory.mediaType === 'image') {
                                mediaHTML = `<img src="${mediaData}" alt="Memory" class="memory-media">`;
                            } else if (memory.mediaType === 'video') {
                                mediaHTML = `<video src="${mediaData}" class="memory-media" controls></video>`;
                            }
                        }
                    }
                    // Fallback to old format
                    else if (memory.media && memory.mediaType) {
                        if (memory.mediaType === 'image') {
                            mediaHTML = `<img src="${memory.media}" alt="Memory" class="memory-media">`;
                        } else if (memory.mediaType === 'video') {
                            mediaHTML = `<video src="${memory.media}" class="memory-media" controls></video>`;
                        }
                    }
                    
                    const safeUsername = escapeHtml(memory.username);
                    const safeText = escapeHtml(memory.text);
                    const safeInspiration = escapeHtml(memory.inspiration);
                    
                    return `
                        <div class="memory-card">
                            ${mediaHTML}
                            <div class="memory-content">
                                <div class="memory-author">
                                    <img src="${avatar}" alt="${safeUsername}" class="author-avatar" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(memory.username)}'">
                                    <div class="author-info">
                                        <a href="profile.html?user=${encodeURIComponent(memory.username)}" class="author-name">${safeUsername}</a>
                                        <div class="memory-date">${date}</div>
                                    </div>
                                </div>
                                <div class="memory-text">${safeText}</div>
                                <div class="memory-inspiration">
                                    <strong style="color: var(--neon-pink);">What inspired me:</strong> ${safeInspiration}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                console.log('✅ Memories loaded successfully');
            } catch(e) {
                console.error('❌ Error loading memories:', e);
                document.getElementById('memories-grid').innerHTML = `
                    <div class="no-memories" style="grid-column: 1/-1;">
                        <p style="color: var(--neon-pink);">Error loading memories. Please refresh the page.</p>
                    </div>
                `;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function openMemoryModal() {
            const user = getUser();
            
            if (!user) {
                showNotification('Please create/login to your profile first!', 'error');
                setTimeout(() => {
                    window.__go('profile.html');
                }, 2000);
                return;
            }
            
            console.log('✅ Opening modal for user:', user.username);
            document.getElementById('memory-modal').classList.add('active');
        }
        
        function closeMemoryModal() {
            document.getElementById('memory-modal').classList.remove('active');
            document.getElementById('memory-form').reset();
            document.getElementById('media-preview-image').style.display = 'none';
            document.getElementById('media-preview-video').style.display = 'none';
            mediaFile = null;
            mediaType = null;
        }
        
        function previewMedia(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            console.log('📷 File selected:', file.name, file.size, 'bytes');
            
            if (file.size > 1000 * 1024 * 1024) {
                showNotification('File too large! Max 1000MB (1GB)', 'error');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                if (file.type.startsWith('image/')) {
                    // Compress and resize image
                    compressImage(e.target.result, function(compressed) {
                        mediaFile = compressed;
                        mediaType = 'image';
                        const previewImg = document.getElementById('media-preview-image');
                        previewImg.src = compressed;
                        previewImg.style.display = 'block';
                        document.getElementById('media-preview-video').style.display = 'none';
                        console.log('✅ Image compressed from', file.size, 'to ~', Math.round(compressed.length * 0.75), 'bytes');
                    });
                } else if (file.type.startsWith('video/')) {
                    mediaType = 'video';
                    mediaFile = e.target.result;
                    const previewVid = document.getElementById('media-preview-video');
                    previewVid.src = e.target.result;
                    previewVid.style.display = 'block';
                    document.getElementById('media-preview-image').style.display = 'none';
                    console.log('✅ Video loaded');
                }
            };
            reader.readAsDataURL(file);
        }
        
        function compressImage(dataUrl, callback) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                // Resize if larger than 1920x1080
                const maxWidth = 1920;
                const maxHeight = 1080;
                
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = width * ratio;
                    height = height * ratio;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Compress to 0.7 quality JPEG
                const compressed = canvas.toDataURL('image/jpeg', 0.7);
                callback(compressed);
            };
            img.src = dataUrl;
        }
        
        function submitMemory(e) {
            e.preventDefault();
            console.log('🔥 SUBMIT CLICKED');
            
            const user = getUser();
            
            if (!user) {
                console.log('❌ No user - redirecting');
                showNotification('You must be logged in! Redirecting...', 'error');
                setTimeout(() => window.__go('profile.html'), 2000);
                return;
            }
            
            console.log('✅ User verified:', user.username);
            
            const text = document.getElementById('memory-text').value.trim();
            const inspiration = document.getElementById('memory-inspiration').value.trim();
            
            console.log('📝 Text:', text.length, 'chars | Inspiration:', inspiration.length, 'chars');
            
            if (!text || !inspiration) {
                console.log('❌ Missing fields');
                showNotification('Please fill in all required fields!', 'error');
                return;
            }
            
            try {
                console.log('💾 Creating memory...');
                
                const memoryId = 'memory_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                // Store media separately if it exists
                let mediaKey = null;
                if (mediaFile) {
                    mediaKey = memoryId + '_media';
                    try {
                        localStorage.setItem(mediaKey, mediaFile);
                        console.log('✅ Media stored separately in key:', mediaKey);
                    } catch(mediaError) {
                        console.error('❌ Failed to store media:', mediaError);
                        throw new Error('Failed to save image - storage full. Please try a smaller image or clear browser data.');
                    }
                } else {
                    // REQUIRE media - don't allow posts without images
                    console.log('❌ No media file');
                    showNotification('Please add a photo or video to share!', 'error');
                    return;
                }
                
                // Store avatar separately too (don't duplicate in every memory)
                const avatarKey = 'avatar_' + user.username;
                if (user.avatar && !localStorage.getItem(avatarKey)) {
                    try {
                        localStorage.setItem(avatarKey, user.avatar);
                    } catch(e) {
                        console.log('⚠️ Could not cache avatar');
                    }
                }
                
                // MINIMAL memory object - only IDs and text
                const memory = {
                    id: memoryId,
                    username: user.username,
                    text: text,
                    inspiration: inspiration,
                    mediaKey: mediaKey,
                    mediaType: mediaType,
                    timestamp: new Date().toISOString()
                };
                
                console.log('📦 Memory object created (minimal), getting existing memories...');
                
                const existingData = localStorage.getItem('dianeMemories');
                const memories = existingData ? JSON.parse(existingData) : [];
                
                console.log('📚 Current count:', memories.length);
                
                memories.push(memory);
                
                console.log('💾 Attempting to save...');
                
                try {
                    localStorage.setItem('dianeMemories', JSON.stringify(memories));
                    console.log('✅✅✅ SAVED! New count:', memories.length);
                } catch(saveError) {
                    console.error('❌ SAVE ERROR:', saveError);
                    
                    if (saveError.name === 'QuotaExceededError') {
                        // Clean up oldest memories
                        console.log('🔄 Quota exceeded, cleaning old memories...');
                        cleanOldMemories(memories);
                        try {
                            localStorage.setItem('dianeMemories', JSON.stringify(memories));
                            console.log('✅ Saved after cleanup');
                        } catch(e2) {
                            console.error('❌ Still failed after cleanup');
                            throw new Error('Storage full - please clear browser data or use fewer/smaller images');
                        }
                    } else {
                        throw saveError;
                    }
                }
                
                showNotification('❤️ Memory shared! Thank you for honoring Diane.', 'success');
                closeMemoryModal();
                loadMemories();
                
            } catch(e) {
                console.error('❌❌❌ COMPLETE FAILURE:', e);
                console.error('Name:', e.name);
                console.error('Message:', e.message);
                console.error('Stack:', e.stack);
                showNotification('Error: ' + e.message, 'error');
            }
        }
        
        function showNotification(message, type = 'info') {
            console.log('🔔 Notification:', type, '-', message);
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        function cleanOldMemories(memories) {
            // Remove oldest 20% of memories to free space
            const toRemove = Math.ceil(memories.length * 0.2);
            console.log('🗑️ Removing', toRemove, 'oldest memories');
            
            // Sort by date
            memories.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            
            // Remove oldest and their media
            for (let i = 0; i < toRemove; i++) {
                if (memories[i].mediaKey) {
                    localStorage.removeItem(memories[i].mediaKey);
                }
            }
            
            // Remove from array
            memories.splice(0, toRemove);
            console.log('✅ Cleanup complete, remaining:', memories.length);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeMemoryModal();
            }
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Page loaded, initializing...');
            loadMemories();
        });
    <\/script>
</body>
</html>
</script>

        function loadShop() {
            const userData = localStorage.getItem('arcadeUser');

                document.getElementById('coin-balance').textContent = userCoins.toLocaleString();

            renderShop();

        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            
            const filteredItems = currentCategory === 'all' 
                ? shopItems 
                : shopItems.filter(item => item.category === currentCategory);
            
            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'shop-item';
                if (item.type === 'application') card.classList.add('special');
                if (item.category === 'bots') card.classList.add('premium');
                if (item.category === 'exclusive') card.classList.add('exclusive');
                
                const canAfford = typeof item.price === 'number' && userCoins >= item.price;
                const priceDisplay = typeof item.price === 'number' ? `${item.price.toLocaleString()} 🪙` : item.price;
                
                let buttonHTML = '';
                if (item.type === 'application') {
                    buttonHTML = `<button class="buy-btn apply-btn" onclick='openApplication(${JSON.stringify(item)})'>APPLY NOW</button>`;
                } else if (item.type === 'bot_subscription') {
                    buttonHTML = `<button class="buy-btn" onclick='openBotPurchase(${JSON.stringify(item)})' ${!canAfford ? 'disabled' : ''}>SUBSCRIBE</button>`;
                } else {
                    buttonHTML = `<button class="buy-btn" onclick="purchaseItem('${item.id}', ${item.price})" ${!canAfford ? 'disabled' : ''}>BUY NOW</button>`;
                }
                
                let requirementsHTML = '';
                if (item.requirements) {
                    requirementsHTML = `
                        <div class="requirements">
                            <h4>Requirements:</h4>
                            <ul>
                                ${item.requirements.map(req => `<li>${req}</li>`).join('')}
                            </ul>

                let warningHTML = '';
                if (item.warning) {
                    warningHTML = `
                        <div class="warning-box">
                            <h4>⚠️ IMPORTANT:</h4>
                            <p>${item.warning}</p>
                        </div>
                    `;
                }
                
                let badgeText = '';
                if (item.type === 'application') {
                    badgeText = '<div class="special-badge">APPLICATION</div>';
                } else if (item.category === 'bots') {
                    badgeText = '<div class="special-badge" style="background: var(--neon-purple);">BOT SUB</div>';
                } else if (item.category === 'exclusive') {
                    badgeText = '<div class="special-badge" style="background: var(--neon-red);">EXCLUSIVE</div>';
                }
                
                card.innerHTML = `
                    ${badgeText}
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-description">${item.description}</div>
                    ${warningHTML}
                    ${requirementsHTML}
                    <div class="item-price">${priceDisplay}</div>
                    ${buttonHTML}
                `;
                
                container.appendChild(card);

            currentCategory = category;

            document.getElementById('modal-title').textContent = `Apply for ${item.name}`;

            extraFieldsContainer.innerHTML = '';
            
            if (item.extraFields) {
                item.extraFields.forEach(field => {
                    const div = document.createElement('div');
                    div.className = 'form-group';
                    
                    if (field.type === 'textarea') {
                        div.innerHTML = `
                            <label>${field.label}:</label>
                            <textarea name="${field.name}" ${field.required ? 'required' : ''} placeholder="${field.placeholder || ''}"></textarea>
                        `;
                    } else {
                        div.innerHTML = `
                            <label>${field.label}:</label>
                            <input type="${field.type}" name="${field.name}" ${field.required ? 'required' : ''} placeholder="${field.placeholder || ''}">
                        `;
                    }
                    
                    extraFieldsContainer.appendChild(div);
                });
            }
            
            document.getElementById('application-modal').classList.add('active');
        }

            document.getElementById('application-modal').classList.remove('active');

        function submitApplication(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const application = {
                item_id: formData.get('item_id'),
                discord_invite: formData.get('discord_invite'),
                member_count: formData.get('member_count'),
                additional_info: formData.get('additional_info'),
                timestamp: new Date().toISOString(),
                status: 'pending'
            };
            
            const itemId = formData.get('item_id');
            const item = shopItems.find(i => i.id === itemId);
            if (item && item.extraFields) {
                item.extraFields.forEach(field => {
                    application[field.name] = formData.get(field.name);
                });
            }
            
            const userData = localStorage.getItem('arcadeUser');
            if (userData) {
                const user = JSON.parse(userData);
                application.username = user.username;
                application.email = user.email;
            }
            
            const applications = JSON.parse(localStorage.getItem('badgeApplications') || '[]');
            applications.push(application);
            localStorage.setItem('badgeApplications', JSON.stringify(applications));
            
            showNotification('Application submitted! Staff will review it soon. 🎉', 'success');
            closeModal();
        }

            document.getElementById('bot-purchase-modal').classList.add('active');

        function updateBotCost() {

            const totalCost = currentBotItem.price * months;
            document.getElementById('bot-total-cost').textContent = `${totalCost.toLocaleString()} 🪙`;
        }
        
        document.getElementById('bot-months')?.addEventListener('change', updateBotCost);
        
        function confirmBotPurchase() {
            const serverId = document.getElementById('bot-server-id').value.trim();
            const serverName = document.getElementById('bot-server-name').value.trim();
            const months = parseInt(document.getElementById('bot-months').value);
            
            if (!serverId || !serverName) {
                showNotification('Please fill in all fields!', 'error');
                return;
            }
            
            const totalCost = currentBotItem.price * months;
            
            if (userCoins < totalCost) {
                showNotification('Not enough coins!', 'error');
                return;
            }
            
            const userData = localStorage.getItem('arcadeUser');
            if (!userData) {
                showNotification('Please login first!', 'error');
                return;
            }
            
            const user = JSON.parse(userData);
            user.coins -= totalCost;
            
            const purchase = {
                type: 'bot_subscription',
                item_id: currentBotItem.id,
                item_name: currentBotItem.name,
                months: months,
                server_id: serverId,
                server_name: serverName,
                total_cost: totalCost,
                username: user.username,
                email: user.email,
                timestamp: new Date().toISOString(),
                status: 'pending_activation'
            };
            
            const purchases = JSON.parse(localStorage.getItem('botPurchases') || '[]');
            purchases.push(purchase);
            localStorage.setItem('botPurchases', JSON.stringify(purchases));
            
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            localStorage.setItem('user_' + user.username, JSON.stringify(user));
            
            userCoins = user.coins;
            document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
            
            showNotification(`✅ Purchased ${currentBotItem.name} for ${months} month(s)! Staff will activate within 24 hours.`, 'success');
            closeBotModal();
            renderShop();
        }
        
        function purchaseItem(itemId, price) {
            const userData = localStorage.getItem('arcadeUser');
            if (!userData) {
                showNotification('Please login first!', 'error');
                return;
            }
            
            const user = JSON.parse(userData);
            
            if (user.coins < price) {
                showNotification('Not enough coins!', 'error');
                return;
            }
            
            user.coins -= price;
            
            if (!user.inventory) user.inventory = [];
            if (!user.badges) user.badges = [];
            
            const item = shopItems.find(i => i.id === itemId);
            
            if (item.category === 'badges') {
                if (!user.badges.includes(itemId)) {
                    user.badges.push(itemId);
                }
            } else {
                user.inventory.push({
                    item_id: itemId,
                    purchased_at: new Date().toISOString()
                });
            }
            
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            localStorage.setItem('user_' + user.username, JSON.stringify(user));
            
            userCoins = user.coins;
            document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
            
            showNotification(`✅ Purchased ${item.name}!`, 'success');
            renderShop();
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeBotModal();
            }
        });
        
        loadShop();

        ];
        
        function trackMovieWatched(movieTitle, platform) {
            try {
                const user = JSON.parse(localStorage.getItem('arcadeUser'));
                if (!user) return;
                
                if (!user.moviesWatched) user.moviesWatched = 0;
                if (!user.moviesHistory) user.moviesHistory = {};
                
                const movieKey = `${platform}_${movieTitle}`;
                if (user.moviesHistory[movieKey]) {
                    console.log('Movie already watched - no XP');
                    return;
                }
                
                // Add 25 XP
                user.xp = (user.xp || 0) + 25;
                user.moviesWatched++;
                user.level = Math.floor(Math.sqrt(user.xp / 100)) + 1;
                
                user.moviesHistory[movieKey] = {
                    title: movieTitle,
                    platform: platform,
                    watchedAt: new Date().toISOString()
                };
                
                localStorage.setItem('arcadeUser', JSON.stringify(user));
                localStorage.setItem('user_' + user.username, JSON.stringify(user));
                
                showXPNotification(movieTitle);
                console.log(`✅ +25 XP for watching ${movieTitle} on ${platform}`);
            } catch (error) {
                console.error('Failed to track movie:', error);
            }
        }
        
        function showXPNotification(movieTitle) {
            const notification = document.createElement('div');
            notification.className = 'xp-notification';
            notification.innerHTML = `
                <div style="font-size: 1.5em; margin-bottom: 5px;">⚡ +25 XP!</div>
                <div style="font-size: 0.9em;">Watched: ${movieTitle}</div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideIn 0.5s ease reverse';
                setTimeout(() => notification.remove(), 500);
            }, 5000);
        }
        
        function createMovieCard(movie, platform) {
            const isYoutube = platform === "youtube";
            const youtubeClass = isYoutube ? "youtube" : "";
            const platformText = isYoutube ? "YOUTUBE" : (platform === "tubi" ? "TUBI" : "PLUTO TV");
            
            return `<div class="movie-card ${youtubeClass}">
                <img src="${movie.poster}" alt="${movie.title}" class="movie-poster" onerror="this.src='https://via.placeholder.com/300x380/050510/00f3ff?text=${movie.title.replace(/ /g, '+')}'">
                <div class="movie-content">
                    <h3>${movie.title}</h3>
                    <div class="movie-year">${movie.year} • ${platformText}</div>
                    <p>${movie.desc}</p>
                    <button class="watch-btn ${youtubeClass}" onclick='openMovie(${JSON.stringify(movie)}, "${platform}")'>▶ WATCH NOW</button>
                </div>
            </div>`;
        }
        
        function loadMovies() {
            document.getElementById('youtube-movies').innerHTML = youtubeMovies.map(m => createMovieCard(m, 'youtube')).join('');
            document.getElementById('tubi-movies').innerHTML = tubiMovies.map(m => createMovieCard(m, 'tubi')).join('');
            document.getElementById('pluto-movies').innerHTML = plutoMovies.map(m => createMovieCard(m, 'pluto')).join('');
        }
        
        function openMovie(movie, platform) {
            // TUBI doesn't allow iframe embedding - open in new tab
            if (platform === 'tubi') {
                if (confirm(`Watch "${movie.title}" on Tubi?\n\nThis will open in a new tab. You'll earn +25 XP when you start watching!`)) {
                    window.open(movie.url, '_blank');
                    
                    // Give XP immediately for Tubi since we can't track in external tab
                    trackMovieWatched(movie.title, platform);
                }
                return;
            }
            
            // For YouTube and Pluto TV - use modal player
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('custom-player');
            const titleDisplay = document.getElementById('video-title-display');
            
            titleDisplay.textContent = `${movie.title} (${movie.year})`;
            
            if (platform === 'youtube') {
                player.src = `https://www.youtube.com/embed/${movie.videoId}?autoplay=1`;
            } else if (platform === 'pluto') {
                player.src = movie.url;
            }
            
            modal.classList.add('active');
            
            // TRACK MOVIE WATCHED - ADD XP AFTER 5 MINUTES
            setTimeout(() => {
                trackMovieWatched(movie.title, platform);
            }, 300000); // 5 minutes = 300,000 ms
        }
        
        function closeVideo() {
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('custom-player');
            modal.classList.remove('active');
            player.src = '';
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVideo();
        });
        
        loadMovies();
    <\/script>
</body>

</script>

    <script>
        const BADGE_DEFINITIONS = {
            'verified_discord': { icon: '🔷', name: 'Verified Discord' },
            'org_badge': { icon: '🏢', name: 'Organization' },
            'roblox_badge': { icon: '🎮', name: 'Roblox Dev' },
            'premium_badge': { icon: '💎', name: 'Premium' },
            'founder_badge': { icon: '👑', name: 'Founder' },
            'community_badge': { icon: '🌟', name: 'Community' }
        };
        
        const ALL_ACHIEVEMENTS = [
            { id: 'first_game', name: 'First Game', desc: 'Play your first game', icon: '🎬', xp: 10 },
            { id: 'game_master', name: 'Game Master', desc: 'Play 10 games', icon: '🏆', xp: 50 },
            { id: 'movie_buff', name: 'Movie Buff', desc: 'Watch 5 movies', icon: '🎬', xp: 25 },
            { id: 'coin_collector', name: 'Coin Collector', desc: 'Earn 1000 coins', icon: '🪙', xp: 100 },
            { id: 'level_10', name: 'Level 10', desc: 'Reach level 10', icon: '⚡', xp: 200 },
            { id: 'badge_hunter', name: 'Badge Hunter', desc: 'Get your first badge', icon: '🏅', xp: 50 },
            { id: 'explorer', name: 'Explorer', desc: 'Visit all pages', icon: '🗺️', xp: 30 },
            { id: 'profile_perfect', name: 'Profile Perfect', desc: 'Upload avatar and banner', icon: '✨', xp: 25 }
        ];
        
        let avatarFile = null;
        let bannerFile = null;
        
        // AUTH FUNCTIONS
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            hideError();
        }
        
        function showError(message) {
            const errorEl = document.getElementById('authError');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }
        
        function hideError() {
            document.getElementById('authError').classList.remove('show');
        }
        
        function handleLogin(e) {
            e.preventDefault();
            hideError();
            if (parent.DKBackend && parent.DKBackend.status !== 'unconfigured') { /* Supabase Auth; no local-account fallback once configured */
                parent.DKBackend.login(document.getElementById('loginUsername').value.trim(), document.getElementById('loginPassword').value)
                    .then(function () { initProfile(); }).catch(function (err) { showError(err.message); });
                return;
            }
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            // Check if user exists
            const userKey = 'user_' + username;
            const userData = localStorage.getItem(userKey);
            
            if (!userData) {
                // Try finding by email
                let found = false;
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('user_')) {
                        const user = JSON.parse(localStorage.getItem(key));
                        if (user.email === username) {
                            if (user.password === password) {
                                localStorage.setItem('arcadeUser', JSON.stringify(user));
                                initProfile();
                                return;
                            } else {
                                showError('Invalid password!');
                                return;
                            }
                        }
                    }
                }
                showError('User not found!');
                return;
            }
            
            const user = JSON.parse(userData);
            
            if (user.password !== password) {
                showError('Invalid password!');
                return;
            }
            
            // Login successful
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            initProfile();
        }
        
        function handleRegister(e) {
            e.preventDefault();
            hideError();
            if (parent.DKBackend && parent.DKBackend.status !== 'unconfigured') {
                var _pw = document.getElementById('regPassword').value;
                if (_pw !== document.getElementById('regConfirmPassword').value) { showError('Passwords do not match!'); return; }
                if (_pw.length < 6) { showError('Password must be at least 6 characters!'); return; }
                parent.DKBackend.register(document.getElementById('regUsername').value.trim(), document.getElementById('regEmail').value.trim(), _pw)
                    .then(function (r) { if (r.needsConfirm) { showError('Check your email to confirm your account, then sign in.'); } else { initProfile(); } })
                    .catch(function (err) { showError(err.message); });
                return;
            }
            
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            if (password !== confirmPassword) {
                showError('Passwords do not match!');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters!');
                return;
            }
            
            // Check if username exists
            if (localStorage.getItem('user_' + username)) {
                showError('Username already taken!');
                return;
            }
            
            // Check if email exists
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('user_')) {
                    const user = JSON.parse(localStorage.getItem(key));
                    if (user.email === email) {
                        showError('Email already registered!');
                        return;
                    }
                }
            }
            
            // Create new user - USE unlockedAchievements FIELD
            const newUser = {
                username: username,
                email: email,
                password: password,
                xp: 0,
                coins: 0,
                level: 1,
                gamesPlayed: 0,
                moviesWatched: 0,
                unlockedAchievements: [], // FIXED: Use correct field name
                badges: [],
                inventory: [],
                joinDate: new Date().toISOString(),
                avatar: null,
                banner: null,
                gamesHistory: {},
                moviesHistory: {}
            };
            
            // Save to localStorage
            localStorage.setItem('user_' + username, JSON.stringify(newUser));
            localStorage.setItem('arcadeUser', JSON.stringify(newUser));
            
            showNotification('Account created successfully!', 'success');
            setTimeout(() => initProfile(), 1000);
        }
        
        function initProfile() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('profileContainer').classList.add('active');
            document.getElementById('logoutBtn').style.display = 'block';
            loadProfile();
        }
        
        function checkAuth() {
            const user = localStorage.getItem('arcadeUser');
            if (user) {
                initProfile();
            }
        }
        
        // PROFILE FUNCTIONS
        function getUser() {
            const user = localStorage.getItem('arcadeUser');
            return user ? JSON.parse(user) : null;
        }
        
        function saveUser(userData) {
            localStorage.setItem('arcadeUser', JSON.stringify(userData));
            localStorage.setItem('user_' + userData.username, JSON.stringify(userData));
        }
        
        function calculateLevel(xp) {
            return Math.floor(Math.sqrt(xp / 100)) + 1;
        }
        
        function xpForNextLevel(level) {
            return level * level * 100;
        }
        
        function loadBadges() {
            const user = getUser();
            if (!user) return;
            
            const container = document.getElementById('userBadges');
            
            if (!user.badges || user.badges.length === 0) {
                container.innerHTML = `
                    <div class="no-badges">
                        <p>No badges yet!</p>
                        <a href="shop.html" class="buy-badges-link">🪙 BUY BADGES IN SHOP</a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = user.badges.map(badgeId => {
                const badge = BADGE_DEFINITIONS[badgeId];
                if (!badge) return '';
                return `
                    <div class="badge-item" title="${badge.name}">
                        <div class="badge-icon">${badge.icon}</div>
                        <div class="badge-name">${badge.name}</div>
                    </div>
                `;
            }).join('');
        }
        function loadBoosts() {
    const user = getUser();
    if (!user) return;
    
    const container = document.getElementById('userBoosts');
    const now = new Date().getTime();
    
    // Check inventory for active boosts
    const activeBoosts = (user.inventory || []).filter(item => {
        if (!item.item_id) return false;
        if (!item.item_id.includes('boost')) return false;
        if (!item.purchased_at) return false;
        
        // Calculate expiration time based on boost type
        const purchaseTime = new Date(item.purchased_at).getTime();
        let duration = 0;
        
        if (item.item_id.includes('24h')) duration = 24 * 60 * 60 * 1000;
        else if (item.item_id.includes('3d')) duration = 3 * 24 * 60 * 60 * 1000;
        else if (item.item_id.includes('7d')) duration = 7 * 24 * 60 * 60 * 1000;
        else if (item.item_id.includes('14d')) duration = 14 * 24 * 60 * 60 * 1000;
        else if (item.item_id.includes('30d')) duration = 30 * 24 * 60 * 60 * 1000;
        
        return (purchaseTime + duration) > now;
    });
    
    if (activeBoosts.length === 0) {
        container.innerHTML = `
            <div class="no-boosts" style="width: 100%; text-align: center; padding: 30px; opacity: 0.7;">
                <p>No active boosts!</p>
                <a href="shop.html" class="buy-badges-link" style="background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));">🪙 BUY BOOSTS IN SHOP</a>
            </div>
        `;
        return;
    }
    
    container.innerHTML = activeBoosts.map(boost => {
        const purchaseTime = new Date(boost.purchased_at).getTime();
        let duration = 0;
        let boostName = 'Boost';
        let boostIcon = '⚡';
        
        // Determine duration and name
        if (boost.item_id.includes('24h')) { duration = 24 * 60 * 60 * 1000; boostName += ' (24h)'; }
        else if (boost.item_id.includes('3d')) { duration = 3 * 24 * 60 * 60 * 1000; boostName += ' (3d)'; }
        else if (boost.item_id.includes('7d')) { duration = 7 * 24 * 60 * 60 * 1000; boostName += ' (7d)'; }
        else if (boost.item_id.includes('14d')) { duration = 14 * 24 * 60 * 60 * 1000; boostName += ' (14d)'; }
        else if (boost.item_id.includes('30d')) { duration = 30 * 24 * 60 * 60 * 1000; boostName += ' (30d)'; }
        
        if (boost.item_id.includes('xp')) { boostName = 'XP ' + boostName; boostIcon = '⚡'; }
        else if (boost.item_id.includes('coin')) { boostName = 'Coin ' + boostName; boostIcon = '💰'; }
        else if (boost.item_id.includes('combo')) { boostName = 'Combo ' + boostName; boostIcon = '🔥'; }
        else if (boost.item_id.includes('mega')) { boostName = 'MEGA ' + boostName; boostIcon = '💥'; }
        else if (boost.item_id.includes('ultra')) { boostName = 'ULTRA ' + boostName; boostIcon = '🌟'; }
        else if (boost.item_id.includes('legendary')) { boostName = 'LEGENDARY ' + boostName; boostIcon = '👑'; }
        
        const expiresAt = purchaseTime + duration;
        const timeLeft = expiresAt - now;
        const hoursLeft = Math.floor(timeLeft / (1000 * 60 * 60));
        const daysLeft = Math.floor(hoursLeft / 24);
        
        let timeDisplay = '';
        if (daysLeft > 0) timeDisplay = `${daysLeft}d ${hoursLeft % 24}h left`;
        else timeDisplay = `${hoursLeft}h left`;
        
        return `
            <div class="badge-item" style="border-color: var(--neon-green);" title="${boostName}">
                <div class="badge-icon">${boostIcon}</div>
                <div class="badge-name">${boostName}</div>
                <div style="font-size: 0.6em; color: var(--neon-green); margin-top: 5px;">${timeDisplay}</div>
            </div>
        `;
    }).join('');
}
        
        function loadAchievements() {
    const user = getUser();
    if (!user) return;
    
    const container = document.getElementById('achievementsContainer');
    const unlockedAchs = user.unlockedAchievements || [];
    
    // Filter to ONLY show unlocked achievements
    const unlockedOnly = ALL_ACHIEVEMENTS.filter(ach => unlockedAchs.includes(ach.id));
    
    // If no achievements unlocked
    if (unlockedOnly.length === 0) {
        container.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
                <div style="font-size: 4em;">🔒</div>
                <h3 style="font-family: 'Orbitron', sans-serif; margin: 20px 0;">No Achievements Unlocked Yet!</h3>
                <a href="achievements.html" style="display: inline-block; padding: 15px 30px; background: var(--neon-blue); color: white; text-decoration: none; border-radius: 25px; font-family: 'Orbitron', sans-serif; font-weight: 700;">VIEW ALL ACHIEVEMENTS</a>
            </div>
        `;
        return;
    }
    
    // Show ONLY unlocked achievements
    container.innerHTML = unlockedOnly.map(ach => `
        <div class="achievement-card">
            <div class="achievement-icon">${ach.icon}</div>
            <div class="achievement-name">${ach.name}</div>
            <div class="achievement-desc">${ach.desc}</div>
            <div style="margin-top: 15px; color: var(--neon-green); font-family: 'Orbitron', sans-serif; font-weight: 700;">+${ach.xp} XP</div>
        </div>
    `).join('');
    
    // Add view all card
    container.innerHTML += `
        <div class="achievement-card" style="display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(191, 0, 255, 0.1);" onclick="window.__go('achievements.html')">
            <div style="text-align: center;">
                <div style="font-size: 3em; margin-bottom: 15px;">🏆</div>
                <div class="achievement-name">View All</div>
                <div class="achievement-desc">${unlockedAchs.length} / 125+ unlocked</div>
            </div>
        </div>
    `;
}
        
        function checkAchievements(user) {
            // FIXED: Use unlockedAchievements instead of achievements
            if (!user.unlockedAchievements) user.unlockedAchievements = [];
            
            if (user.gamesPlayed >= 1 && !user.unlockedAchievements.includes('first_game')) {
                user.unlockedAchievements.push('first_game');
                user.xp += 10;
            }
            if (user.gamesPlayed >= 10 && !user.unlockedAchievements.includes('game_master')) {
                user.unlockedAchievements.push('game_master');
                user.xp += 50;
            }
            if (user.moviesWatched >= 5 && !user.unlockedAchievements.includes('movie_buff')) {
                user.unlockedAchievements.push('movie_buff');
                user.xp += 25;
            }
            if (user.coins >= 1000 && !user.unlockedAchievements.includes('coin_collector')) {
                user.unlockedAchievements.push('coin_collector');
                user.xp += 100;
            }
            const level = calculateLevel(user.xp);
            if (level >= 10 && !user.unlockedAchievements.includes('level_10')) {
                user.unlockedAchievements.push('level_10');
                user.xp += 200;
            }
            if (user.badges && user.badges.length >= 1 && !user.unlockedAchievements.includes('badge_hunter')) {
                user.unlockedAchievements.push('badge_hunter');
                user.xp += 50;
            }
            if (user.avatar && user.banner && !user.unlockedAchievements.includes('profile_perfect')) {
                user.unlockedAchievements.push('profile_perfect');
                user.xp += 25;
            }
            
            saveUser(user);
        }
        
        function loadProfile() {
            const user = getUser();
            if (!user || !user.username) {
                // User not logged in yet, silently return
                return;
            }
            
            document.getElementById('username').textContent = user.username.toUpperCase();
            document.getElementById('userAvatar').src = user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.username}`;
            document.getElementById('profileBanner').src = user.banner || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=1200&h=400&fit=crop';
            
            const level = calculateLevel(user.xp);
            const currentLevelXP = xpForNextLevel(level - 1);
            const nextLevelXP = xpForNextLevel(level);
            const xpInLevel = user.xp - currentLevelXP;
            const xpNeeded = nextLevelXP - currentLevelXP;
            const progress = (xpInLevel / xpNeeded) * 100;
            
            document.getElementById('userLevel').textContent = level;
            document.getElementById('xpBar').style.width = progress + '%';
            document.getElementById('xpText').textContent = `${xpInLevel} / ${xpNeeded} XP`;
            
            // FIXED: Use unlockedAchievements
            document.getElementById('statAchievements').textContent = (user.unlockedAchievements || []).length;
            document.getElementById('statGames').textContent = user.gamesPlayed || 0;
            document.getElementById('statMovies').textContent = user.moviesWatched || 0;
            document.getElementById('statCoins').textContent = (user.coins || 0).toLocaleString();
            document.getElementById('statXp').textContent = (user.xp || 0).toLocaleString();
            
            const joinDate = new Date(user.joinDate);
            document.getElementById('statJoined').textContent = joinDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            
            loadBadges();
            loadAchievements();
            checkAchievements(user);
        }
        
        function previewAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > 1000 * 1024 * 1024) {
                showNotification('File too large! Max 1000MB', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                avatarFile = e.target.result;
                document.getElementById('avatarPreview').src = e.target.result;
                document.getElementById('avatarPreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
        
        function previewBanner(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > 1000 * 1024 * 1024) {
                showNotification('File too large! Max 1000MB', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                bannerFile = e.target.result;
                document.getElementById('bannerPreview').src = e.target.result;
                document.getElementById('bannerPreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
        
        function saveAvatar() {
            if (!avatarFile) {
                showNotification('Please select an image first', 'error');
                return;
            }
            
            const user = getUser();
            if (!user) return;
            
            user.avatar = avatarFile;
            saveUser(user);
            
            document.getElementById('userAvatar').src = avatarFile;
            closeModal('avatarModal');
            showNotification('Avatar updated!', 'success');
            avatarFile = null;
            checkAchievements(user);
            loadProfile();
        }
        
        function saveBanner() {
            if (!bannerFile) {
                showNotification('Please select an image first', 'error');
                return;
            }
            
            const user = getUser();
            if (!user) return;
            
            user.banner = bannerFile;
            saveUser(user);
            
            document.getElementById('profileBanner').src = bannerFile;
            closeModal('bannerModal');
            showNotification('Banner updated!', 'success');
            bannerFile = null;
            checkAchievements(user);
            loadProfile();
        }
        
        function openAvatarModal() {
            document.getElementById('avatarModal').classList.add('active');
            document.getElementById('avatarPreview').style.display = 'none';
        }
        
        function openBannerModal() {
            document.getElementById('bannerModal').classList.add('active');
            document.getElementById('bannerPreview').style.display = 'none';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            avatarFile = null;
            bannerFile = null;
        }
        
        function logout() {
            try { parent.DKBackend && parent.DKBackend.logout(); } catch (e) {}
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('arcadeUser');
                window.__reload();
            }
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal('avatarModal');
                closeModal('bannerModal');
            }
        });
        
        // Initialize
        checkAuth();
    <\/script>
</body>
</html>
</script>
