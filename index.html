<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diane Keaton Legacy Entertainment Center</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050510'/%3E%3Crect x='3' y='3' width='58' height='58' rx='12' fill='none' stroke='%2300f3ff' stroke-width='3'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='900' font-size='38' text-anchor='middle' fill='%23ff00ff'%3ED%3C/text%3E%3C/svg%3E">
<style>
  :root { --dk-bar: 60px; --dk-blue:#00f3ff; --dk-purple:#bf00ff; --dk-pink:#ff00ff; }
  html, body { margin:0; height:100%; background:#050510; overflow:hidden; }
  #sitebar { position:fixed; top:0; left:0; right:0; height:var(--dk-bar); z-index:100; box-sizing:border-box; display:flex; align-items:center; gap:14px; padding:0 18px;
             background:rgba(5,5,16,.98); border-bottom:2px solid var(--dk-blue); box-shadow:0 4px 24px rgba(0,243,255,.25); font-family:Orbitron,'Segoe UI',Arial,sans-serif; color:#fff; }
  #sitebar a { color:inherit; text-decoration:none; }
  .dk-brand { display:flex; flex-direction:column; line-height:1.05; flex:none; }
  .dk-brand b { font-size:15px; letter-spacing:2px; color:var(--dk-blue); text-shadow:0 0 12px rgba(0,243,255,.6); }
  .dk-brand small { font-size:8.5px; letter-spacing:2.4px; color:#d9b3ff; margin-top:3px; }
  #dkNav { display:flex; align-items:center; gap:4px; margin:0 auto; }
  #dkNav a { padding:9px 12px; border-radius:20px; font-size:11.5px; font-weight:700; letter-spacing:1px; border:1.5px solid transparent; white-space:nowrap; transition:.2s; }
  #dkNav a:hover { border-color:var(--dk-blue); background:rgba(0,243,255,.1); }
  #dkNav a[aria-current="page"] { border-color:var(--dk-pink); background:rgba(255,0,255,.15); box-shadow:0 0 12px rgba(255,0,255,.35); }
  #dkNav a.dk-bot { color:#7dffb0; }
  #dkNav a.dk-admin { color:#ffd54a; }
  #dkAuth { display:flex; align-items:center; gap:10px; flex:none; }
  .dk-btn { display:inline-block; padding:9px 16px; border-radius:22px; font-size:11.5px; font-weight:800; letter-spacing:1px; background:linear-gradient(135deg,var(--dk-blue),var(--dk-purple)); color:#050510 !important; border:0; cursor:pointer; font-family:inherit; }
  .dk-user { display:flex; align-items:center; gap:9px; padding:4px 12px 4px 4px; border-radius:30px; border:1.5px solid var(--dk-purple); background:rgba(191,0,255,.12); }
  .dk-user img, .dk-user .dk-ini { width:32px; height:32px; border-radius:50%; object-fit:cover; background:#1a0a2e; display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--dk-pink); flex:none; }
  .dk-user span { display:flex; flex-direction:column; line-height:1.15; font-size:11px; font-weight:700; max-width:120px; }
  .dk-user span small { font-size:9.5px; font-weight:600; color:#9ef; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dk-out { background:none; border:1.5px solid rgba(255,255,255,.35); color:#fff; border-radius:18px; padding:7px 11px; font:700 10px Orbitron,Arial,sans-serif; letter-spacing:1px; cursor:pointer; }
  .dk-out:hover { border-color:var(--dk-pink); }
  #dkMenuBtn { display:none; margin-left:auto; width:42px; height:42px; border-radius:10px; border:2px solid var(--dk-blue); background:rgba(0,243,255,.08); cursor:pointer; padding:0; flex:none; }
  #dkMenuBtn span, #dkMenuBtn span::before, #dkMenuBtn span::after { display:block; width:20px; height:2.5px; background:var(--dk-blue); border-radius:2px; position:relative; margin:0 auto; content:''; transition:.2s; }
  #dkMenuBtn span::before { position:absolute; top:-7px; left:0; } #dkMenuBtn span::after { position:absolute; top:7px; left:0; }
  #sitebar.open #dkMenuBtn span { background:transparent; } #sitebar.open #dkMenuBtn span::before { top:0; transform:rotate(45deg); } #sitebar.open #dkMenuBtn span::after { top:0; transform:rotate(-45deg); }
  #stage { inset:var(--dk-bar) 0 0 0 !important; height:calc(100% - var(--dk-bar)) !important; }
  #boot { z-index:40; padding-top:var(--dk-bar); box-sizing:border-box; }
  @media (max-width: 1180px) { #dkNav a { padding:8px 9px; font-size:10.5px; letter-spacing:.6px; } .dk-brand small { display:none; } }
  @media (max-width: 1020px) {
    :root { --dk-bar: 56px; }
    #dkMenuBtn { display:block; }
    #dkAuth { margin-left:auto; } #dkMenuBtn { margin-left:0; }
    .dk-user span { display:none; } .dk-user { padding:3px; } .dk-out { display:none; }
    #dkNav { display:none; position:fixed; top:var(--dk-bar); left:0; right:0; bottom:0; flex-direction:column; align-items:stretch; gap:6px; padding:16px; margin:0; background:rgba(5,5,16,.985); overflow-y:auto; z-index:99; }
    #sitebar.open #dkNav { display:flex; }
    #dkNav a { padding:15px 18px; font-size:14px; border-color:rgba(0,243,255,.35); border-radius:14px; }
    #dkNav .dk-m-out { display:block; text-align:center; margin-top:8px; padding:14px; border:1.5px solid rgba(255,255,255,.35); border-radius:14px; background:none; color:#fff; font:700 13px Orbitron,Arial,sans-serif; letter-spacing:1px; cursor:pointer; }
  }
  @media (min-width: 1021px) { #dkNav .dk-m-out { display:none; } }
  @media (max-width: 380px) { .dk-brand b { font-size:12px; letter-spacing:1px; } }
  #stage { position:fixed; inset:0; width:100%; height:100%; border:0; background:#050510; display:block; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#00f3ff;
          font:700 1.4em Orbitron, 'Courier New', monospace; letter-spacing:4px; background:#050510; transition:opacity .3s; pointer-events:none; }
  #boot.hide { opacity:0; }
</style>
</head>
<body>
<header id="sitebar" role="banner">
  <a class="dk-brand" href="#/home" aria-label="Diane Keaton Legacy Entertainment Center — home"><b>DIANE KEATON</b><small>LEGACY ENTERTAINMENT CENTER</small></a>
  <nav id="dkNav" aria-label="Main navigation"></nav>
  <div id="dkAuth"></div>
  <button id="dkMenuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="dkNav"><span></span></button>
</header>
<div id="boot">LOADING ARCADE…</div>
<iframe id="stage" title="Diane's Arcade" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>

<script>
/* backend.js — Supabase adapter for The Diane Keaton Legacy Entertainment Center.
   Loaded by index.html (parent shell). Pages inside the iframe call parent.DKBackend.
   Only PUBLIC values go here. Never put the service-role key or DB password in this file. */
(function () {
  'use strict';

  /* ===== STEP: PASTE YOUR TWO PUBLIC VALUES HERE ===== */
  var SUPABASE_URL = 'https://xkjkrxnmimwmxftrrkha.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_8rZwgg5Cz0DpNelyA45rFg_T6M6ZKi7'; // publishable key: safe in the browser; security comes from RLS
  /* =================================================== */

  var CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  var LS = window.localStorage;
  var B = window.DKBackend = {
    status: 'unconfigured', ready: false, user: null, client: null,
    online: null, listeners: [],
    integrations: { bot: null /* plug the replacement AI bot in here; nothing is connected yet */ }
  };

  /* ---------- status pill (truthful connection state) ---------- */
  var pill = document.createElement('div');
  pill.setAttribute('role', 'status');
  pill.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:99999;font:12px sans-serif;padding:4px 10px;border-radius:12px;background:#111c;color:#fff;pointer-events:none';
  document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(pill); paint(); });
  function paint() {
    var t = { unconfigured: 'Backend not configured (local mode)', connecting: 'Connecting…', online: 'Online', offline: 'Offline — retrying' }[B.status];
    if (B.status === 'online' && B.online != null) t += ' · ' + B.online + ' online';
    pill.textContent = t;
  }
  function setStatus(s) { B.status = s; B.ready = s === 'online'; paint(); B.listeners.forEach(function (f) { try { f(s); } catch (e) {} }); }
  B.onStatus = function (f) { B.listeners.push(f); };

  function friendly(e) {
    var m = (e && e.message) || String(e);
    if (/Failed to fetch|NetworkError/i.test(m)) return 'Cannot reach the server. Check your connection and try again.';
    if (/quota|rate limit|429|402|exceed/i.test(m)) return 'The service has hit a free-plan limit. Please try again later.';
    if (/Database error saving new user/i.test(m)) return 'That username is invalid (3–20 letters, numbers, _) or already taken.';
    if (/Invalid login/i.test(m)) return 'Wrong email or password.';
    return m;
  }
  function need() { if (!B.client) throw new Error('Backend is not connected.'); }

  /* ---------- init ---------- */
  B.init = function () {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return setStatus('unconfigured');
    setStatus('connecting');
    var s = document.createElement('script');
    s.src = CDN;
    s.onerror = function () { setStatus('offline'); };
    s.onload = function () {
      B.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
      B.client.auth.getSession().then(function (r) {
        B.user = r.data.session ? r.data.session.user : null;
        setStatus('online');
        if (B.user) { B.syncCache(); startPresence(); flushPending(); }
      }).catch(function () { setStatus('offline'); });
      B.client.auth.onAuthStateChange(function (_e, sess) {
        B.user = sess ? sess.user : null;
        if (B.user) { startPresence(); } else { stopPresence(); }
      });
    };
    document.head.appendChild(s);
    window.addEventListener('online', function () { if (B.client) { setStatus('online'); flushPending(); } });
    window.addEventListener('offline', function () { if (B.client) setStatus('offline'); });
  };

  /* ---------- auth (Supabase Auth owns passwords) ---------- */
  B.register = function (username, email, password) {
    need();
    return B.client.auth.signUp({ email: email, password: password, options: { data: { username: username } } })
      .then(function (r) {
        if (r.error) throw new Error(friendly(r.error));
        if (!r.data.session) return { needsConfirm: true };
        B.user = r.data.user; return B.syncCache().then(function () { return { needsConfirm: false }; });
      });
  };
  B.login = function (email, password) {
    need();
    if (email.indexOf('@') < 0) return Promise.reject(new Error('Sign in with your email address (usernames are for display).'));
    return B.client.auth.signInWithPassword({ email: email, password: password }).then(function (r) {
      if (r.error) throw new Error(friendly(r.error));
      B.user = r.data.user; return B.syncCache();
    });
  };
  B.logout = function () { if (!B.client) return Promise.resolve(); return B.client.auth.signOut().then(function () { B.user = null; }); };
  B.resetPassword = function (email) { need(); return B.client.auth.resetPasswordForEmail(email); };

  /* ---------- compatibility cache: keeps legacy pages that read localStorage 'arcadeUser' working.
     The SERVER is authoritative; this cache is overwritten on every sync. ---------- */
  B.syncCache = function () {
    if (!B.client || !B.user) return Promise.resolve(null);
    return Promise.all([
      B.client.from('profiles').select('*').eq('id', B.user.id).single(),
      B.client.from('user_achievements').select('achievement_id').eq('user_id', B.user.id),
      B.client.from('inventory').select('item_id').eq('user_id', B.user.id).then(function (x) { return x.data || []; }, function () { return []; }),
      B.client.from('badge_applications').select('item_id').eq('user_id', B.user.id).eq('status', 'approved').then(function (x) { return x.data || []; }, function () { return []; })
    ]).then(function (r) {
      var p = r[0].data; if (!p) return null;
      var u = { username: p.username, email: B.user.email, xp: p.xp, coins: p.points, level: p.level,
        gamesPlayed: p.games_played, moviesWatched: p.movies_watched,
        unlockedAchievements: (r[1].data || []).map(function (a) { return a.achievement_id; }),
        badges: r[2].filter(function (i) { return /_badge$/.test(i.item_id) || i.item_id === 'verified_discord' || i.item_id === 'diane_bot_developer'; }).map(function (i) { return i.item_id; }).concat(r[3].map(function (i) { return i.item_id; })),
        inventory: r[2].map(function (i) { return { item_id: i.item_id }; }), joinDate: p.created_at, avatar: p.avatar_url, banner: p.banner_url,
        gamesHistory: {}, moviesHistory: {}, _fromBackend: true };
      LS.setItem('arcadeUser', JSON.stringify(u)); LS.setItem('isLoggedIn', 'true');
      return u;
    }).catch(function () { return null; });
  };
  B.evaluateAchievements = function () { need(); return B.client.rpc('evaluate_achievements').then(function (r) { if (r.error) throw r.error; return r.data; }); };
  B.myBoosts = function () { need(); return B.client.from('user_boosts').select('item_id,expires_at').eq('user_id', B.user.id).gt('expires_at', new Date().toISOString()).order('expires_at'); };
  B.uploadProfileImage = function (blob, kind) {
    need(); if (!B.user) return Promise.reject(new Error('Sign in first.'));
    var ext = /png/.test(blob.type) ? 'png' : /webp/.test(blob.type) ? 'webp' : /gif/.test(blob.type) ? 'gif' : 'jpg';
    var path = B.user.id + '/' + kind + '-' + Date.now() + '.' + ext;
    return B.client.storage.from('avatars').upload(path, blob, { contentType: blob.type || undefined, upsert: false }).then(function (r) {
      if (r.error) throw new Error(friendly(r.error));
      return B.client.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    });
  };
  B.updateProfile = function (fields) { // only bio/avatar_url/banner_url are permitted by the database
    need(); return B.client.from('profiles').update(fields).eq('id', B.user.id);
  };

  /* ---------- scores (server validates; duplicates blocked by event id) ---------- */
  function pending() { try { return JSON.parse(LS.getItem('dk_pending_scores') || '[]'); } catch (e) { return []; } }
  function savePending(a) { LS.setItem('dk_pending_scores', JSON.stringify(a)); }
  function send(item) {
    return B.client.rpc('submit_score', { p_game: item.g, p_score: item.s, p_event_id: item.e }).then(function (r) {
      if (r.error) throw r.error; return r.data;
    });
  }
  function flushPending() {
    try { LS.removeItem('dk_pending_scores'); } catch (e) {}   /* old self-reported queue is discarded */
    return;
    if (!B.ready || !B.user) return;
    pending().forEach(function (it) {
      send(it).then(function () { savePending(pending().filter(function (x) { return x.e !== it.e; })); })
        .catch(function (e) { if (!/network|fetch/i.test(String(e.message))) savePending(pending().filter(function (x) { return x.e !== it.e; })); });
    });
  }
  B.submitScore = function () { return Promise.reject(new Error('Scores are recorded automatically by the site. They cannot be entered by hand.')); };
  B.recordPlay = function (gameId) { need(); return B.client.rpc('record_game_play', { p_game: String(gameId) }).then(function (r) { if (r.error) throw r.error; return r.data; }); };
  /* ---------- automatic scores (see 011_auto_scores.sql) ---------- */
  B.leaderboard = function (gameId, limit) {
    need(); return B.client.from('game_best').select('user_id,game_id,best_score,achieved_at,username,avatar_url').eq('game_id', gameId).order('best_score', { ascending: false }).limit(limit || 50);
  };
  B.userBestScores = function (uid) { need(); return B.client.from('game_best').select('game_id,best_score,achieved_at').eq('user_id', uid).order('best_score', { ascending: false }); };
  B.scoreBegin = function (gameId) { need(); return B.client.rpc('start_game_session', { p_game: String(gameId) }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  B.scoreFinish = function (sessionId, score) { need(); return B.client.rpc('finish_game_session', { p_session: sessionId, p_score: Math.floor(score) }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  B.adminFlags = function () { need(); return B.client.from('score_flags').select('*').eq('status', 'pending').order('created_at'); };
  B.adminReviewScore = function (id, approve) { need(); return B.client.rpc('admin_review_score', { p_flag: id, p_approve: approve }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  B.adminLimits = function () { need(); return B.client.from('game_limits').select('*').order('game_id'); };
  B.adminSetLimit = function (game, max, pps, min) { need(); return B.client.rpc('admin_set_game_limit', { p_game: game, p_max: max, p_pps: pps, p_min: min }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  B.xpLeaderboard = function (limit) { need(); return B.client.from('profiles').select('username,xp,level,avatar_url').order('xp', { ascending: false }).limit(limit || 50); };
  B.globalLeaderboard = function (limit) {
    need(); return B.client.from('profiles').select('username,points,level').order('points', { ascending: false }).limit(limit || 25);
  };

  /* ---------- realtime ---------- */
  B.subscribe = function (table, filter, cb) { // returns unsubscribe fn
    need();
    var ch = B.client.channel('rt-' + table + '-' + Math.random().toString(36).slice(2))
      .on('postgres_changes', Object.assign({ event: '*', schema: 'public', table: table }, filter ? { filter: filter } : {}), cb)
      .subscribe(function (st) { if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setStatus('offline'); else if (st === 'SUBSCRIBED') setStatus('online'); });
    return function () { B.client.removeChannel(ch); };
  };
  var presence = null;
  function startPresence() {
    if (presence || !B.client || !B.user) return;
    presence = B.client.channel('presence-global', { config: { presence: { key: B.user.id } } });
    presence.on('presence', { event: 'sync' }, function () { B.online = Object.keys(presence.presenceState()).length; paint(); })
      .subscribe(function (st) { if (st === 'SUBSCRIBED') presence.track({ at: Date.now() }); });
  }
  function stopPresence() { if (presence) { B.client.removeChannel(presence); presence = null; B.online = null; paint(); } }

  /* ---------- community ---------- */
  B.activity = function (limit) { need(); return B.client.from('activity').select('*, profiles(username)').order('created_at', { ascending: false }).limit(limit || 30); };
  B.notifications = function () { need(); return B.client.from('notifications').select('*').eq('user_id', B.user.id).order('created_at', { ascending: false }).limit(50); };
  B.follow = function (uid) { need(); return B.client.from('follows').insert({ follower: B.user.id, followed: uid }); };
  B.unfollow = function (uid) { need(); return B.client.from('follows').delete().eq('follower', B.user.id).eq('followed', uid); };
  B.like = function (type, id) { need(); return B.client.from('likes').insert({ user_id: B.user.id, target_type: type, target_id: String(id) }); };
  B.friendRequest = function (uid) { need(); return B.client.from('friendships').insert({ requester: B.user.id, addressee: uid }); };
  B.watchStart = function (provider, title) { need(); return B.client.from('watch_sessions').insert({ user_id: B.user.id, provider: provider, title: title }).select().single(); };
  B.watchEnd = function (id, seconds) { need(); return B.client.from('watch_sessions').update({ ended_at: new Date().toISOString(), seconds: Math.max(0, Math.floor(seconds)) }).eq('id', id); };

  /* ---------- memories (RLS: approved are public; owners see their own; admins see all) ---------- */
  B.memoriesList = function () { need(); return B.client.from('memories').select('*').order('created_at', { ascending: false }).limit(200); };
  B.profilesByIds = function (ids) { need(); return B.client.from('profiles').select('id,username,avatar_url').in('id', ids); };
  B.memorySave = function (m) { need(); if (!B.user) return Promise.reject(new Error('Sign in first.')); return B.client.from('memories').insert(Object.assign({ user_id: B.user.id }, m)).select().single(); };
  B.memoryUpload = function (blob, kind) {
    need(); if (!B.user) return Promise.reject(new Error('Sign in first.'));
    var ext = kind === 'video' ? (/webm/.test(blob.type) ? 'webm' : 'mp4') : (/png/.test(blob.type) ? 'png' : /webp/.test(blob.type) ? 'webp' : 'jpg');
    var path = B.user.id + '/' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)) + '.' + ext;
    return B.client.storage.from('memories').upload(path, blob, { contentType: blob.type || undefined, upsert: false }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return path; });
  };
  B.memoryUrl = function (path) { need(); return B.client.storage.from('memories').getPublicUrl(path).data.publicUrl; };
  B.memoryModerate = function (id, status) { need(); return B.client.rpc('moderate_memory', { p_id: id, p_status: status }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); }); };
  B.memoryDelete = function (id) { need(); return B.client.from('memories').delete().eq('id', id).then(function (r) { if (r.error) throw new Error(friendly(r.error)); }); };

  /* ---------- shop (all balance changes happen in database functions) ---------- */
  function rpcErr(r) { if (r.error) { var m = r.error.message || ''; if (/not enough coins/i.test(m)) m = 'Not enough coins!'; else if (/sign in/i.test(m)) m = 'Please log in first.'; else if (/unavailable/i.test(m)) m = 'That item is not available.'; throw new Error(m || friendly(r.error)); } return r.data; }
  B.myCoins = function () { need(); return B.client.from('profiles').select('points').eq('id', B.user.id).single(); };
  B.purchaseItem = function (itemId) { need(); return B.client.rpc('purchase_item', { p_item: itemId }).then(rpcErr); };
  B.purchaseBot = function (plan, months, serverId, serverName) { need(); return B.client.rpc('purchase_bot', { p_plan: plan, p_months: months, p_server_id: serverId, p_server_name: serverName }).then(rpcErr); };
  B.applyBadge = function (itemId, answers) { need(); return B.client.from('badge_applications').insert({ user_id: B.user.id, item_id: itemId, answers: answers }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); }); };

  /* ---------- admin tools (server re-verifies is_admin() on every call) ---------- */
  function adm(p) { return p.then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); }
  B.adminUsers = function () { need(); return adm(B.client.rpc('admin_list_users')); };
  B.adminAction = function (username, action, amount) { need(); return adm(B.client.rpc('admin_user_action', { p_username: username, p_action: action, p_amount: amount == null ? null : amount })); };

  B.tvChannels = function () { need(); return B.client.from('channels').select('*').eq('is_active', true).order('number'); };
  B.tvItems = function (channelId) { need(); return B.client.from('channel_items').select('*').eq('channel_id', channelId).order('position'); };

  B.tvAdminChannels = function () { need(); return B.client.from('channels').select('*').order('number'); }; // admins also see inactive channels (RLS)

  B.backupLocal = function () {
    var dump = {}; for (var i = 0; i < LS.length; i++) { var k = LS.key(i); dump[k] = LS.getItem(k); }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' }));
    a.download = 'arcade-local-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  };
  /* Uploads the old local record for the signed-in email as a PENDING import. Old passwords are stripped.
     Balances are NOT trusted (local data can be edited); an admin approves what is granted. One import per user. */
  B.migrateLocal = function () {
    need(); if (!B.user) return Promise.reject(new Error('Sign in first.'));
    var found = null;
    for (var i = 0; i < LS.length; i++) {
      var k = LS.key(i); if (k.indexOf('user_') !== 0) continue;
      try { var u = JSON.parse(LS.getItem(k)); if (u.email && u.email.toLowerCase() === B.user.email.toLowerCase()) { found = u; break; } } catch (e) {}
    }
    if (!found) return Promise.resolve({ found: false });
    delete found.password;
    var body = JSON.stringify(found);
    return B.client.from('legacy_imports').upsert({ user_id: B.user.id, payload: found }, { onConflict: 'user_id', ignoreDuplicates: true })

        if (r.error) throw new Error(friendly(r.error));
        return B.client.from('legacy_imports').select('payload').eq('user_id', B.user.id).single();
      }).then(function (r) { return { found: true, verified: JSON.stringify(r.data.payload) === body || !!r.data.payload }; });
  };

  B.init();
})();

            { id: 'curator', name: 'Curator', desc: 'Unlock 50 achievements', icon: '📚', xp: 250, film: 'Achievement Master', category: 'gaming' },
            { id: 'archivist', name: 'Archivist', desc: 'Unlock 100 achievements', icon: '📚', xp: 500, film: 'Achievement God', category: 'gaming' }
        ];
        
        let currentFilter = 'all';
        
        function getUser() {
            const userData = localStorage.getItem('arcadeUser');
            return userData ? JSON.parse(userData) : null;
        }
        
        function saveUser(user) {
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            localStorage.setItem('user_' + user.username, JSON.stringify(user));
        }
        
        function checkAndUnlockAchievements() {
            const user = getUser();
            if (!user) return;
            
            if (!user.achievements) user.achievements = [];
            if (!user.unlockedAchievements) user.unlockedAchievements = [];
            
            let newUnlocks = 0;
            
            ALL_ACHIEVEMENTS.forEach(ach => {
                if (user.unlockedAchievements.includes(ach.id)) return;
                
                let shouldUnlock = false;
                
                // Check conditions for auto-unlock
                switch(ach.id) {
                    case 'first_steps':
                        shouldUnlock = true;
                        break;
                    case 'annie_hall':
                        shouldUnlock = (user.gamesPlayed || 0) >= 1;
                        break;
                    case 'coffee_break':
                        shouldUnlock = (user.gamesPlayed || 0) >= 5;
                        break;
                    case 'godfather':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 10;
                        break;
                    case 'godfather_2':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 20;
                        break;
                    case 'manhattan':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 25;
                        break;
                    case 'marvins_room':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 50;
                        break;
                    case 'century':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 100;
                        break;
                    case 'movie_buff':
                        shouldUnlock = (user.moviesWatched || 0) >= 5;
                        break;
                    case 'film_fanatic':
                        shouldUnlock = (user.moviesWatched || 0) >= 10;
                        break;
                    case 'cinema_devotee':
                        shouldUnlock = (user.moviesWatched || 0) >= 25;
                        break;
                    case 'diane_devotee':
                        shouldUnlock = (user.moviesWatched || 0) >= 40;
                        break;
                    case 'coin_collector':
                        shouldUnlock = (user.totalCoinsEarned || user.coins || 0) >= 1000;
                        break;
                    case 'hoarder':
                        shouldUnlock = (user.totalCoinsEarned || user.coins || 0) >= 10000;
                        break;
                    case 'millionaire':
                        shouldUnlock = (user.totalCoinsEarned || user.coins || 0) >= 1000000;
                        break;
                    case 'father_bride':
                        shouldUnlock = (user.gamesPlayed || 0) >= 100;
                        break;
                    case 'manhattan_murder':
                        shouldUnlock = (user.uniqueGamesPlayed || 0) >= 20;
                        break;
                    case 'collector':
                        shouldUnlock = user.unlockedAchievements.length >= 10;
                        break;
                    case 'curator':
                        shouldUnlock = user.unlockedAchievements.length >= 50;
                        break;
                    case 'archivist':
                        shouldUnlock = user.unlockedAchievements.length >= 100;
                        break;
                    case 'interiors':
                        shouldUnlock = user.avatar && user.banner;
                        break;
                    case 'badge_hunter':
                        shouldUnlock = (user.badges || []).length >= 5;
                        break;
                    case 'first_purchase':
                        shouldUnlock = (user.totalPurchases || 0) >= 1;
                        break;
                    case 'big_spender':
                        shouldUnlock = (user.totalSpent || 0) >= 10000;
                        break;
                    case 'whale':
                        shouldUnlock = (user.totalSpent || 0) >= 100000;
                        break;
                    case 'xp_apprentice':
                        shouldUnlock = (user.xp || 0) >= 1000;
                        break;
                    case 'xp_expert':
                        shouldUnlock = (user.xp || 0) >= 10000;
                        break;
                    case 'xp_legend':
                        shouldUnlock = (user.xp || 0) >= 100000;
                        break;
                    case 'mad_money':
                        shouldUnlock = (user.xp || 0) >= 100000;
                        break;
                }
                
                if (shouldUnlock) {
                    user.unlockedAchievements.push(ach.id);
                    user.xp = (user.xp || 0) + ach.xp;
                    newUnlocks++;
                }
            });
            
            if (newUnlocks > 0) {
                saveUser(user);
            }
        }
        
        function calculateLevel(xp) {
            return Math.floor(Math.sqrt(xp / 100)) + 1;
        }
        
        function loadAchievements() {
            checkAndUnlockAchievements();
            
            const user = getUser();
            const unlockedIds = user ? (user.unlockedAchievements || []) : [];
            
            const container = document.getElementById('achievements-container');
            container.innerHTML = '';
            
            let unlockedCount = 0;
            let totalXP = 0;
            
            ALL_ACHIEVEMENTS.forEach(achievement => {
                const isUnlocked = unlockedIds.includes(achievement.id);
                
                if (isUnlocked) {
                    unlockedCount++;
                    totalXP += achievement.xp;
                }
                
                // Apply filter
                if (currentFilter === 'unlocked' && !isUnlocked) return;
                if (currentFilter === 'locked' && isUnlocked) return;
                if (currentFilter !== 'all' && currentFilter !== 'unlocked' && currentFilter !== 'locked') {
                    if (achievement.category !== currentFilter) return;
                }
                
                const card = document.createElement('div');
                card.className = 'achievement-card' + (isUnlocked ? '' : ' locked');
                
                card.innerHTML = `
                    ${!isUnlocked ? '<div class="lock-icon">🔒</div>' : ''}
                    <div class="achievement-badge">${achievement.icon}</div>
                    <h4>${achievement.name}</h4>
                    <p>${achievement.desc}</p>
                    <div class="achievement-film">${achievement.film}</div>
                    <div class="achievement-xp">+${achievement.xp} XP</div>
                `;
                
                container.appendChild(card);
            });
            
            // Update stats
            document.getElementById('unlocked-count').textContent = unlockedCount;
            document.getElementById('total-count').textContent = ALL_ACHIEVEMENTS.length;
            const completion = Math.round((unlockedCount / ALL_ACHIEVEMENTS.length) * 100);
            document.getElementById('completion').textContent = completion + '%';
            document.getElementById('total-xp').textContent = totalXP.toLocaleString();
        }
        
        function filterAchievements(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            loadAchievements();
        }
        
        // Auto-check achievements every 30 seconds
        setInterval(checkAndUnlockAchievements, 30000);
        
        loadAchievements();
    <\/script>
</body>

</script>

                    if (B.status === 'unconfigured' || B.status === 'offline' || tries++ > 50) return reject(new Error('Cannot reach the server right now.'));
                    setTimeout(w, 200);
                })();
            });
        }
        function getAllPlayers() {
            return waitBackend().then(function (B) { return B.xpLeaderboard(50); }).then(function (r) {
                if (r.error) throw r.error;
                return (r.data || []).map(function (p) { return { username: p.username, xp: p.xp || 0, level: p.level || 1, avatar: p.avatar_url, achievementsCount: null }; });
            });
        }
        function getGameScores(gameId) {
            return waitBackend().then(function (B) { return B.leaderboard(gameId, 50); }).then(function (r) {
                if (r.error) throw r.error;
                return (r.data || []).map(function (s) {
                    return { username: s.username || 'Player', score: Number(s.best_score) || 0, avatar: s.avatar_url || null, date: s.achieved_at || null };
                });
            });
        }
        function checkWeeklyReset() { /* removed: the old reset only wiped local copies. Rankings now come from the server. */ }

        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            monday.setHours(0, 0, 0, 0);
            return monday;
        }
        
        function showCategory(category) {
            document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.leaderboard-section').forEach(sec => sec.classList.remove('active'));
            document.querySelector(`.category-tab[data-category="${category}"]`)?.classList.add('active');
            document.getElementById(`${category}-section`)?.classList.add('active');
            const isGlobal = category === 'global';
            const tb = document.getElementById(`${category}-tbody`);
            if (tb) tb.innerHTML = '<tr><td colspan="6" class="no-data">Loading…</td></tr>';
            (isGlobal ? getAllPlayers() : getGameScores(category)).then(function (rows) {
                createPodium(rows, `${category}-podium`, isGlobal ? 'xp' : 'score');
                if (isGlobal) populateGlobalTable(rows, `${category}-tbody`); else populateGameTable(rows, `${category}-tbody`);
            }).catch(function (err) {
                if (tb) tb.innerHTML = '<tr><td colspan="6" class="no-data">Could not load rankings: ' + String(err && err.message || err).replace(/[<>&]/g, '') + '</td></tr>';
            });
        }
        
        function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function plink(name, cls) { return '<a class="' + (cls || 'player-link') + '" href="profile.html?user=' + encodeURIComponent(name) + '" style="color:inherit;text-decoration:none" title="View ' + esc(name) + '\'s profile">' + esc(name) + '</a>'; }
        
        function createPodium(players, containerId, scoreType) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            if (players.length === 0) {
                container.innerHTML = `<div class="no-data"><div class="no-data-icon">🏆</div>No scores yet!</div>`;
                return;
            }

            const medals = ['🥇', '🥈', '🥉'];
            const classes = ['podium-1', 'podium-2', 'podium-3'];

            for (let i = 0; i < 3 && i < players.length; i++) {
    const p = players[i];
    const div = document.createElement('div');
    div.className = `podium-place ${classes[i]}`;
    
    const scoreVal = scoreType === 'xp' 
        ? `${(p.xp || 0).toLocaleString()} XP`
        : `${(p.score || 0).toLocaleString()}`;
    
    let avatar = p.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${p.username}`;
                div.innerHTML = `
                    <div class="podium-rank">${medals[i]}</div>
                    <a href="profile.html?user=${encodeURIComponent(p.username)}"><img src="${esc(avatar)}" alt="${esc(p.username)}" class="podium-avatar"></a>
                    <div class="podium-username">${plink(p.username)}</div>
                    <div class="podium-score">${scoreVal}</div>
                `;
                container.appendChild(div);
            }
        }
        
        function populateGlobalTable(players, tbodyId) {
            const tbody = document.getElementById(tbodyId);
            if (!tbody) return;
            tbody.innerHTML = '';

            if (players.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="no-data"><div class="no-data-icon">🎮</div>No players yet!</td></tr>`;
                return;
            }

            players.forEach((p, i) => {
                const rank = i + 1;
                const rankClass = rank <= 3 ? 'rank-top3' : '';
                const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
                const avatar = p.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${p.username}`;

                tbody.innerHTML += `
                    <tr>
                        <td class="rank-cell ${rankClass}">${rankEmoji} #${rank}</td>
                        <td>
                            <div class="player-cell">
                                <img src="${avatar}" class="player-avatar">
                                <div>
                                    <div class="player-name">${plink(p.username)}</div>
                                    <div class="player-level">Level ${p.level || 1}</div>
                                </div>
                            </div>
                        </td>
                        <td>${p.level || 1}</td>
                        <td class="score-cell">${(p.xp || 0).toLocaleString()}</td>
                        <td>${p.achievementsCount == null ? '—' : p.achievementsCount + '/105'}</td>
                        <td><a href="profile.html?user=${encodeURIComponent(p.username)}" class="view-profile-btn">VIEW</a></td>
                    </tr>
                `;
            });
        }
        
        function populateGameTable(scores, tbodyId) {
            const tbody = document.getElementById(tbodyId);
            if (!tbody) return;
            tbody.innerHTML = '';

            if (scores.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="no-data"><div class="no-data-icon">🎮</div>No scores yet!</td></tr>`;
                return;
            }

            scores.forEach((s, i) => {
                const rank = i + 1;
                const rankClass = rank <= 3 ? 'rank-top3' : '';
                const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
                const avatar = s.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${s.username}`;
                const date = s.date ? new Date(s.date).toLocaleDateString() : 'N/A';

                tbody.innerHTML += `
                    <tr>
                        <td class="rank-cell ${rankClass}">${rankEmoji} #${rank}</td>
                        <td>
                            <div class="player-cell">
                                <img src="${avatar}" class="player-avatar">
                                <div class="player-name">${plink(s.username)}</div>
                            </div>
                        </td>
                        <td class="score-cell">${(s.score || 0).toLocaleString()}</td>
                        <td>${date}</td>
                        <td><a href="profile.html?user=${s.username}" class="view-profile-btn">VIEW</a></td>
                    </tr>
                `;
            });
        }
        
        function buildLeaderboards() {
            const tabsContainer = document.getElementById('category-tabs');
            const lbContainer = document.getElementById('leaderboards-container');

            tabsContainer.innerHTML = '';
            Object.keys(GAMES).forEach((key, idx) => {
                const game = GAMES[key];
                const btn = document.createElement('button');
                btn.textContent = `${game.icon} ${game.name.toUpperCase()}`;
                btn.className = 'category-tab' + (idx === 0 ? ' active' : '');
                btn.dataset.category = key;
                btn.onclick = () => showCategory(key);
                tabsContainer.appendChild(btn);
            });

            lbContainer.innerHTML = '';
            Object.keys(GAMES).forEach(key => {
                const game = GAMES[key];
                const isGlobal = key === 'global';
                
                lbContainer.innerHTML += `
                    <div class="leaderboard-section ${key === 'global' ? 'active' : ''}" id="${key}-section">
                        <div class="leaderboard-header">
                            <h2 class="leaderboard-title">${game.icon} ${game.name.toUpperCase()}</h2>
                            <p class="leaderboard-subtitle">${game.subtitle}</p>
                        </div>
                        <div class="podium" id="${key}-podium"></div>
                        <div class="leaderboard-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>RANK</th>
                                        <th>PLAYER</th>
                                        ${isGlobal ? '<th>LEVEL</th><th>TOTAL XP</th><th>ACHIEVEMENTS</th>' : '<th>SCORE</th><th>DATE</th>'}
                                        <th>ACTION</th>
                                    </tr>
                                </thead>
                                <tbody id="${key}-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            checkWeeklyReset();
            showCategory('global');
        }
        
        // Save score function for game.html to use
        // Initialize leaderboards on page load
        document.addEventListener('DOMContentLoaded', function() {
            buildLeaderboards();
            var want = new URLSearchParams(window.__SEARCH || '').get('game');
            if (want && document.getElementById(want + '-section')) showCategory(want);
        });
    <\/script>
</body>
</html>
</script>

                <p>When we received the heartbreaking news of her passing, it shook our team to its core. The bot captures Diane's warmth and wit — in those moments, she feels alive again.</p>
                
                <p style="text-align: center; font-size: 1.3em; margin-top: 30px; color: var(--neon-pink);"><strong>Rest easy, Diane — you were one of a kind. 💖</strong></p>
            </div>
            
            <button class="add-memory-btn" onclick="openMemoryModal()">❤️ SHARE YOUR MEMORY</button>
            <p style="text-align: center; margin-top: 15px; opacity: 0.8; font-size: 1.1em;">Share your favorite Diane Keaton moments, photos, and what inspired you about her legendary career.</p>

    <div class="modal" id="memory-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeMemoryModal()">×</button>
            <h2 class="modal-title">Share Your Memory</h2>
            
            <form id="memory-form" onsubmit="submitMemory(event)">
                <div class="file-upload-section">
                    <input type="file" id="memory-media" accept="image/*,video/*" onchange="previewMedia(event)">
                    <label for="memory-media" class="upload-label">📸 ADD PHOTO/VIDEO</label>
                    <p style="margin-top: 15px; opacity: 0.7; font-size: 0.9em;"><strong>REQUIRED:</strong> Add a photo or video of Diane Keaton (Max 1000MB)</p>
                    <img id="media-preview-image" class="preview-image">
                    <video id="media-preview-video" class="preview-video" controls></video>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Your Memory: *</label>
                    <textarea class="form-textarea" id="memory-text" required placeholder="Share your thoughts, favorite moments, or how Diane Keaton inspired you..."></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">What inspired you about Diane Keaton? *</label>
                    <input type="text" class="form-input" id="memory-inspiration" required placeholder="Her humor, creativity, authenticity...">
                </div>
                
                <button type="submit" class="submit-btn">❤️ POST MEMORY</button>
            </form>
        </div>
    </div>
    
    <script>
        let mediaFile = null;
        let mediaType = null;
        
        function MB() { try { return parent.DKBackend; } catch (e) { return null; } }
        function waitB() {
            return new Promise(function (res, rej) {
                var B = MB(), n = 0;
                (function w() {
                    if (!B) return rej(new Error('Backend unavailable.'));
                    if (B.client) return res(B);
                    if (B.status === 'unconfigured' || B.status === 'offline' || n++ > 50) return rej(new Error('Cannot reach the server right now.'));
                    setTimeout(w, 200);
                })();
            });
        }
        // Signed-in user from the real Supabase session (null if logged out). Display name comes from the server profile.
        function getUser() {
            var B = MB();
            if (!B || !B.user) return null;
            return { id: B.user.id, username: (B.user.user_metadata && B.user.user_metadata.username) || 'Member' };
        }
        var IS_ADMIN = false;

        function loadMemories() {
            const container = document.getElementById('memories-grid');
            waitB().then(function (B) {
                return Promise.all([B.memoriesList(), B.isAdmin().catch(function () { return false; })]).then(function (x) {
                    IS_ADMIN = !!x[1];
                    if (x[0].error) throw x[0].error;
                    const rows = x[0].data || [];
                    const ids = Array.from(new Set(rows.map(function (r) { return r.user_id; }).filter(Boolean)));
                    return (ids.length ? B.profilesByIds(ids) : Promise.resolve({ data: [] })).then(function (p) {
                        const byId = {}; ((p && p.data) || []).forEach(function (u) { byId[u.id] = u; });
                        return { rows: rows, byId: byId, B: B };
                    });
                });
            }).then(function (ctx) { renderMemories(ctx.rows, ctx.byId, ctx.B); })
            .catch(function (e) {
                console.error('Error loading memories:', e);
                container.innerHTML = '<div class="no-memories" style="grid-column: 1/-1;"><p style="color: var(--neon-pink);">Could not load memories: ' + escapeHtml(String((e && e.message) || e)) + '</p></div>';
            });
        }

        function renderMemories(memories, byId, B) {
            const container = document.getElementById('memories-grid');
            const me = getUser();
            if (memories.length === 0) {
                container.innerHTML = `
                    <div class="no-memories" style="grid-column: 1/-1;">
                        <div class="no-memories-icon">❤️</div>
                        <h3 style="font-family: 'Orbitron', sans-serif; font-size: 2em; margin-bottom: 20px; color: var(--neon-pink);">No memories shared yet</h3>
                        <p style="font-size: 1.2em;">Be the first to share a memory of Diane Keaton!</p>
                    </div>`;
                return;
            }
            container.innerHTML = memories.map(function (m) {
                const prof = byId[m.user_id] || {};
                const username = m.author_name || prof.username || 'Member';
                const profHref = (m.author_name || prof.username) ? 'profile.html?user=' + encodeURIComponent(m.author_name || prof.username) : (m.user_id ? 'profile.html?id=' + encodeURIComponent(m.user_id) : 'profile.html');
                const date = new Date(m.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                const avatar = prof.avatar_url || ('https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(username));
                let mediaHTML = '';
                if (m.image_path) {
                    const url = B.memoryUrl(m.image_path);
                    mediaHTML = (m.media_type === 'video' || /\.(mp4|webm)$/i.test(m.image_path))
                        ? '<video src="' + escapeHtml(url) + '" class="memory-media" controls></video>'
                        : '<img src="' + escapeHtml(url) + '" alt="Memory" class="memory-media">';
                }
                const mine = me && m.user_id === me.id;
                let tag = '';
                
                if (m.status === 'rejected') tag = '<div style="color:#ff6b6b;font-weight:700;margin:6px 0">✖ Hidden by a moderator' + (mine ? ' (only you can see this)' : '') + '</div>';
                let actions = '';
                if (IS_ADMIN) actions += (m.status === 'rejected' ? '<button onclick="modMemory(\'' + m.id + '\',\'approved\')">✅ Restore</button> ' : '<button onclick="modMemory(\'' + m.id + '\',\'rejected\')">🚫 Hide</button> ');
                if (IS_ADMIN || mine) actions += '<button onclick="delMemory(\'' + m.id + '\')">🗑 Delete</button>';
                return `
                    <div class="memory-card" data-mid="${m.id}">
                        ${mediaHTML}
                        <div class="memory-content">
                            <div class="memory-author">
                                <a href="${profHref}" aria-label="View ${escapeHtml(username)}'s profile"><img src="${escapeHtml(avatar)}" alt="${escapeHtml(username)}" class="author-avatar"></a>
                                <div class="author-info">
                                    <a href="${profHref}" class="author-name">${escapeHtml(username)}</a>
                                    <div class="memory-date">${date}</div>
                                </div>
                            </div>
                            ${tag}
                            <div class="memory-text">${escapeHtml(m.body || '')}</div>
                            <div class="memory-inspiration">
                                <strong style="color: var(--neon-pink);">What inspired me:</strong> ${escapeHtml(m.inspiration || '')}
                            </div>
                            ${actions ? '<div style="margin-top:10px">' + actions + '</div>' : ''}
                        </div>
                    </div>`;
            }).join('');
        }

        function modMemory(id, status) {
            waitB().then(function (B) { return B.memoryModerate(id, status); })
                .then(function () { showNotification(status === 'approved' ? 'Memory approved.' : 'Memory rejected.', 'success'); loadMemories(); })
                .catch(function (e) { showNotification('Error: ' + (e.message || e), 'error'); });
        }
        function delMemory(id) {
            if (!confirm('Delete this memory permanently?')) return;
            waitB().then(function (B) { return B.memoryDelete(id); })
                .then(function () { showNotification('Memory deleted.', 'success'); loadMemories(); })
                .catch(function (e) { showNotification('Error: ' + (e.message || e), 'error'); });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function openMemoryModal() {
            const user = getUser();
            
            if (!user) {
                showNotification('Please create/login to your profile first!', 'error');
                setTimeout(() => {
                    window.__go('profile.html');
                }, 2000);
                return;
            }
            
            console.log('✅ Opening modal for user:', user.username);
            document.getElementById('memory-modal').classList.add('active');
        }
        
        function closeMemoryModal() {
            document.getElementById('memory-modal').classList.remove('active');
            document.getElementById('memory-form').reset();
            document.getElementById('media-preview-image').style.display = 'none';
            document.getElementById('media-preview-video').style.display = 'none';
            mediaFile = null;
            mediaType = null;
        }
        
        function previewMedia(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            console.log('📷 File selected:', file.name, file.size, 'bytes');
            
            if (file.size > 50 * 1024 * 1024) {
                showNotification('File too large! Max 50MB', 'error');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                if (file.type.startsWith('image/')) {
                    // Compress and resize image
                    compressImage(e.target.result, function(compressed) {
                        mediaFile = compressed;
                        mediaType = 'image';
                        const previewImg = document.getElementById('media-preview-image');
                        previewImg.src = compressed;
                        previewImg.style.display = 'block';
                        document.getElementById('media-preview-video').style.display = 'none';
                        console.log('✅ Image compressed from', file.size, 'to ~', Math.round(compressed.length * 0.75), 'bytes');
                    });
                } else if (file.type.startsWith('video/')) {
                    mediaType = 'video';
                    mediaFile = e.target.result;
                    const previewVid = document.getElementById('media-preview-video');
                    previewVid.src = e.target.result;
                    previewVid.style.display = 'block';
                    document.getElementById('media-preview-image').style.display = 'none';
                    console.log('✅ Video loaded');
                }
            };
            reader.readAsDataURL(file);
        }
        
        function compressImage(dataUrl, callback) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                // Resize if larger than 1920x1080
                const maxWidth = 1920;
                const maxHeight = 1080;
                
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = width * ratio;
                    height = height * ratio;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Compress to 0.7 quality JPEG
                const compressed = canvas.toDataURL('image/jpeg', 0.7);
                callback(compressed);
            };
            img.src = dataUrl;
        }
        
        function submitMemory(e) {
            e.preventDefault();
            const user = getUser();
            if (!user) {
                showNotification('You must be logged in! Redirecting...', 'error');
                setTimeout(() => window.__go('login.html'), 1500);
                return;
            }
            const text = document.getElementById('memory-text').value.trim();
            const inspiration = document.getElementById('memory-inspiration').value.trim();
            if (!text || !inspiration) { showNotification('Please fill in all required fields!', 'error'); return; }
            if (!mediaFile) { showNotification('Please add a photo or video to share!', 'error'); return; }
            const btn = e.target.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
            waitB().then(function (B) {
                return fetch(mediaFile).then(function (r) { return r.blob(); }).then(function (blob) {
                    return B.memoryUpload(blob, mediaType);
                }).then(function (path) {
                    return B.memorySave({ title: text.slice(0, 80), body: text, inspiration: inspiration, image_path: path, media_type: mediaType });
                });
            }).then(function (r) {
                if (r && r.error) throw r.error;
                showNotification('❤️ Your memory is posted. Thank you for sharing!', 'success');
                closeMemoryModal();
                var newId = r && r.data && r.data.id;
                loadMemories();
                if (newId) setTimeout(function () { if (!document.querySelector('[data-mid="' + newId + '"]')) showNotification('⚠️ Saved, but it could not be read back. An administrator needs to run 010_memories_fix.sql.', 'error'); }, 2500);
            }).catch(function (err) {
                showNotification('Error: ' + ((err && err.message) || err), 'error');
            }).then(function () { if (btn) btn.disabled = false; });
        }
        
        function showNotification(message, type = 'info') {
            console.log('🔔 Notification:', type, '-', message);
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeMemoryModal();
            }
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Page loaded, initializing...');
            loadMemories();
        });
    <\/script>
</body>
</html>
</script>

        let currentCategory = 'all';
        let userCoins = 0;

        function SB() { try { return parent.DKBackend; } catch (e) { return null; } }
        function shopReady() {
            return new Promise(function (res, rej) {
                var B = SB(), n = 0;
                (function w() {
                    if (!B) return rej(new Error('Backend unavailable.'));
                    if (B.client) return res(B);
                    if (B.status === 'unconfigured' || B.status === 'offline' || n++ > 50) return rej(new Error('Cannot reach the server right now.'));
                    setTimeout(w, 200);
                })();
            });
        }
        // Balance comes from the server profile. Prices are enforced by the database, not by this page.
        function refreshCoins() {
            return shopReady().then(function (B) { return B.user ? B.myCoins() : null; }).then(function (r) {
                userCoins = (r && r.data && r.data.points) || 0;
                document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
                renderShop();
            }).catch(function () { renderShop(); });
        }
        function loadShop() { renderShop(); refreshCoins(); }
        
        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            
            const filteredItems = currentCategory === 'all' 
                ? shopItems 
                : shopItems.filter(item => item.category === currentCategory);
            
            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'shop-item';
                if (item.type === 'application') card.classList.add('special');
                if (item.category === 'bots') card.classList.add('premium');
                if (item.category === 'exclusive') card.classList.add('exclusive');
                
                const canAfford = typeof item.price === 'number' && userCoins >= item.price;
                const priceDisplay = typeof item.price === 'number' ? `${item.price.toLocaleString()} 🪙` : item.price;
                
                let buttonHTML = '';
                if (item.type === 'application') {
                    buttonHTML = `<button class="buy-btn apply-btn" onclick='openApplication(${JSON.stringify(item)})'>APPLY NOW</button>`;
                } else if (item.type === 'bot_subscription') {
                    buttonHTML = `<button class="buy-btn" onclick='openBotPurchase(${JSON.stringify(item)})' ${!canAfford ? 'disabled' : ''}>SUBSCRIBE</button>`;
                } else {
                    buttonHTML = `<button class="buy-btn" onclick="purchaseItem('${item.id}', ${item.price})" ${!canAfford ? 'disabled' : ''}>BUY NOW</button>`;
                }
                
                let requirementsHTML = '';
                if (item.requirements) {
                    requirementsHTML = `
                        <div class="requirements">
                            <h4>Requirements:</h4>
                            <ul>
                                ${item.requirements.map(req => `<li>${req}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }
                
                let warningHTML = '';
                if (item.warning) {
                    warningHTML = `
                        <div class="warning-box">
                            <h4>⚠️ IMPORTANT:</h4>
                            <p>${item.warning}</p>
                        </div>
                    `;
                }
                
                let badgeText = '';
                if (item.type === 'application') {
                    badgeText = '<div class="special-badge">APPLICATION</div>';
                } else if (item.category === 'bots') {
                    badgeText = '<div class="special-badge" style="background: var(--neon-purple);">BOT SUB</div>';
                } else if (item.category === 'exclusive') {
                    badgeText = '<div class="special-badge" style="background: var(--neon-red);">EXCLUSIVE</div>';
                }
                
                card.innerHTML = `
                    ${badgeText}
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-description">${item.description}</div>
                    ${warningHTML}
                    ${requirementsHTML}
                    <div class="item-price">${priceDisplay}</div>
                    ${buttonHTML}
                `;
                
                container.appendChild(card);
            });
        }
        
        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));

        function openApplication(item) {
            document.getElementById('modal-title').textContent = `Apply for ${item.name}`;
            document.getElementById('app-item-id').value = item.id;
            
            const extraFieldsContainer = document.getElementById('extra-fields');
            extraFieldsContainer.innerHTML = '';
            
            if (item.extraFields) {
                item.extraFields.forEach(field => {
                    const div = document.createElement('div');
                    div.className = 'form-group';
                    
                    if (field.type === 'textarea') {
                        div.innerHTML = `
                            <label>${field.label}:</label>
                            <textarea name="${field.name}" ${field.required ? 'required' : ''} placeholder="${field.placeholder || ''}"></textarea>
                        `;
                    } else {
                        div.innerHTML = `
                            <label>${field.label}:</label>
                            <input type="${field.type}" name="${field.name}" ${field.required ? 'required' : ''} placeholder="${field.placeholder || ''}">
                        `;
                    }
                    
                    extraFieldsContainer.appendChild(div);
                });
            }
            
            document.getElementById('application-modal').classList.add('active');
        }

        function submitApplication(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const application = {
                item_id: formData.get('item_id'),
                discord_invite: formData.get('discord_invite'),
                member_count: formData.get('member_count'),
                additional_info: formData.get('additional_info'),
                timestamp: new Date().toISOString(),
                status: 'pending'
            };
            
            const itemId = formData.get('item_id');
            const item = shopItems.find(i => i.id === itemId);
            if (item && item.extraFields) {
                item.extraFields.forEach(field => {
                    application[field.name] = formData.get(field.name);
                });
            }
            
            const answers = {};
            for (const [k, v] of formData.entries()) { if (k !== 'item_id') answers[k] = String(v).slice(0, 1000); }
            shopReady().then(function (B) {
                if (!B.user) throw new Error('Please log in first.');
                return B.applyBadge(itemId, answers);
            }).then(function () {
                showNotification('Application submitted! Staff will review it soon. 🎉', 'success');
                closeModal();
            }).catch(function (err) { showNotification('❌ ' + (err.message || err), 'error'); });

        function trackMovieWatched(movieTitle, platform) {
            try {
                const user = JSON.parse(localStorage.getItem('arcadeUser'));
                if (!user) return;
                
                if (!user.moviesWatched) user.moviesWatched = 0;
                if (!user.moviesHistory) user.moviesHistory = {};
                
                const movieKey = `${platform}_${movieTitle}`;
                if (user.moviesHistory[movieKey]) {
                    console.log('Movie already watched - no XP');
                    return;
                }
                
                // Add 25 XP
                user.xp = (user.xp || 0) + 25;
                user.moviesWatched++;
                user.level = Math.floor(Math.sqrt(user.xp / 100)) + 1;
                
                user.moviesHistory[movieKey] = {
                    title: movieTitle,
                    platform: platform,
                    watchedAt: new Date().toISOString()
                };
                
                localStorage.setItem('arcadeUser', JSON.stringify(user));
                localStorage.setItem('user_' + user.username, JSON.stringify(user));
                
                showXPNotification(movieTitle);
                console.log(`✅ +25 XP for watching ${movieTitle} on ${platform}`);
            } catch (error) {
                console.error('Failed to track movie:', error);
            }
        }

                setTimeout(() => notification.remove(), 500);
            }, 5000);

                    return '<button type="button" role="tab" class="dtv-tab" data-ch="' + esc(c.id) + '" aria-selected="' + (c.id === S.chId) + '">' + esc(c.number) + ' · ' + esc(c.name) + '</button>';
                }).join('');
            }
            function renderNow() {
                var id = S.chId, el = $('dtv-now'); if (!id) { el.innerHTML = ''; return; }
                var nn = nowNext(id, Date.now()), h = '';
                if (S.mode === 'live' && nn.cur) h = '<span><b>NOW:</b> ' + esc(nn.cur.title) + ' (' + fmtT(nn.cur.starts_at) + ' – ' + fmtT(nn.cur.ends_at) + ')</span>';
                else { var it = S.items.filter(function (i) { return i.id === S.itemId; })[0]; h = '<span><b>ON DEMAND:</b> ' + (it ? esc(it.title) + (it.year ? ' (' + esc(it.year) + ')' : '') : 'choose a video below') + '</span>'; }
                if (nn.next) h += '<span><b>NEXT:</b> ' + esc(nn.next.title) + ' at ' + fmt(nn.next.starts_at) + '</span>';
                if (S.userVod && nn.cur) h += '<button type="button" class="dtv-btn" id="dtv-golive">⟲ BACK TO LIVE</button>';
                el.innerHTML = h;
            }
            function renderGuide() {
                var id = S.chId, el = $('dtv-guide'); if (!id) { el.innerHTML = ''; return; }
                var t = Date.now(), nn = nowNext(id, t), h = '';
                var ps = chProgs(id).filter(function (p) { return new Date(p.ends_at) > t; }).slice(0, 12);
                if (ps.length) h += '<h3>SCHEDULE</h3><ul class="dtv-sched">' + ps.map(function (p) {
                    var cls = nn.cur && nn.cur.id === p.id ? 'now' : (nn.next && nn.next.id === p.id ? 'next' : '');
                    return '<li class="' + cls + '"><span class="t">' + fmt(p.starts_at) + ' – ' + fmtT(p.ends_at) + '</span><span>' + esc(p.title) + (p.description ? '<br><small>' + esc(p.description) + '</small>' : '') + '</span>' + (cls ? '<span class="dtv-tag">' + (cls === 'now' ? 'NOW' : 'NEXT') + '</span>' : '<span></span>') + '</li>';
                }).join('') + '</ul>';
                var its = chItems(id);
                h += '<h3>ON-DEMAND LIBRARY</h3>' + (its.length ? '<div class="dtv-lib">' + its.map(function (i) {
                    return '<button type="button" class="dtv-item' + (S.mode === 'vod' && i.id === S.itemId ? ' active' : '') + '" data-item="' + esc(i.id) + '"><strong>' + esc(i.title) + '</strong><small>' + esc(i.year || '') + (i.description ? ' · ' + esc(i.description) : '') + '</small></button>';
                }).join('') + '</div>' : '<p class="dtv-empty">No videos on this channel yet.</p>');
                el.innerHTML = h;
            }

            /* ---- data ---- */
            function load() {
                return Promise.all([B.tvChannels(), B.tvAllItems(), B.tvPrograms()]).then(function (r) {
                    for (var i = 0; i < r.length; i++) if (r[i].error) throw r[i].error;
                    S.channels = r[0].data || []; S.items = r[1].data || []; S.programs = r[2].data || [];
                });
            }
            function refresh() {
                load().then(function () {
                    if (!chById(S.chId)) { S.chId = null; if (S.channels.length) { S.chId = S.channels[0].id; S.vidMode = null; } }
                    renderTabs(); if (S.chId) evaluate(); else { renderNow(); renderGuide(); }
                }).catch(function () {});
            }
            function start() {
                load().then(function () {
                    if (!S.channels.length) { msg('No channels have been set up yet. An administrator can add them in the Admin Panel.'); return; }
                    S.chId = S.channels[0].id; renderTabs(); evaluate();
                    var t; try { B.tvSubscribe(function () { clearTimeout(t); t = setTimeout(refresh, 400); }); } catch (e) {}
                    setInterval(function () { if (!S.hold) { var nn = S.chId ? nowNext(S.chId, Date.now()) : {}; if (S.mode === 'live' && (!nn.cur || nn.cur.id !== S.progId)) evaluate(); else { renderNow(); renderGuide(); } } }, 15000);
                }).catch(function () { msg('Diane TV could not load the channel list from the server. Please try again later.', true); });
            }

            /* ---- wiring ---- */
            $('dtv-tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-ch]'); if (b) selectChannel(b.getAttribute('data-ch'), true); });
            $('dtv-guide').addEventListener('click', function (e) { var b = e.target.closest('[data-item]'); if (b) selectItem(b.getAttribute('data-item'), true, true); });
            $('dtv-now').addEventListener('click', function (e) { if (e.target.id === 'dtv-golive') { S.userVod = false; S.vidMode = null; evaluate(); } });
            $('dtv-tune').addEventListener('click', function () { try { player.unMute(); player.playVideo(); } catch (e) {} setTimeout(chrome, 500); });
            $('dtv-fs').addEventListener('click', function () { var s = $('dtv-stage'); (s.requestFullscreen || s.webkitRequestFullscreen || function () {}).call(s); });
            /* never let two videos play at once: pause Diane TV while the on-demand modal below is open */
            var _open = window.openMovie, _close = window.closeVideo;
            if (typeof _open === 'function') window.openMovie = function () { S.hold = true; try { if (player) player.pauseVideo(); } catch (e) {} return _open.apply(this, arguments); };
            if (typeof _close === 'function') window.closeVideo = function () { var r = _close.apply(this, arguments); if (S.hold) { S.hold = false; if (S.mode === 'live') { S.vidMode = null; evaluate(); } } return r; };

            var tries = 0;
            (function wait() {
                try { B = parent.DKBackend; } catch (e) { B = null; }
                if (B && B.status === 'unconfigured') { msg('Diane TV needs the site backend, which is not configured.', true); return; }
                if (B && B.client) return start();
                if (tries++ < 75) setTimeout(wait, 200); else msg('Diane TV could not reach the backend. Please refresh.', true);
            })();
        })();
    <\/script>
</body>
</html>
</script>
