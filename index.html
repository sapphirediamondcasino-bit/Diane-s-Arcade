<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050510'/%3E%3Crect x='3' y='3' width='58' height='58' rx='12' fill='none' stroke='%2300f3ff' stroke-width='3'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='900' font-size='38' text-anchor='middle' fill='%23ff00ff'%3ED%3C/text%3E%3C/svg%3E">
<style>
  :root { --dk-bar: 60px; --dk-blue:#00f3ff; --dk-purple:#bf00ff; --dk-pink:#ff00ff; }
  html, body { margin:0; height:100%; background:#050510; overflow:hidden; }
  #sitebar { position:fixed; top:0; left:0; right:0; height:var(--dk-bar); z-index:100; box-sizing:border-box; display:flex; align-items:center; gap:14px; padding:0 18px;
             background:rgba(5,5,16,.98); border-bottom:2px solid var(--dk-blue); box-shadow:0 4px 24px rgba(0,243,255,.25); font-family:Orbitron,'Segoe UI',Arial,sans-serif; color:#fff; }
  #sitebar a { color:inherit; text-decoration:none; }
  .dk-brand { display:flex; flex-direction:column; line-height:1.05; flex:none; }
  .dk-brand b { font-size:15px; letter-spacing:2px; color:var(--dk-blue); text-shadow:0 0 12px rgba(0,243,255,.6); }
  .dk-brand small { font-size:8.5px; letter-spacing:2.4px; color:#d9b3ff; margin-top:3px; }
  #dkNav { display:flex; align-items:center; gap:4px; margin:0 auto; }
  #dkNav a { padding:9px 12px; border-radius:20px; font-size:11.5px; font-weight:700; letter-spacing:1px; border:1.5px solid transparent; white-space:nowrap; transition:.2s; }
  #dkNav a:hover { border-color:var(--dk-blue); background:rgba(0,243,255,.1); }
  #dkNav a[aria-current="page"] { border-color:var(--dk-pink); background:rgba(255,0,255,.15); box-shadow:0 0 12px rgba(255,0,255,.35); }
  #dkNav a.dk-bot { color:#7dffb0; }
  #dkNav a.dk-ns { color:#8fd3ff; }
  #dkNav a.dk-chat { color:#ffc7f4; background:rgba(255,43,214,.12); border-color:rgba(255,43,214,.45); }
  .dk-more { position:relative; } .dk-more-btn { padding:9px 12px; border-radius:20px; border:1.5px solid transparent; background:none; color:#fff; cursor:pointer; font:700 11.5px Orbitron,'Segoe UI',Arial,sans-serif; letter-spacing:1px; white-space:nowrap; }
  .dk-more-btn:hover,.dk-more.open .dk-more-btn { border-color:var(--dk-blue); background:rgba(0,243,255,.1); } .dk-more-btn[aria-current="page"] { border-color:var(--dk-pink); background:rgba(255,43,214,.15); }
  .dk-more-panel { display:none; position:absolute; top:calc(100% + 8px); right:0; min-width:190px; flex-direction:column; gap:4px; padding:8px; border-radius:14px; background:rgba(5,5,16,.99); border:1.5px solid var(--dk-blue); box-shadow:0 10px 30px rgba(0,0,0,.6); }
  .dk-more.open .dk-more-panel { display:flex; } .dk-more-panel a { text-align:left; }
  #dkNav a.dk-admin { color:#ffd54a; }
  #dkAuth { display:flex; align-items:center; gap:10px; flex:none; }
  .dk-btn { display:inline-block; padding:9px 16px; border-radius:22px; font-size:11.5px; font-weight:800; letter-spacing:1px; background:linear-gradient(135deg,var(--dk-blue),var(--dk-purple)); color:#050510 !important; border:0; cursor:pointer; font-family:inherit; }
  .dk-user { display:flex; align-items:center; gap:9px; padding:4px 12px 4px 4px; border-radius:30px; border:1.5px solid var(--dk-purple); background:rgba(191,0,255,.12); }
  .dk-user img, .dk-user .dk-ini { width:32px; height:32px; border-radius:50%; object-fit:cover; background:#1a0a2e; display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--dk-pink); flex:none; }
  .dk-user span { display:flex; flex-direction:column; line-height:1.15; font-size:11px; font-weight:700; max-width:120px; }
  .dk-user span small { font-size:9.5px; font-weight:600; color:#9ef; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dk-out { background:none; border:1.5px solid rgba(255,255,255,.35); color:#fff; border-radius:18px; padding:7px 11px; font:700 10px Orbitron,Arial,sans-serif; letter-spacing:1px; cursor:pointer; }
  .dk-out:hover { border-color:var(--dk-pink); }
  #dkMenuBtn { display:none; margin-left:auto; width:42px; height:42px; border-radius:10px; border:2px solid var(--dk-blue); background:rgba(0,243,255,.08); cursor:pointer; padding:0; flex:none; }
  #dkMenuBtn span, #dkMenuBtn span::before, #dkMenuBtn span::after { display:block; width:20px; height:2.5px; background:var(--dk-blue); border-radius:2px; position:relative; margin:0 auto; content:''; transition:.2s; }
  #dkMenuBtn span::before { position:absolute; top:-7px; left:0; } #dkMenuBtn span::after { position:absolute; top:7px; left:0; }
  #sitebar.open #dkMenuBtn span { background:transparent; } #sitebar.open #dkMenuBtn span::before { top:0; transform:rotate(45deg); } #sitebar.open #dkMenuBtn span::after { top:0; transform:rotate(-45deg); }
  #stage { inset:var(--dk-bar) 0 0 0 !important; height:calc(100% - var(--dk-bar)) !important; }
  #boot { z-index:40; padding-top:var(--dk-bar); box-sizing:border-box; }
  @media (max-width: 1440px) { #dkNav a { padding:8px 7px; font-size:10.5px; letter-spacing:.4px; } .dk-brand small { display:none; } .dk-out { display:none; } #sitebar { gap:8px; padding:0 12px; } }
  @media (max-width: 1120px) {
    :root { --dk-bar: 56px; }
    #dkMenuBtn { display:block; }
    #dkAuth { margin-left:auto; } #dkMenuBtn { margin-left:0; }
    .dk-user span { display:none; } .dk-user { padding:3px; } .dk-out { display:none; }
    #dkNav { display:none; position:fixed; top:var(--dk-bar); left:0; right:0; bottom:0; grid-template-columns:1fr 1fr; align-content:start; gap:8px; padding:14px 14px 100px; margin:0; background:rgba(5,5,16,.985); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; z-index:99; }
    #sitebar.open #dkNav { display:grid; }
    #dkNav a { padding:14px 8px; font-size:12.5px; text-align:center; border-color:rgba(0,243,255,.35); border-radius:14px; touch-action:manipulation; }
    #dkNav .dk-m-out { grid-column:1 / -1; }
    #dkMenuBtn { touch-action:manipulation; }
    .dk-more-btn { display:none; } .dk-more { display:contents; } .dk-more-panel { display:contents; position:static; }
    #dkNav .dk-m-out { display:block; text-align:center; margin-top:8px; padding:14px; border:1.5px solid rgba(255,255,255,.35); border-radius:14px; background:none; color:#fff; font:700 13px Orbitron,Arial,sans-serif; letter-spacing:1px; cursor:pointer; }
  }
  @media (min-width: 1121px) { #dkNav .dk-m-out { display:none; } }
  @media (max-width: 380px) { .dk-brand b { font-size:12px; letter-spacing:1px; } }
  #stage { position:fixed; inset:0; width:100%; height:100%; border:0; background:#050510; display:block; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#00f3ff;
          font:700 1.4em Orbitron, 'Courier New', monospace; letter-spacing:4px; background:#050510; transition:opacity .3s; pointer-events:none; }
  #boot.hide { opacity:0; }
  /* gold refresh: header colors only, same links and layout */
  :root{--dk-blue:#D0AE67;--dk-purple:#30213F;--dk-pink:#D0AE67}
  #sitebar{background:rgba(17,17,17,.98);border-bottom:1px solid #D0AE67;box-shadow:0 4px 24px rgba(0,0,0,.5)}
  .dk-brand b{text-shadow:none}
  .dk-brand small{color:#F3EEE5}
  #dkNav a:hover,.dk-more-btn:hover,.dk-more.open .dk-more-btn{background:rgba(208,174,103,.12)}
  #dkNav a[aria-current="page"],.dk-more-btn[aria-current="page"]{background:rgba(208,174,103,.16);box-shadow:none}
  #dkNav a.dk-bot,#dkNav a.dk-ns{color:#F3EEE5}
  #dkNav a.dk-chat{color:#D0AE67;background:rgba(48,33,63,.7);border-color:rgba(208,174,103,.5)}
  .dk-btn{background:#D0AE67}
  .dk-user{border-color:#D0AE67;background:rgba(48,33,63,.6)}
  .dk-user img,.dk-user .dk-ini{color:#D0AE67}
  .dk-user span small{color:#F3EEE5}
  .dk-more-panel{background:#111}
  #boot{color:#D0AE67}
  #dkMenuBtn{background:rgba(208,174,103,.08)}
  @media (max-width: 1120px) { #dkNav{background:rgba(17,17,17,.99)} #dkNav a{border-color:rgba(208,174,103,.35)} }
</style>
</head>
<body>
<header id="sitebar" role="banner">
  <a class="dk-brand" href="#/home" aria-label="Diane Keaton Legacy Entertainment Center — home"><b>DIANE KEATON</b><small>LEGACY ENTERTAINMENT CENTER</small></a>
  <nav id="dkNav" aria-label="Main navigation"></nav>
  <div id="dkAuth"></div>
  <button id="dkMenuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="dkNav"><span></span></button>
</header>
<div id="boot">LOADING ARCADE…</div>
<iframe id="stage" title="Diane's Arcade" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>

<script>
/* backend.js — Supabase adapter for The Diane Keaton Legacy Entertainment Center.
   Loaded by index.html (parent shell). Pages inside the iframe call parent.DKBackend.
   Only PUBLIC values go here. Never put the service-role key or DB password in this file. */
(function () {
  'use strict';

  /* ===== STEP: PASTE YOUR TWO PUBLIC VALUES HERE ===== */
  var SUPABASE_URL = 'https://xkjkrxnmimwmxftrrkha.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_8rZwgg5Cz0DpNelyA45rFg_T6M6ZKi7'; // publishable key: safe in the browser; security comes from RLS
  /* =================================================== */

  var CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  var LS = window.localStorage;
  var B = window.DKBackend = {
    status: 'unconfigured', ready: false, user: null, client: null,
    online: null, listeners: [],
    integrations: { bot: null /* plug the replacement AI bot in here; nothing is connected yet */ }
  };

  /* ---------- status pill (truthful connection state) ---------- */
  var pill = document.createElement('div');
  pill.setAttribute('role', 'status');
  pill.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:99999;font:12px sans-serif;padding:4px 10px;border-radius:12px;background:#111c;color:#fff;pointer-events:none';
  document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(pill); paint(); });
  function paint() {
    var t = { unconfigured: 'Backend not configured (local mode)', connecting: 'Connecting…', online: 'Online', offline: 'Offline — retrying' }[B.status];
    if (B.status === 'online' && B.online != null) t += ' · ' + B.online + ' online';
    pill.textContent = t;
  }
  function setStatus(s) { B.status = s; B.ready = s === 'online'; paint(); B.listeners.forEach(function (f) { try { f(s); } catch (e) {} }); }
  B.onStatus = function (f) { B.listeners.push(f); };

  function friendly(e) {
    var m = (e && e.message) || String(e);
    if (/Failed to fetch|NetworkError/i.test(m)) return 'Cannot reach the server. Check your connection and try again.';
    if (/quota|rate limit|429|402|exceed/i.test(m)) return 'The service has hit a free-plan limit. Please try again later.';
    if (/Database error saving new user/i.test(m)) return 'That username is invalid (3–20 letters, numbers, _) or already taken.';
    if (/Invalid login/i.test(m)) return 'Wrong email or password.';
    return m;
  }
  function need() { if (!B.client) throw new Error('Backend is not connected.'); }

  /* ---------- init ---------- */
  B.init = function () {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return setStatus('unconfigured');
    setStatus('connecting');
    var s = document.createElement('script');
    s.src = CDN;
    s.onerror = function () { setStatus('offline'); };
    s.onload = function () {
      var cameBack = /[?&]code=/.test(location.search);
      B.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, flowType: 'pkce', detectSessionInUrl: true } });
      B.client.auth.getSession().then(function (r) {
        B.user = r.data.session ? r.data.session.user : null;
        setStatus('online');
        if (B.user) { B.syncCache(); startPresence(); flushPending(); }
      }).catch(function () { setStatus('offline'); });
      B.client.auth.onAuthStateChange(function (ev, sess) {
        B.user = sess ? sess.user : null;
        if (ev === 'PASSWORD_RECOVERY') { B.recovery = true; location.hash = '#/login'; }
        if (B.user) { startPresence(); try { B.syncCache(); } catch (e) {} } else { stopPresence(); }
        // returning from Google: drop ?code=…, go back to the page the person came from (no stray redirect to Home)
        if (ev === 'SIGNED_IN' && cameBack) {
          cameBack = false; var next = 'profile'; try { next = sessionStorage.getItem('dk_next') || 'profile'; sessionStorage.removeItem('dk_next'); } catch (e) {}
          history.replaceState(null, '', location.pathname); location.hash = '#/' + next;
        }
      });
    };
    document.head.appendChild(s);
    window.addEventListener('online', function () { if (B.client) { setStatus('online'); flushPending(); } });
    window.addEventListener('offline', function () { if (B.client) setStatus('offline'); });
  };

  /* ---------- auth (Supabase Auth owns passwords) ---------- */
  B.register = function (username, email, password) {
    need();
    return B.client.auth.signUp({ email: email, password: password, options: { data: { username: username } } })
      .then(function (r) {
        if (r.error) throw new Error(friendly(r.error));
        if (!r.data.session) return { needsConfirm: true };
        B.user = r.data.user; return B.syncCache().then(function () { return { needsConfirm: false }; });
      });
  };
  B.login = function (email, password) {
    need();
    if (email.indexOf('@') < 0) return Promise.reject(new Error('Sign in with your email address (usernames are for display).'));
    return B.client.auth.signInWithPassword({ email: email, password: password }).then(function (r) {
      if (r.error) throw new Error(friendly(r.error));
      B.user = r.data.user; return B.syncCache();
    });
  };
  B.logout = function () { if (!B.client) return Promise.resolve(); return B.client.auth.signOut().then(function () { B.user = null; }); };
  B.resetPassword = function (email) { need(); return B.client.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); };
  B.updatePassword = function (pw) { need(); return B.client.auth.updateUser({ password: pw }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  /* Social login: Google, Discord and X. Which ones are enabled is read from the Supabase project's own settings. */
  B.loginGoogle = function (next) {
    need(); try { sessionStorage.setItem('dk_next', String(next || 'profile')); } catch (e) {}
    return B.client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; });
  };

  B.providers = function () {
    return fetch(SUPABASE_URL + '/auth/v1/settings', { headers: { apikey: SUPABASE_ANON_KEY } })
      .then(function (r) { return r.json(); }).then(function (j) { return j.external || null; }).catch(function () { return null; });
  };
  B.loginOAuth = function (which, next) {
    need(); try { sessionStorage.setItem('dk_next', String(next || 'profile')); } catch (e) {}
    function go(p) { return B.client.auth.signInWithOAuth({ provider: p, options: { redirectTo: location.origin + location.pathname } }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); }
    if (which !== 'x') return go(which);
    return B.providers().then(function (ext) { return go(ext && !ext.x && ext.twitter ? 'twitter' : 'x'); });
  };

  /* ---------- compatibility cache: keeps legacy pages that read localStorage 'arcadeUser' working.
     The SERVER is authoritative; this cache is overwritten on every sync. ---------- */
  B.syncCache = function () {
    if (!B.client || !B.user) return Promise.resolve(null);
    return Promise.all([
      B.client.from('profiles').select('*').eq('id', B.user.id).single(),
      B.client.from('user_achievements').select('achievement_id').eq('user_id', B.user.id),
      B.client.from('inventory').select('item_id').eq('user_id', B.user.id).then(function (x) { return x.data || []; }, function () { return []; }),
      B.client.from('badge_applications').select('item_id').eq('user_id', B.user.id).eq('status', 'approved').then(function (x) { return x.data || []; }, function () { return []; })
    ]).then(function (r) {
      var p = r[0].data; if (!p) return null;
      var u = { username: p.username, email: B.user.email, xp: p.xp, coins: p.points, level: p.level,
        gamesPlayed: p.games_played, moviesWatched: p.movies_watched,
        unlockedAchievements: (r[1].data || []).map(function (a) { return a.achievement_id; }),
        badges: r[2].filter(function (i) { return /_badge$/.test(i.item_id) || i.item_id === 'verified_discord' || i.item_id === 'diane_bot_developer'; }).map(function (i) { return i.item_id; }).concat(r[3].map(function (i) { return i.item_id; })),
        inventory: r[2].map(function (i) { return { item_id: i.item_id }; }), joinDate: p.created_at, avatar: p.avatar_url, banner: p.banner_url,
        gamesHistory: {}, moviesHistory: {}, _fromBackend: true };
      LS.setItem('arcadeUser', JSON.stringify(u)); LS.setItem('isLoggedIn', 'true');
      return u;
    }).catch(function () { return null; });
  };
  B.evaluateAchievements = function () { need(); return B.client.rpc('evaluate_achievements').then(function (r) { if (r.error) throw r.error; return r.data; }); };
  B.myBoosts = function () { need(); return B.client.from('user_boosts').select('item_id,expires_at').eq('user_id', B.user.id).gt('expires_at', new Date().toISOString()).order('expires_at'); };
  B.uploadProfileImage = function (blob, kind) {
    need(); if (!B.user) return Promise.reject(new Error('Sign in first.'));
    var ext = /png/.test(blob.type) ? 'png' : /webp/.test(blob.type) ? 'webp' : /gif/.test(blob.type) ? 'gif' : 'jpg';
    var path = B.user.id + '/' + kind + '-' + Date.now() + '.' + ext;
    return B.client.storage.from('avatars').upload(path, blob, { contentType: blob.type || undefined, upsert: false }).then(function (r) {
      if (r.error) throw new Error(friendly(r.error));
      return B.client.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    });
  };
  B.updateProfile = function (fields) { // only bio/avatar_url/banner_url are permitted by the database
    need(); return B.client.from('profiles').update(fields).eq('id', B.user.id);
  };

  /* ---------- scores (server validates; duplicates blocked by event id) ---------- */
  function pending() { try { return JSON.parse(LS.getItem('dk_pending_scores') || '[]'); } catch (e) { return []; } }
  function savePending(a) { LS.setItem('dk_pending_scores', JSON.stringify(a)); }
  function send(item) {
    return B.client.rpc('submit_score', { p_game: item.g, p_score: item.s, p_event_id: item.e }).then(function (r) {
      if (r.error) throw r.error; return r.data;
    });
  }
  function flushPending() {
    try { LS.removeItem('dk_pending_scores'); } catch (e) {}   /* old self-reported queue is discarded */
    return;
    if (!B.ready || !B.user) return;
    pending().forEach(function (it) {
      send(it).then(function () { savePending(pending().filter(function (x) { return x.e !== it.e; })); })
        .catch(function (e) { if (!/network|fetch/i.test(String(e.message))) savePending(pending().filter(function (x) { return x.e !== it.e; })); });
    });
  }
  B.submitScore = function () { return Promise.reject(new Error('Scores are recorded automatically by the site. They cannot be entered by hand.')); };
  B.recordPlay = function (gameId) { need(); return B.client.rpc('record_game_play', { p_game: String(gameId) }).then(function (r) { if (r.error) throw r.error; return r.data; }); };
  /* ---------- automatic scores (see 011_auto_scores.sql) ---------- */
  B.leaderboard = function (gameId, limit) {
    need(); return B.client.from('game_best').select('user_id,game_id,best_score,achieved_at,username,avatar_url').eq('game_id', gameId).order('best_score', { ascending: false }).limit(limit || 50);
  };
  B.userBestScores = function (uid) { need(); return B.client.from('game_best').select('game_id,best_score,achieved_at').eq('user_id', uid).order('best_score', { ascending: false }); };
  B.scoreBegin = function (gameId) { need(); return B.client.rpc('start_game_session', { p_game: String(gameId) }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  B.scoreFinish = function (sessionId, score) { need(); return B.client.rpc('finish_game_session', { p_session: sessionId, p_score: Math.floor(score) }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  B.adminFlags = function () { need(); return B.client.from('score_flags').select('*').eq('status', 'pending').order('created_at'); };
  B.adminReviewScore = function (id, approve) { need(); return B.client.rpc('admin_review_score', { p_flag: id, p_approve: approve }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  B.adminLimits = function () { need(); return B.client.from('game_limits').select('*').order('game_id'); };
  B.adminSetLimit = function (game, max, pps, min) { need(); return B.client.rpc('admin_set_game_limit', { p_game: game, p_max: max, p_pps: pps, p_min: min }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  B.xpLeaderboard = function (limit) { need(); return B.client.from('profiles').select('username,xp,level,avatar_url').order('xp', { ascending: false }).limit(limit || 50); };
  B.globalLeaderboard = function (limit) {
    need(); return B.client.from('profiles').select('username,points,level').order('points', { ascending: false }).limit(limit || 25);
  };

  /* ---------- realtime ---------- */
  B.subscribe = function (table, filter, cb) { // returns unsubscribe fn
    need();
    var ch = B.client.channel('rt-' + table + '-' + Math.random().toString(36).slice(2))
      .on('postgres_changes', Object.assign({ event: '*', schema: 'public', table: table }, filter ? { filter: filter } : {}), cb)
      .subscribe(function (st) { if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setStatus('offline'); else if (st === 'SUBSCRIBED') setStatus('online'); });
    return function () { B.client.removeChannel(ch); };

  /* ---------- memories (RLS: approved are public; owners see their own; admins see all) ---------- */

  B.memoryUpload = function (blob, kind) {

    return B.client.storage.from('memories').upload(path, blob, { contentType: blob.type || undefined, upsert: false }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return path; });

  B.memoryUrl = function (path) { need(); return B.client.storage.from('memories').getPublicUrl(path).data.publicUrl; };
  B.memoryModerate = function (id, status) { need(); return B.client.rpc('moderate_memory', { p_id: id, p_status: status }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); }); };
  B.memoryDelete = function (id) { need(); return B.client.from('memories').delete().eq('id', id).then(function (r) { if (r.error) throw new Error(friendly(r.error)); }); };

  /* ---------- shop (all balance changes happen in database functions) ---------- */
  function rpcErr(r) { if (r.error) { var m = r.error.message || ''; if (/not enough coins/i.test(m)) m = 'Not enough coins!'; else if (/sign in/i.test(m)) m = 'Please log in first.'; else if (/unavailable/i.test(m)) m = 'That item is not available.'; throw new Error(m || friendly(r.error)); } return r.data; }
  B.myCoins = function () { need(); return B.client.from('profiles').select('points').eq('id', B.user.id).single(); };

  /* ---------- private chats with Diane (see 013_chat.sql and the diane-chat server function) ---------- */

    return B.client.functions.invoke('diane-chat', { body: Object.assign({ conversation_id: id, message: message, username: uname }, extra || {}) }).then(function (r) {
      if (!r.error && r.data && r.data.reply) return r.data;
      var err = r.error, ctx = err && err.context;
      if (ctx && typeof ctx.json === 'function') return ctx.json().then(function (j) { throw new Error((j && j.error) || 'Diane could not answer.'); }, function () { throw new Error('Diane could not answer right now.'); });
      if (err && /404|not found|Failed to send|Failed to fetch/i.test(err.message || '')) throw new Error('Diane\'s server function is not deployed yet. An administrator needs to deploy diane-chat.');
      throw new Error((err && err.message) || (r.data && r.data.error) || 'Diane could not answer.');

  B.adminMemories = function (status) { need(); var q = B.client.from('memories').select('*').order('created_at', { ascending: false }).limit(200); return status && status !== 'all' ? q.eq('status', status) : q; };

  /* ---------- TV channels (public read; writes are enforced by the database: admins only) ---------- */
  B.isAdmin = function () {

  B.adminRemoveAdmin = function (uid) { need(); return B.client.rpc('admin_remove_admin', { p_user: uid }).then(function (r) { if (r.error) throw new Error(friendly(r.error)); return r.data; }); };
  B.adminLedger = function (uid, limit) { need(); var q = B.client.from('coin_transactions').select('*').order('created_at', { ascending: false }).limit(limit || 100); return uid ? q.eq('user_id', uid) : q; };
  B.adminNotifications = function () { need(); return B.client.from('admin_notifications').select('*').order('created_at', { ascending: false }).limit(30); };

  B.myLedger = function (limit) { need(); return B.client.from('coin_transactions').select('*').eq('user_id', B.user.id).order('created_at', { ascending: false }).limit(limit || 50); };

  /* ---------- local data: backup + migration (never deletes local data) ---------- */
  B.backupLocal = function () {
    var dump = {}; for (var i = 0; i < LS.length; i++) { var k = LS.key(i); dump[k] = LS.getItem(k); }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' }));
    a.download = 'arcade-local-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  };
  /* Uploads the old local record for the signed-in email as a PENDING import. Old passwords are stripped.
     Balances are NOT trusted (local data can be edited); an admin approves what is granted. One import per user. */
  B.migrateLocal = function () {
    need(); if (!B.user) return Promise.reject(new Error('Sign in first.'));
    var found = null;
    for (var i = 0; i < LS.length; i++) {
      var k = LS.key(i); if (k.indexOf('user_') !== 0) continue;
      try { var u = JSON.parse(LS.getItem(k)); if (u.email && u.email.toLowerCase() === B.user.email.toLowerCase()) { found = u; break; } } catch (e) {}
    }
    if (!found) return Promise.resolve({ found: false });
    delete found.password;
    var body = JSON.stringify(found);
    return B.client.from('legacy_imports').upsert({ user_id: B.user.id, payload: found }, { onConflict: 'user_id', ignoreDuplicates: true })

            left: -3px;

            z-index: -1;
            opacity: 0;

            animation: borderRotate 3s linear infinite;

            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .game-card:hover::before {

            backdrop-filter: blur(15px);

            margin-top: 50px;

            background: rgba(191, 0, 255, 0.15);

            font-size: 0.95em;
            opacity: 0.85;
            line-height: 1.6;
        }
        
        /* Footer */

            margin-top: 120px;

            backdrop-filter: blur(20px);
            position: relative;
            z-index: 100;

            color: var(--neon-blue);
            margin-bottom: 25px;
            text-shadow: 0 0 30px var(--neon-blue);

            font-size: 1.1em;
            margin: 15px 0;

        }
        
        .footer-links {

            justify-content: center;
            gap: 30px;
            margin: 30px 0;

.lx-btn:hover{background:var(--ivory);transform:translateY(-2px)}
.lx-btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.lx-btn.ghost:hover{background:var(--gold);color:#111}
.lx-hero{min-height:88vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:90px 24px;border-bottom:1px solid var(--gold);background:radial-gradient(ellipse at 50% 0%,rgba(48,33,63,.95),rgba(36,54,70,.55) 55%,#111 100%)}
.lx-hero h1{font-size:clamp(2.2rem,6vw,4.4rem);letter-spacing:.06em;line-height:1.1;margin:18px 0}
.lx-hero h1 span{display:block;font-size:.42em;letter-spacing:.3em;color:var(--gold);margin-top:12px}
.lx-sub{letter-spacing:.25em;opacity:.85;margin-bottom:36px}
.lx-sec{max-width:1200px;margin:0 auto;padding:90px 24px;text-align:center;position:relative;z-index:10}
.lx-sec h2,.section-title{font:700 clamp(1.6rem,3.2vw,2.4rem) Orbitron,sans-serif;letter-spacing:.12em;color:var(--ivory);background:none;-webkit-text-fill-color:currentColor;margin:14px 0 24px}
.section-title::after{width:90px;height:2px;background:var(--gold);box-shadow:none}
.lx-sec p{max-width:640px;margin:0 auto 20px;line-height:1.8;opacity:.88}
.lx-sec .hero-stats{display:flex;justify-content:center;flex-wrap:wrap;margin-top:40px;gap:24px}
.stat-box{background:none;border:1px solid rgba(208,174,103,.4);border-radius:4px}
.stat-number{color:var(--gold);text-shadow:none}
.lx-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.lx-card{display:block;text-align:left;padding:32px;background:var(--plum);border:1px solid rgba(208,174,103,.35);border-radius:6px;color:var(--ivory);text-decoration:none;transition:.25s}
.lx-card:hover{border-color:var(--gold);transform:translateY(-4px)}
.lx-card.lead{grid-column:span 2;background:var(--navy)}
.lx-card b{display:block;font:700 1.1rem Orbitron,sans-serif;letter-spacing:.1em;color:var(--gold);margin-bottom:10px}
.lx-card span{opacity:.85;line-height:1.6}
.lx-arc{display:flex;gap:40px;align-items:center;max-width:1100px;margin:0 auto 20px;padding:40px;text-align:left;border:1px solid rgba(208,174,103,.35);border-radius:8px;background:linear-gradient(135deg,var(--plum),var(--navy))}
.lx-arc img{width:46%;border-radius:6px;border:1px solid var(--gold)}
.lx-arc h2{margin-top:0}
.lx-banner{text-align:center;padding:70px 20px;margin-bottom:50px;border-radius:12px;border:1px solid rgba(208,174,103,.35);background:radial-gradient(ellipse at top,rgba(48,33,63,.95),rgba(36,54,70,.6) 70%,#111)}
.lx-banner p{max-width:560px;margin:0 auto 22px;opacity:.88}
.lx-quote{font-style:italic;font-size:1.3rem;color:var(--gold)}
.games-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.game-card{display:flex;flex-direction:column;background:var(--navy);border:1px solid rgba(208,174,103,.3);border-radius:8px}
.game-card::before{display:none}
.game-card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 14px 40px rgba(208,174,103,.18)}
.game-image{height:220px;border-bottom:1px solid var(--gold)}
.game-content{flex:1;display:flex;flex-direction:column;padding:24px;background:none}
.game-card h3{color:var(--ivory);font-size:1.25em;letter-spacing:.05em}
.game-creator{color:var(--gold)}
.achievement-mini{background:var(--plum);border:1px solid var(--gold);box-shadow:none}
.play-btn{margin-top:auto;align-self:center;background:var(--gold);color:#111;padding:14px 40px;font-size:1rem;letter-spacing:.2em;box-shadow:none}
.play-btn::before{display:none}
.play-btn:hover{padding-left:40px;background:var(--ivory);box-shadow:none}
.container a[href="achievements.html"]{background:none!important;color:var(--gold)!important;border:1px solid var(--gold)!important;box-shadow:none!important}
.lx-type{position:absolute;top:12px;left:12px;z-index:5;padding:5px 12px;border-radius:3px;font:700 .7rem Orbitron,sans-serif;letter-spacing:.15em;background:#111;color:var(--gold);border:1px solid var(--gold)}
.lx-type.html5{color:#8fd3ff;border-color:#8fd3ff}
.lx-type.torrent{color:#7dffb0;border-color:#7dffb0}
@media(max-width:900px){.lx-cards{grid-template-columns:1fr 1fr}.lx-arc{flex-direction:column}.lx-arc img{width:100%}}
@media(max-width:700px){.lx-cards{grid-template-columns:1fr}.lx-card.lead{grid-column:auto}.games-grid{grid-template-columns:1fr}}

    </style>
</head>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--gold:#D0AE67;--ivory:#F3EEE5;--plum:#30213F;--navy:#243646}
body{margin:0;background:#111;color:var(--ivory);font-family:Roboto,sans-serif;line-height:1.6}
.wrap{max-width:1250px;margin:0 auto;padding:50px 20px 40px}
.eyebrow{display:block;text-align:center;font:700 .8rem Orbitron,sans-serif;letter-spacing:.4em;color:var(--gold)}
h1{font:700 clamp(1.8rem,4vw,2.8rem) Orbitron,sans-serif;letter-spacing:.1em;text-align:center;margin:12px 0 26px}
h2{font:700 1rem Orbitron,sans-serif;letter-spacing:.1em;color:var(--gold);margin:0 0 12px}
.panel{background:var(--plum);border:1px solid rgba(208,174,103,.35);border-radius:8px;padding:22px;margin-bottom:20px}
button{padding:12px 22px;border:0;border-radius:3px;background:var(--gold);color:#111;font:700 .8rem Orbitron,sans-serif;letter-spacing:.12em;cursor:pointer}
button:hover{background:var(--ivory)}
button.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
button.ghost:hover{background:var(--gold);color:#111}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=datetime-local]{padding:11px 12px;border-radius:4px;border:1px solid rgba(208,174,103,.5);background:#111;color:var(--ivory);font:inherit;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.row>input{flex:1 1 180px}
.grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.stagewrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--gold);border-radius:8px;overflow:hidden}
.stagewrap iframe,.stagewrap #mnp{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;inset:0;z-index:3}
.enter{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 30px;font-size:1rem}
.ended{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font:700 1.1rem Orbitron,sans-serif}
.fs{position:absolute;right:10px;bottom:10px;z-index:7;padding:7px 12px;font-size:.7rem}
.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 4px;font:700 1.05rem Orbitron,sans-serif}
.bar #count{color:var(--gold)}
.small{font-size:.85rem;opacity:.75;margin:6px 0 14px}
.chat{background:var(--navy);border:1px solid rgba(208,174,103,.35);border-radius:8px;padding:16px;display:flex;flex-direction:column;height:520px}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.msg{background:rgba(17,17,17,.55);border-radius:6px;padding:9px 11px;font-size:.95rem;word-wrap:break-word;overflow-wrap:anywhere}
.msg small{opacity:.55;font-size:.72rem}
.role{display:inline-block;padding:1px 8px;border-radius:3px;font:700 .62rem Orbitron,sans-serif;letter-spacing:.1em;border:1px solid var(--gold);color:var(--gold);background:#111}
.r-founder{background:var(--gold);color:#111}
.r-ceo{color:#111;background:#E8D3A0;border-color:#E8D3A0}
.msg.bot{border-left:3px solid var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{padding:8px 12px;font-size:.68rem}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.92rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;border:1px solid var(--gold);padding:11px 20px;border-radius:8px;font-weight:700;z-index:50;max-width:90vw;display:none}
@media(max-width:900px){.grid{grid-template-columns:1fr}.chat{height:380px}}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">LIVE SCREENING</span>
  <h1>MOVIE NIGHT</h1>

  <div class="panel" id="gate"><p>Loading...</p></div>

  <div id="host" hidden class="panel">
    <h2>HOST CONSOLE <span id="whoami" style="opacity:.8;font-size:.75rem"></span></h2>
    <div id="hCreateBox">
      <div class="row"><input type="text" id="hTitle" maxlength="120" placeholder="Movie night title"><input type="text" id="hLink" placeholder="YouTube link or video ID"></div>
      <div class="row"><input type="datetime-local" id="hStart" aria-label="Start time (optional)"><button id="hCreate" type="button">CREATE MOVIE NIGHT</button></div>
      <p class="small">Starting a new movie night ends any one that is still open.</p>
    </div>
    <div id="hControls" hidden>
      <div class="row">
        <button id="hPlay" type="button">PLAY FOR EVERYONE</button>
        <button id="hPause" type="button" class="ghost">PAUSE FOR EVERYONE</button>
        <button type="button" class="ghost" data-seek="-60">-60s</button>
        <button type="button" class="ghost" data-seek="-10">-10s</button>
        <button type="button" class="ghost" data-seek="10">+10s</button>
        <button type="button" class="ghost" data-seek="60">+60s</button>
        <button id="hRestart" type="button" class="ghost">RESTART</button>
      </div>
      <div class="row"><input type="text" id="hTime" placeholder="Jump to time (1:23:45 or 12:30)"><button id="hGo" type="button" class="ghost">GO</button></div>
      <div class="row"><input type="text" id="hLoadLink" placeholder="Switch to another YouTube link"><button id="hLoad" type="button" class="ghost">SWITCH VIDEO</button></div>
      <div class="row"><input type="text" id="hSay" maxlength="400" placeholder="Announcement for the chat (interruptions, intermission...)"><button id="hSend" type="button">SEND</button></div>
      <div class="chips">
        <button type="button" class="ghost" data-quick="Welcome to Movie Night! The movie starts shortly.">WELCOME</button>
        <button type="button" class="ghost" data-quick="We are having a technical problem. Please stay in your seat, we will be right back.">TECH PROBLEM</button>
        <button type="button" class="ghost" data-quick="Short intermission. The movie will resume in a few minutes.">INTERMISSION</button>
        <button type="button" class="ghost" data-quick="We are back! Enjoy the rest of the movie.">BACK</button>
      </div>
      <div class="row"><button id="hEnd" type="button" class="ghost">END MOVIE NIGHT</button></div>
    </div>
    <h2 style="margin-top:20px">PAST MOVIE NIGHTS</h2>
    <div class="hist" id="hist"><p class="small">Nothing yet.</p></div>
  </div>

  <div id="room" hidden>
    <div class="grid">
      <div>
        <div class="stagewrap" id="stageWrap">
          <div id="mnp"></div>
          <div class="shield" id="shield"></div>
          <button class="enter" id="enter" type="button">TAP TO ENTER THE SCREENING</button>
          <div class="ended" id="ended" hidden>This movie night has ended. Thank you for coming!</div>
          <button class="fs ghost" id="fs" type="button">FULLSCREEN</button>
        </div>
        <div class="bar"><span id="title"></span><span id="count"></span></div>
        <p class="small">The host controls playback for everyone, so the video can't be paused or skipped from your side. YouTube may show ads before or during the movie, which is controlled by YouTube.</p>
      </div>
      <aside class="chat" aria-label="Movie Night chat">
        <h2>MOVIE NIGHT BOT</h2>
        <div id="msgs"><div class="msg bot"><b>Movie Night Bot</b><div>Announcements from the staff appear here.</div></div></div>
      </aside>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  var ROLE = { founder: 'FOUNDER', ceo: 'HEAD ADMIN', admin: 'ADMIN' };
  var S = { B: null, staff: false, role: 'admin', night: null, offset: 0, player: null, vid: null, entered: false, ytReady: false, apply: 0, unsub: [], poll: null, seen: {}, apiState: 'idle', waiters: [] };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function BK() { try { return parent.DKBackend; } catch (e) { return null; } }
  function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { e.style.display = 'none'; }, 4500); }
  function fail(e) { toast((e && e.message) || String(e)); }
  function gate(html) { $('gate').hidden = false; $('gate').innerHTML = html; }
  function ready() {
    return new Promise(function (res, rej) {
      var B = BK(), n = 0;
      (function w() {
        if (!B) return rej(new Error('The site could not start. Please reload.'));
        if (B.client) return res(B);
        if (B.status === 'unconfigured' || B.status === 'offline' || n++ > 60) return rej(new Error('Cannot reach the server right now. Please try again in a moment.'));
        setTimeout(w, 200);
      })();
    });
  }
  function ytId(x) { var s = String(x || '').trim(); if (/^[\w-]{11}$/.test(s)) return s; var m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }
  function expected() {
    var n = S.night; if (!n) return 0;
    var p = Number(n.pos_seconds) || 0;
    return n.playing ? p + Math.max(0, (Date.now() + S.offset - Date.parse(n.state_at)) / 1000) : p;
  }
  function parseTime(t) {
    var parts = String(t || '').trim().split(':').map(Number); if (!parts.length || parts.some(isNaN)) return null;
    return parts.reduce(function (a, x) { return a * 60 + x; }, 0);
  }

  /* ---- YouTube player: no controls, clicks blocked, always follows the host ---- */
  function loadApi(cb) {
    if (window.YT && window.YT.Player) return cb(true);
    if (S.apiState === 'failed') return cb(false);
    S.waiters.push(cb); if (S.apiState === 'loading') return; S.apiState = 'loading';
    var flush = function (ok) { S.apiState = ok ? 'ready' : 'failed'; var w = S.waiters; S.waiters = []; w.forEach(function (f) { f(ok); }); };
    window.onYouTubeIframeAPIReady = function () { flush(true); };
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = function () { flush(false); };
    document.head.appendChild(s); setTimeout(function () { if (S.apiState === 'loading') flush(false); }, 10000);
  }
  function startPlayer() {
    if (S.entered || !S.night) return; S.entered = true; $('enter').hidden = true;
    loadApi(function (ok) {
      if (!ok) { toast('The YouTube player could not load. Check your connection or any content blocker.'); S.entered = false; $('enter').hidden = false; return; }
      var vars = { controls: 0, disablekb: 1, rel: 0, modestbranding: 1, playsinline: 1, fs: 0, iv_load_policy: 3 };
      S.player = new YT.Player('mnp', { width: '100%', height: '100%', videoId: S.night.youtube_id, playerVars: vars,
        events: { onReady: function () { S.ytReady = true; S.vid = S.night.youtube_id; applyState(); }, onStateChange: onState,
                  onError: function () { toast('This video cannot be played here (it may be private, removed, or have embedding turned off).'); } } });
    });
  }
  function onState(e) {
    var n = S.night, p = S.player; if (!n || !p || Date.now() - S.apply < 900) return;
    if (n.status === 'ended') return;
    if (n.playing && e.data === 2) { S.apply = Date.now(); try { p.playVideo(); } catch (x) {} }
    else if (!n.playing && e.data === 1) { S.apply = Date.now(); try { p.pauseVideo(); } catch (x) {} }
  }
  function applyState() {
    var n = S.night, p = S.player; if (!n || !p || !S.ytReady || !S.entered) return;
    S.apply = Date.now();
    if (n.status === 'ended') { try { p.pauseVideo(); } catch (e) {} $('ended').hidden = false; return; }
    $('ended').hidden = true;
    var exp = expected(), pos = Number(n.pos_seconds) || 0;
    if (S.vid !== n.youtube_id) {
      S.vid = n.youtube_id;
      if (n.playing) p.loadVideoById({ videoId: n.youtube_id, startSeconds: exp }); else p.cueVideoById({ videoId: n.youtube_id, startSeconds: pos });
      return;
    }
    var cur = 0, st = -1; try { cur = p.getCurrentTime() || 0; st = p.getPlayerState(); } catch (e) {}
    if (n.playing) { if (Math.abs(cur - exp) > 3) p.seekTo(exp, true); if (st !== 1 && st !== 3) p.playVideo(); }
    else { if (st === 1 || st === 3) p.pauseVideo(); if (Math.abs(cur - pos) > 1.5) p.seekTo(pos, true); }
  }

  /* ---- state ---- */
  function setNight(n, serverNow) {
    if (!n) return;
    if (serverNow) S.offset = Date.parse(serverNow) - Date.now();
    S.night = n; $('title').textContent = n.title || '';
    $('count').textContent = (n.attendees || 0) + ' ticket' + (n.attendees === 1 ? '' : 's') + ' used';
    if (n.status === 'ended') $('ended').hidden = false;
    applyState();
  }
  function addMsg(m) {
    if (!m || S.seen[m.id]) return; S.seen[m.id] = 1;
    var d = document.createElement('div'); d.className = 'msg';
    var t = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
    d.innerHTML = '<span class="role r-' + esc(m.role) + '">' + esc(ROLE[m.role] || 'STAFF') + '</span> <b>' + esc(m.username || 'Staff') + '</b><div>' + esc(m.body) + '</div><small>' + esc(t) + '</small>';
    var box = $('msgs'); box.appendChild(d); box.scrollTop = box.scrollHeight;
  }
  function showRoom() {
    $('gate').hidden = true; $('room').hidden = false;
    var id = S.night.id;
    S.B.mnState(id).then(function (r) { setNight(r, r && r.server_now); }).catch(fail);
    S.B.mnChat(id).then(function (r) { (r.data || []).forEach(addMsg); }).catch(function () {});
    S.unsub.push(S.B.subscribe('movie_nights', 'id=eq.' + id, function (p) { if (p && p.new && p.new.id === id) setNight(p.new); }));
    S.unsub.push(S.B.subscribe('movie_night_chat', 'night_id=eq.' + id, function (p) { if (p && p.new) addMsg(p.new); }));
    clearInterval(S.poll);
    S.poll = setInterval(function () { S.B.mnState(id).then(function (r) { if (r) setNight(r, r.server_now); }).catch(function () {}); }, 8000);
  }
  function teardown() {
    S.unsub.forEach(function (u) { try { u(); } catch (e) {} }); S.unsub = []; clearInterval(S.poll);
    if (S.player) { try { S.player.destroy(); } catch (e) {} S.player = null; }
    S.entered = false; S.ytReady = false; S.vid = null; S.seen = {};
    var box = $('msgs'); box.innerHTML = '<div class="msg bot"><b>Movie Night Bot</b><div>Announcements from the staff appear here.</div></div>';
    var holder = $('stageWrap'); if (!$('mnp')) { var d = document.createElement('div'); d.id = 'mnp'; holder.insertBefore(d, holder.firstChild); }
    $('enter').hidden = false; $('ended').hidden = true; $('room').hidden = true;
  }

  /* ---- start ---- */
  function init() {
    teardown(); gate('<p>Loading...</p>');
    ready().then(function (B) {
      S.B = B;
      if (!B.user) { gate('<h2>LOG IN TO JOIN</h2><p>Movie Night is for signed-in members.</p><p><a href="login.html?next=movienight"><button type="button">LOG IN OR SIGN UP</button></a></p>'); return; }
      return Promise.all([B.isAdmin().catch(function () { return false; }), B.myAdminInfo().catch(function () { return null; })]).then(function (r) {
        S.staff = !!r[0]; S.role = (r[1] && r[1].role) || 'admin';
        $('host').hidden = !S.staff; $('whoami').textContent = S.staff ? '- signed in as ' + (ROLE[S.role] || 'STAFF') : '';
        if (S.staff) loadHistory();
        return B.mnCurrent();
      }).then(function (res) {
        var n = res && res.data;
        $('hCreateBox').hidden = false; $('hControls').hidden = true;
        if (!n) { gate('<h2>NO MOVIE NIGHT RIGHT NOW</h2><p>' + (S.staff ? 'Create one with the host console above.' : 'Staff will announce the next one. You can pick up a Movie Night Pass in the Coin Shop so you are ready.') + '</p>'); return; }
        S.night = n; $('title').textContent = n.title;
        if (S.staff) { $('hControls').hidden = false; $('hCreateBox').hidden = false; return showRoom(); }
        return B.mnTicket(n.id).then(function (t) {
          if (t && t.data) return showRoom();
          return B.myPasses().then(function (c) {
            gate('<h2>' + esc(n.title) + '</h2><p>A live Movie Night is on. You need a Movie Night Pass to get in. The movie itself is free.</p><p>You have <b>' + c + '</b> pass' + (c === 1 ? '' : 'es') + '.</p><p>' +
              (c > 0 ? '<button type="button" id="useTicket">USE A PASS AND JOIN</button> ' : '') + '<a href="shop.html"><button type="button" class="ghost">GET A PASS IN THE COIN SHOP</button></a></p>');
            var b = $('useTicket'); if (b) b.addEventListener('click', function () { b.disabled = true; B.mnJoin(n.id).then(showRoom).catch(function (e) { b.disabled = false; fail(e); }); });
          });
        });
      });
    }).catch(function (e) { gate('<h2>COULD NOT LOAD</h2><p>' + esc((e && e.message) || e) + '</p>'); });
  }
  function loadHistory() {
    S.B.mnHistory().then(function (r) {
      var rows = r.data || [];
      $('hist').innerHTML = rows.length ? rows.map(function (n) { return '<div><span>' + esc(n.title) + ' <small>' + new Date(n.created_at).toLocaleDateString() + '</small></span><b>' + (n.attendees || 0) + ' attended</b></div>'; }).join('') : '<p class="small">Nothing yet.</p>';
    }).catch(function () {});
  }

  /* ---- host actions (the database re-checks that you are staff) ---- */
  function ctl(action, pos, video) {
    if (!S.night) return;
    S.B.mnControl(S.night.id, action, pos, video || null).then(function (r) { setNight(r, r && r.server_now); }).catch(fail);
  }
  $('hPlay').addEventListener('click', function () { ctl('play', expected()); });
  $('hPause').addEventListener('click', function () { ctl('pause', expected()); });
  $('hRestart').addEventListener('click', function () { ctl('seek', 0); });
  $('hControls').addEventListener('click', function (e) { var b = e.target.closest('[data-seek]'); if (b) ctl('seek', Math.max(0, expected() + Number(b.getAttribute('data-seek')))); });
  $('hGo').addEventListener('click', function () { var t = parseTime($('hTime').value); if (t == null) return toast('Use a time like 12:30 or 1:05:00'); ctl('seek', t); });
  $('hLoad').addEventListener('click', function () { var v = ytId($('hLoadLink').value); if (!v) return toast('That is not a YouTube link.'); ctl('load', 0, v); $('hLoadLink').value = ''; });
  $('hCreate').addEventListener('click', function () {
    var title = $('hTitle').value.trim(), v = ytId($('hLink').value), st = $('hStart').value;
    if (title.length < 2) return toast('Give the movie night a title.'); if (!v) return toast('Paste a YouTube link or video ID.');
    S.B.mnCreate(title, v, st ? new Date(st).toISOString() : null).then(function () { $('hTitle').value = ''; $('hLink').value = ''; toast('Movie night created.'); init(); }).catch(fail);
  });
  $('hEnd').addEventListener('click', function () { if (S.night && confirm('End this movie night for everyone?')) S.B.mnEnd(S.night.id).then(function () { toast('Movie night ended.'); init(); }).catch(fail); });
  function sendSay(t) { t = String(t || '').trim(); if (!t || !S.night) return; S.B.mnSay(S.night.id, t).then(function () { $('hSay').value = ''; }).catch(fail); }
  $('hSend').addEventListener('click', function () { sendSay($('hSay').value); });
  $('hSay').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendSay(this.value); });
  $('hControls').addEventListener('click', function (e) { var q = e.target.closest('[data-quick]'); if (q) sendSay(q.getAttribute('data-quick')); });
  $('enter').addEventListener('click', startPlayer);
  $('fs').addEventListener('click', function () { var s = $('stageWrap'); (s.requestFullscreen || s.webkitRequestFullscreen || function () {}).call(s); });
  init();
})();
<\/script>
</body>
</html>
</script>

<script>
/* arcade bridge: routes page-to-page navigation through the single index.html shell */

window.__go = function(r){ try{ parent.__arcadeGo(r); }catch(e){ } };

document.addEventListener('DOMContentLoaded', __pushTitle); window.addEventListener('load', __pushTitle);
window.__reload = function(){ try{ parent.__arcadeReload(); }catch(e){ location.reload(); } };
document.addEventListener('click', function(e){

  if (/^(https?:|mailto:|javascript:)/i.test(h)) return;

}, true);
<\/script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Game | Diane Keaton Legacy Entertainment Center</title>
    <link rel="icon" href="https://images.unsplash.com/photo-1509023464722-18d996393ca8?w=32&h=32&fit=crop" type="image/png">
    <script src="https://unpkg.com/@ruffle-rs/ruffle"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --neon-blue: #D0AE67;
            --neon-purple: #B8955A;
            --neon-pink: #D0AE67;
            --neon-green: #39ff14;
            --dark-bg: #111111;
            --darker: #111111;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--dark-bg);
            color: white;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(90deg, transparent 49%, rgba(208, 174, 103, 0.05) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(208, 174, 103, 0.05) 50%, transparent 51%);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .top-bar {
            background: rgba(17, 17, 17, 0.98);
            backdrop-filter: blur(30px);
            padding: 15px 30px;
            display: flex;

                showGameError(currentGame.name, 'Ruffle failed to load the Flash file');
            });
            
            setTimeout(() => {
                if (document.getElementById('loading').style.display !== 'none') {
                    showGameError(currentGame.name, 'Game loading timeout');
                }
            }, 15000);
            }
        } else {
            document.getElementById('loading').innerHTML = `
                <div style="font-family: Orbitron; font-size: 2em; color: #D0AE67; text-align: center;">
                    ⚠️ GAME NOT FOUND
                </div>
                <a href="arcade.html" class="back-btn" style="margin-top: 30px;">← BACK TO ARCADE</a>
            `;
        }
        
        function showGameError(gameName, errorMessage) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-game-name').textContent = gameName;
            document.getElementById('error-msg').style.display = 'block';
            console.error(`Game Error: ${gameName} - ${errorMessage}`);
        }
        
        // TRACK GAME PLAYED: XP is awarded by the server (record_game_play), never by the browser.
        function trackGamePlayed(gameId) {
            try {
                var B = parent.DKBackend;
                if (!B || !B.client || !B.user || !B.recordPlay) return;
                B.recordPlay(gameId).then(function () { return B.syncCache(); }).catch(function (e) { console.warn('recordPlay failed:', e && e.message); });
            } catch (error) { console.error('Failed to track game:', error); }
        }

        // SCORE MODAL FUNCTIONS
        function startScoreTracking(gameId) {
            var chip = document.getElementById('score-status'), D = null, B = null;
            try { D = parent.DKScore; B = parent.DKBackend; } catch (e) {}
            function say(t, c) { chip.textContent = t; chip.className = 'score-status' + (c ? ' ' + c : ''); }
            if (!D || !B) return say('Score tracking unavailable');
            // Games report through this function (ExternalInterface) or via postMessage. Players cannot enter scores.
            window.dkReportScore = function (n) { return D.report(n); };
            window.addEventListener('message', function (e) { var d = e.data; if (d && d.type === 'dk-score' && isFinite(Number(d.score))) D.report(Number(d.score)); });
            D.on(function (ev) {
                if (ev.type === 'result') {
                    var r = ev.result || {};
                    if (r.accepted) showNotification(r.new_best ? '🏆 New personal best: ' + Number(ev.score).toLocaleString() + '!' : '✅ Score recorded: ' + Number(ev.score).toLocaleString(), 'success');
                    else if (r.flagged) showNotification('⏳ That score is being reviewed by an admin before it appears.', 'info');
                    else showNotification('That round was too short to count.', 'info');
                } else if (ev.type === 'error') showNotification('Score not recorded: ' + ev.message, 'error');
            });
            function state() {
                if (!B.user) return say('🔒 Log in to have scores saved', 'warn');
                if (D.hasAdapter(gameId)) return say('✅ Scores are recorded automatically', 'on');
                say('Score tracking is not set up for this game yet', 'warn');
            }
            state();
            if (B.user) D.begin(gameId);
        }
        
        function openEmbedModal() {
            if (!gameName || !resolveGame(gameName)) return;
            
            const currentGame = resolveGame(gameName);
            const gameURL = `${parent.location.origin}${parent.location.pathname}#/game?game=${encodeURIComponent(gameName)}`;
            
            document.getElementById('embed-game-name').textContent = currentGame.name;
            
            // Generate iframe embed code
            const iframeCode = `<iframe src="${gameURL}" width="800" height="600" frameborder="0" allowfullscreen style="border: 3px solid #D0AE67; border-radius: 10px;"></iframe>`;
            document.getElementById('iframe-code').textContent = iframeCode;
            
            // Direct link
            document.getElementById('direct-link').textContent = gameURL;
            
            document.getElementById('embed-modal').classList.add('active');
        }
        
        function closeEmbedModal() {
            document.getElementById('embed-modal').classList.remove('active');
        }
        
        function copyCode(elementId) {
            const code = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = event.target;
                btn.textContent = '✓ COPIED!';
                btn.classList.add('copied');
                
                showNotification('Copied to clipboard!');
                
                setTimeout(() => {
                    btn.textContent = '📋 COPY';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Copy failed:', err);
                showNotification('Copy failed - try selecting the text manually');
            });
        }
        
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
        
        // Close modals on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeEmbedModal();
                closeScoreModal();
            }
        });
    <\/script>

</script>

        let currentFilter = 'all';
        
        function getUser() {
            const userData = localStorage.getItem('arcadeUser');
            return userData ? JSON.parse(userData) : null;
        }
        
        function saveUser(user) {
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            localStorage.setItem('user_' + user.username, JSON.stringify(user));
        }
        
        function checkAndUnlockAchievements() {
            const user = getUser();
            if (!user) return;
            
            if (!user.achievements) user.achievements = [];
            if (!user.unlockedAchievements) user.unlockedAchievements = [];
            
            let newUnlocks = 0;
            
            ALL_ACHIEVEMENTS.forEach(ach => {
                if (user.unlockedAchievements.includes(ach.id)) return;
                if (ach.badge) { if ((user.badges || []).indexOf(ach.badge) >= 0) { user.unlockedAchievements.push(ach.id); newUnlocks++; } return; }
                
                let shouldUnlock = false;
                
                // Check conditions for auto-unlock
                switch(ach.id) {
                    case 'first_steps':
                        shouldUnlock = true;
                        break;
                    case 'annie_hall':
                        shouldUnlock = (user.gamesPlayed || 0) >= 1;
                        break;
                    case 'coffee_break':
                        shouldUnlock = (user.gamesPlayed || 0) >= 5;
                        break;
                    case 'godfather':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 10;
                        break;
                    case 'godfather_2':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 20;
                        break;
                    case 'manhattan':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 25;
                        break;
                    case 'marvins_room':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 50;
                        break;
                    case 'century':
                        shouldUnlock = calculateLevel(user.xp || 0) >= 100;
                        break;
                    case 'movie_buff':
                        shouldUnlock = (user.moviesWatched || 0) >= 5;
                        break;
                    case 'film_fanatic':
                        shouldUnlock = (user.moviesWatched || 0) >= 10;
                        break;
                    case 'cinema_devotee':
                        shouldUnlock = (user.moviesWatched || 0) >= 25;
                        break;
                    case 'diane_devotee':
                        shouldUnlock = (user.moviesWatched || 0) >= 40;
                        break;
                    case 'coin_collector':
                        shouldUnlock = (user.totalCoinsEarned || user.coins || 0) >= 1000;
                        break;
                    case 'hoarder':
                        shouldUnlock = (user.totalCoinsEarned || user.coins || 0) >= 10000;
                        break;
                    case 'millionaire':
                        shouldUnlock = (user.totalCoinsEarned || user.coins || 0) >= 1000000;
                        break;
                    case 'father_bride':
                        shouldUnlock = (user.gamesPlayed || 0) >= 100;
                        break;
                    case 'manhattan_murder':
                        shouldUnlock = (user.uniqueGamesPlayed || 0) >= 20;
                        break;
                    case 'collector':
                        shouldUnlock = user.unlockedAchievements.length >= 10;
                        break;
                    case 'curator':
                        shouldUnlock = user.unlockedAchievements.length >= 50;
                        break;
                    case 'archivist':
                        shouldUnlock = user.unlockedAchievements.length >= 100;
                        break;
                    case 'interiors':
                        shouldUnlock = user.avatar && user.banner;
                        break;
                    case 'badge_hunter':
                        shouldUnlock = (user.badges || []).length >= 5;
                        break;
                    case 'first_purchase':
                        shouldUnlock = (user.totalPurchases || 0) >= 1;
                        break;
                    case 'big_spender':
                        shouldUnlock = (user.totalSpent || 0) >= 10000;
                        break;
                    case 'whale':
                        shouldUnlock = (user.totalSpent || 0) >= 100000;
                        break;
                    case 'xp_apprentice':
                        shouldUnlock = (user.xp || 0) >= 1000;
                        break;
                    case 'xp_expert':
                        shouldUnlock = (user.xp || 0) >= 10000;
                        break;
                    case 'xp_legend':
                        shouldUnlock = (user.xp || 0) >= 100000;
                        break;
                    case 'mad_money':
                        shouldUnlock = (user.xp || 0) >= 100000;
                        break;
                }
                
                if (shouldUnlock) {
                    user.unlockedAchievements.push(ach.id);
                    user.xp = (user.xp || 0) + ach.xp;
                    newUnlocks++;
                }
            });
            
            if (newUnlocks > 0) {
                saveUser(user);
            }
        }
        
        function calculateLevel(xp) {
            return Math.floor(Math.sqrt(xp / 100)) + 1;
        }
        
        function loadAchievements() {
            checkAndUnlockAchievements();
            
            const user = getUser();
            const unlockedIds = user ? (user.unlockedAchievements || []) : [];
            
            const container = document.getElementById('achievements-container');
            container.innerHTML = '';
            
            let unlockedCount = 0;
            let totalXP = 0;
            
            ALL_ACHIEVEMENTS.forEach(achievement => {
                const isUnlocked = unlockedIds.includes(achievement.id);
                
                if (isUnlocked) {
                    unlockedCount++;
                    totalXP += achievement.xp;
                }
                
                // Apply filter
                if (currentFilter === 'unlocked' && !isUnlocked) return;
                if (currentFilter === 'locked' && isUnlocked) return;
                if (currentFilter !== 'all' && currentFilter !== 'unlocked' && currentFilter !== 'locked') {
                    if (achievement.category !== currentFilter) return;
                }
                
                const card = document.createElement('div');
                card.className = 'achievement-card' + (isUnlocked ? '' : ' locked');
                
                card.innerHTML = `
                    ${!isUnlocked ? '<div class="lock-icon">🔒</div>' : ''}
                    <div class="achievement-badge">${achievement.icon}</div>
                    <h4>${achievement.name}</h4>
                    <p>${achievement.desc}</p>
                    <div class="achievement-film">${achievement.film}</div>
                    <div class="achievement-xp">${achievement.badge ? '🏅 BADGE' : '+' + achievement.xp + ' XP'}</div>
                `;
                
                container.appendChild(card);
            });
            
            // Update stats
            document.getElementById('unlocked-count').textContent = unlockedCount;
            document.getElementById('total-count').textContent = ALL_ACHIEVEMENTS.length;
            const completion = Math.round((unlockedCount / ALL_ACHIEVEMENTS.length) * 100);
            document.getElementById('completion').textContent = completion + '%';
            document.getElementById('total-xp').textContent = totalXP.toLocaleString();
        }
        
        function filterAchievements(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            loadAchievements();
        }
        
        // Auto-check achievements every 30 seconds
        setInterval(checkAndUnlockAchievements, 30000);
        
        loadAchievements();

                    if (!B) return reject(new Error('Backend unavailable.'));
                    if (B.client) return resolve(B);
                    if (B.status === 'unconfigured' || B.status === 'offline' || tries++ > 50) return reject(new Error('Cannot reach the server right now.'));
                    setTimeout(w, 200);

        function getMonday(date) {
            const d = new Date(date);

            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            monday.setHours(0, 0, 0, 0);
            return monday;

            document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));

    const p = players[i];

    div.className = `podium-place ${classes[i]}`;
    
    const scoreVal = scoreType === 'xp' 
        ? `${(p.xp || 0).toLocaleString()} XP`
        : `${(p.score || 0).toLocaleString()}`;
    
    let avatar = p.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${p.username}`;
                div.innerHTML = `

                const avatar = s.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${s.username}`;
                const date = s.date ? new Date(s.date).toLocaleDateString() : 'N/A';

                tbody.innerHTML += `
                    <tr>
                        <td class="rank-cell ${rankClass}">${rankEmoji} #${rank}</td>
                        <td>
                            <div class="player-cell">
                                <img src="${avatar}" class="player-avatar">
                                <div class="player-name">${plink(s.username)}</div>
                            </div>
                        </td>
                        <td class="score-cell">${(s.score || 0).toLocaleString()}</td>
                        <td>${date}</td>
                        <td><a href="profile.html?user=${s.username}" class="view-profile-btn">VIEW</a></td>
                    </tr>
                `;
            });
        }
        
        function buildLeaderboards() {
            const tabsContainer = document.getElementById('category-tabs');
            const lbContainer = document.getElementById('leaderboards-container');

            tabsContainer.innerHTML = '';
            Object.keys(GAMES).forEach((key, idx) => {
                const game = GAMES[key];
                const btn = document.createElement('button');
                btn.textContent = `${game.icon} ${game.name.toUpperCase()}`;
                btn.className = 'category-tab' + (idx === 0 ? ' active' : '');
                btn.dataset.category = key;
                btn.onclick = () => showCategory(key);
                tabsContainer.appendChild(btn);
            });

            lbContainer.innerHTML = '';
            Object.keys(GAMES).forEach(key => {
                const game = GAMES[key];
                const isGlobal = key === 'global';
                
                lbContainer.innerHTML += `
                    <div class="leaderboard-section ${key === 'global' ? 'active' : ''}" id="${key}-section">
                        <div class="leaderboard-header">
                            <h2 class="leaderboard-title">${game.icon} ${game.name.toUpperCase()}</h2>
                            <p class="leaderboard-subtitle">${game.subtitle}</p>
                        </div>
                        <div class="podium" id="${key}-podium"></div>
                        <div class="leaderboard-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>RANK</th>
                                        <th>PLAYER</th>
                                        ${isGlobal ? '<th>LEVEL</th><th>TOTAL XP</th><th>ACHIEVEMENTS</th>' : '<th>SCORE</th><th>DATE</th>'}
                                        <th>ACTION</th>
                                    </tr>
                                </thead>
                                <tbody id="${key}-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            checkWeeklyReset();
            showCategory('global');
        }
        
        // Save score function for game.html to use
        // Initialize leaderboards on page load
        document.addEventListener('DOMContentLoaded', function() {
            buildLeaderboards();
            var want = new URLSearchParams(window.__SEARCH || '').get('game');
            if (want && document.getElementById(want + '-section')) showCategory(want);
        });
    <\/script>
