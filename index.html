    <script>
        let mediaFile = null;
        let mediaType = null;
        
        function MB() { try { return parent.DKBackend; } catch (e) { return null; } }
        function waitB() {
            return new Promise(function (res, rej) {
                var B = MB(), n = 0;
                (function w() {
                    if (!B) return rej(new Error('Backend unavailable.'));
                    if (B.client) return res(B);
                    if (B.status === 'unconfigured' || B.status === 'offline' || n++ > 50) return rej(new Error('Cannot reach the server right now.'));
                    setTimeout(w, 200);
                })();
            });
        }
        // Signed-in user from the real Supabase session (null if logged out). Display name comes from the server profile.
        function getUser() {
            var B = MB();
            if (!B || !B.user) return null;
            return { id: B.user.id, username: (B.user.user_metadata && B.user.user_metadata.username) || 'Member' };
        }
        var IS_ADMIN = false;

        function loadMemories() {
            const container = document.getElementById('memories-grid');
            waitB().then(function (B) {
                return Promise.all([B.memoriesList(), B.isAdmin().catch(function () { return false; })]).then(function (x) {
                    IS_ADMIN = !!x[1];
                    if (x[0].error) throw x[0].error;
                    const rows = x[0].data || [];
                    const ids = Array.from(new Set(rows.map(function (r) { return r.user_id; }).filter(Boolean)));
                    return (ids.length ? B.profilesByIds(ids) : Promise.resolve({ data: [] })).then(function (p) {
                        const byId = {}; ((p && p.data) || []).forEach(function (u) { byId[u.id] = u; });
                        return { rows: rows, byId: byId, B: B };
                    });
                });
            }).then(function (ctx) { renderMemories(ctx.rows, ctx.byId, ctx.B); })
            .catch(function (e) {
                console.error('Error loading memories:', e);
                container.innerHTML = '<div class="no-memories" style="grid-column: 1/-1;"><p style="color: var(--neon-pink);">Could not load memories: ' + escapeHtml(String((e && e.message) || e)) + '</p></div>';
            });
        }

        function renderMemories(memories, byId, B) {
            const container = document.getElementById('memories-grid');
            const me = getUser();
            if (memories.length === 0) {
                container.innerHTML = `
                    <div class="no-memories" style="grid-column: 1/-1;">
                        <div class="no-memories-icon">❤️</div>
                        <h3 style="font-family: 'Orbitron', sans-serif; font-size: 2em; margin-bottom: 20px; color: var(--neon-pink);">No memories shared yet</h3>
                        <p style="font-size: 1.2em;">Be the first to share a memory of Diane Keaton!</p>
                    </div>`;
                return;
            }
            container.innerHTML = memories.map(function (m) {
                const prof = byId[m.user_id] || {};
                const username = m.author_name || prof.username || 'Member';
                const profHref = (m.author_name || prof.username) ? 'profile.html?user=' + encodeURIComponent(m.author_name || prof.username) : (m.user_id ? 'profile.html?id=' + encodeURIComponent(m.user_id) : 'profile.html');
                const date = new Date(m.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                const avatar = prof.avatar_url || ('https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(username));
                let mediaHTML = '';
                if (m.image_path) {
                    const url = B.memoryUrl(m.image_path);
                    mediaHTML = (m.media_type === 'video' || /\.(mp4|webm)$/i.test(m.image_path))
                        ? '<video src="' + escapeHtml(url) + '" class="memory-media" controls></video>'
                        : '<img src="' + escapeHtml(url) + '" alt="Memory" class="memory-media">';
                }
                const mine = me && m.user_id === me.id;
                let tag = '';
                
                if (m.status === 'rejected') tag = '<div style="color:#ff6b6b;font-weight:700;margin:6px 0">✖ Hidden by a moderator' + (mine ? ' (only you can see this)' : '') + '</div>';
                let actions = '';
                if (IS_ADMIN) actions += (m.status === 'rejected' ? '<button onclick="modMemory(\'' + m.id + '\',\'approved\')">✅ Restore</button> ' : '<button onclick="modMemory(\'' + m.id + '\',\'rejected\')">🚫 Hide</button> ');
                if (IS_ADMIN || mine) actions += '<button onclick="delMemory(\'' + m.id + '\')">🗑 Delete</button>';
                return `
                    <div class="memory-card" data-mid="${m.id}">
                        ${mediaHTML}
                        <div class="memory-content">
                            <div class="memory-author">
                                <a href="${profHref}" aria-label="View ${escapeHtml(username)}'s profile"><img src="${escapeHtml(avatar)}" alt="${escapeHtml(username)}" class="author-avatar"></a>
                                <div class="author-info">
                                    <a href="${profHref}" class="author-name">${escapeHtml(username)}</a>
                                    <div class="memory-date">${date}</div>
                                </div>
                            </div>
                            ${tag}
                            <div class="memory-text">${escapeHtml(m.body || '')}</div>
                            <div class="memory-inspiration">
                                <strong style="color: var(--neon-pink);">What inspired me:</strong> ${escapeHtml(m.inspiration || '')}
                            </div>
                            ${actions ? '<div style="margin-top:10px">' + actions + '</div>' : ''}
                        </div>
                    </div>`;
            }).join('');
        }

        function modMemory(id, status) {
            waitB().then(function (B) { return B.memoryModerate(id, status); })
                .then(function () { showNotification(status === 'approved' ? 'Memory approved.' : 'Memory rejected.', 'success'); loadMemories(); })
                .catch(function (e) { showNotification('Error: ' + (e.message || e), 'error'); });
        }
        function delMemory(id) {
            if (!confirm('Delete this memory permanently?')) return;
            waitB().then(function (B) { return B.memoryDelete(id); })
                .then(function () { showNotification('Memory deleted.', 'success'); loadMemories(); })
                .catch(function (e) { showNotification('Error: ' + (e.message || e), 'error'); });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function openMemoryModal() {
            const user = getUser();
            
            if (!user) {
                showNotification('Please create/login to your profile first!', 'error');
                setTimeout(() => {
                    window.__go('profile.html');
                }, 2000);
                return;
            }
            
            console.log('✅ Opening modal for user:', user.username);
            document.getElementById('memory-modal').classList.add('active');
        }
        
        function closeMemoryModal() {
            document.getElementById('memory-modal').classList.remove('active');
            document.getElementById('memory-form').reset();
            document.getElementById('media-preview-image').style.display = 'none';
            document.getElementById('media-preview-video').style.display = 'none';
            mediaFile = null;
            mediaType = null;
        }
        
        function previewMedia(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            console.log('📷 File selected:', file.name, file.size, 'bytes');
            
            if (file.size > 50 * 1024 * 1024) {
                showNotification('File too large! Max 50MB', 'error');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                if (file.type.startsWith('image/')) {
                    // Compress and resize image
                    compressImage(e.target.result, function(compressed) {
                        mediaFile = compressed;
                        mediaType = 'image';
                        const previewImg = document.getElementById('media-preview-image');
                        previewImg.src = compressed;
                        previewImg.style.display = 'block';
                        document.getElementById('media-preview-video').style.display = 'none';
                        console.log('✅ Image compressed from', file.size, 'to ~', Math.round(compressed.length * 0.75), 'bytes');
                    });
                } else if (file.type.startsWith('video/')) {
                    mediaType = 'video';
                    mediaFile = e.target.result;
                    const previewVid = document.getElementById('media-preview-video');
                    previewVid.src = e.target.result;
                    previewVid.style.display = 'block';
                    document.getElementById('media-preview-image').style.display = 'none';
                    console.log('✅ Video loaded');
                }
            };
            reader.readAsDataURL(file);
        }
        
        function compressImage(dataUrl, callback) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                // Resize if larger than 1920x1080
                const maxWidth = 1920;
                const maxHeight = 1080;
                
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = width * ratio;
                    height = height * ratio;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Compress to 0.7 quality JPEG
                const compressed = canvas.toDataURL('image/jpeg', 0.7);
                callback(compressed);
            };
            img.src = dataUrl;
        }
        
        function submitMemory(e) {
            e.preventDefault();
            const user = getUser();
            if (!user) {
                showNotification('You must be logged in! Redirecting...', 'error');
                setTimeout(() => window.__go('login.html'), 1500);
                return;
            }
            const text = document.getElementById('memory-text').value.trim();
            const inspiration = document.getElementById('memory-inspiration').value.trim();
            if (!text || !inspiration) { showNotification('Please fill in all required fields!', 'error'); return; }
            if (!mediaFile) { showNotification('Please add a photo or video to share!', 'error'); return; }
            const btn = e.target.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
            waitB().then(function (B) {
                return fetch(mediaFile).then(function (r) { return r.blob(); }).then(function (blob) {
                    return B.memoryUpload(blob, mediaType);
                }).then(function (path) {
                    return B.memorySave({ title: text.slice(0, 80), body: text, inspiration: inspiration, image_path: path, media_type: mediaType });
                });
            }).then(function (r) {
                if (r && r.error) throw r.error;
                showNotification('❤️ Your memory is posted. Thank you for sharing!', 'success');
                closeMemoryModal();
                var newId = r && r.data && r.data.id;
                loadMemories();
                if (newId) setTimeout(function () { if (!document.querySelector('[data-mid="' + newId + '"]')) showNotification('⚠️ Saved, but it could not be read back. An administrator needs to run 010_memories_fix.sql.', 'error'); }, 2500);
            }).catch(function (err) {
                showNotification('Error: ' + ((err && err.message) || err), 'error');
            }).then(function () { if (btn) btn.disabled = false; });
        }
        
        function showNotification(message, type = 'info') {
            console.log('🔔 Notification:', type, '-', message);
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeMemoryModal();
            }
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Page loaded, initializing...');
            loadMemories();
        });
    <\/script>
</body>

</script>

                    if (!B) return rej(new Error('Backend unavailable.'));
                    if (B.client) return res(B);
                    if (B.status === 'unconfigured' || B.status === 'offline' || n++ > 50) return rej(new Error('Cannot reach the server right now.'));

        function trackMovieWatched(movieTitle, platform) {
            try {
                const user = JSON.parse(localStorage.getItem('arcadeUser'));
                if (!user) return;
                
                if (!user.moviesWatched) user.moviesWatched = 0;
                if (!user.moviesHistory) user.moviesHistory = {};
                
                const movieKey = `${platform}_${movieTitle}`;
                if (user.moviesHistory[movieKey]) {
                    console.log('Movie already watched - no XP');
                    return;
                }
                
                // Add 25 XP
                user.xp = (user.xp || 0) + 25;
                user.moviesWatched++;
                user.level = Math.floor(Math.sqrt(user.xp / 100)) + 1;
                
                user.moviesHistory[movieKey] = {
                    title: movieTitle,
                    platform: platform,
                    watchedAt: new Date().toISOString()
                };
                
                localStorage.setItem('arcadeUser', JSON.stringify(user));
                localStorage.setItem('user_' + user.username, JSON.stringify(user));
                
                showXPNotification(movieTitle);
                console.log(`✅ +25 XP for watching ${movieTitle} on ${platform}`);
            } catch (error) {
                console.error('Failed to track movie:', error);
            }
        }

                <div style="font-size: 0.9em;">Watched: ${movieTitle}</div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideIn 0.5s ease reverse';
                setTimeout(() => notification.remove(), 500);
            }, 5000);
        }

                        }
                    }).catch(function () {});
                }
            } catch (e) {}
            // TUBI doesn't allow iframe embedding - open in new tab

                if (confirm(`Watch "${movie.title}" on Tubi?\n\nThis will open in a new tab. You'll earn +25 XP when you start watching!`)) {

            // TRACK MOVIE WATCHED - ADD XP AFTER 5 MINUTES

                    var cls = nn.cur && nn.cur.id === p.id ? 'now' : (nn.next && nn.next.id === p.id ? 'next' : '');

                }).join('') + '</ul>';
                var its = chItems(id);
                h += '<h3>ON-DEMAND LIBRARY</h3>' + (its.length ? '<div class="dtv-lib">' + its.map(function (i) {
                    return '<button type="button" class="dtv-item' + (S.mode === 'vod' && i.id === S.itemId ? ' active' : '') + '" data-item="' + esc(i.id) + '"><strong>' + esc(i.title) + '</strong><small>' + esc(i.year || '') + (i.description ? ' · ' + esc(i.description) : '') + '</small></button>';
                }).join('') + '</div>' : '<p class="dtv-empty">No videos on this channel yet.</p>');
                el.innerHTML = h;
            }

            /* ---- data ---- */
            function load() {
                return Promise.all([B.tvChannels(), B.tvAllItems(), B.tvPrograms()]).then(function (r) {
                    for (var i = 0; i < r.length; i++) if (r[i].error) throw r[i].error;

                });

                load().then(function () {
                    if (!chById(S.chId)) { S.chId = null; if (S.channels.length) { S.chId = S.channels[0].id; S.vidMode = null; } }
                    renderTabs(); if (S.chId) evaluate(); else { renderNow(); renderGuide(); }
                }).catch(function () {});
            }
            function start() {
                load().then(function () {
                    if (!S.channels.length) { msg('No channels have been set up yet. An administrator can add them in the Admin Panel.'); return; }
                    S.chId = S.channels[0].id; renderTabs(); evaluate();
                    var t; try { B.tvSubscribe(function () { clearTimeout(t); t = setTimeout(refresh, 400); }); } catch (e) {}
                    setInterval(function () { if (!S.hold) { var nn = S.chId ? nowNext(S.chId, Date.now()) : {}; if (S.mode === 'live' && (!nn.cur || nn.cur.id !== S.progId)) evaluate(); else { renderNow(); renderGuide(); } } }, 15000);
                }).catch(function () { msg('Diane TV could not load the channel list from the server. Please try again later.', true); });
            }

            /* ---- wiring ---- */
            $('dtv-tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-ch]'); if (b) selectChannel(b.getAttribute('data-ch'), true); });
            $('dtv-guide').addEventListener('click', function (e) { var b = e.target.closest('[data-item]'); if (b) selectItem(b.getAttribute('data-item'), true, true); });
            $('dtv-now').addEventListener('click', function (e) { if (e.target.id === 'dtv-golive') { S.userVod = false; S.vidMode = null; evaluate(); } });
            $('dtv-tune').addEventListener('click', function () { try { player.unMute(); player.playVideo(); } catch (e) {} setTimeout(chrome, 500); });
            $('dtv-fs').addEventListener('click', function () { var s = $('dtv-stage'); (s.requestFullscreen || s.webkitRequestFullscreen || function () {}).call(s); });
            /* never let two videos play at once: pause Diane TV while the on-demand modal below is open */
            var _open = window.openMovie, _close = window.closeVideo;
            if (typeof _open === 'function') window.openMovie = function () { S.hold = true; try { if (player) player.pauseVideo(); } catch (e) {} return _open.apply(this, arguments); };
            if (typeof _close === 'function') window.closeVideo = function () { var r = _close.apply(this, arguments); if (S.hold) { S.hold = false; if (S.mode === 'live') { S.vidMode = null; evaluate(); } } return r; };

            var tries = 0;
            (function wait() {
                try { B = parent.DKBackend; } catch (e) { B = null; }
                if (B && B.status === 'unconfigured') { msg('Diane TV needs the site backend, which is not configured.', true); return; }
                if (B && B.client) return start();
                if (tries++ < 75) setTimeout(wait, 200); else msg('Diane TV could not reach the backend. Please refresh.', true);
            })();
        })();
    <\/script>

                <strong>Diane Keaton Legacy Entertainment Center?</strong>
            </p>
            <p class="modal-text" style="color: var(--neon-red);">

            </p>

                <li>✗ Coins</li>

                <li>✗ Game Scores</li>
                <li>✗ Profile Data</li>
            </ul>
            
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="closeDeleteModal()">↩️ CANCEL</button>
                <button class="btn btn-danger" onclick="deleteAccount()">🗑️ YES, DELETE MY ACCOUNT</button>
            </div>
        </div>

    <script>
        const ADMIN_EMAILS = [
            'tannerkurrasch@gmail.com',
            'kurraschgamingmerchstore@gmail.com',
            'gamekillerszone@gmail.com'
        ];
        
        let currentUser = null;
        
        function loadUserData() {
            const userData = localStorage.getItem('arcadeUser');
            
            if (!userData) {
                alert('Please login first!');
                window.__go('index.html');
                return;
            }
            
            currentUser = JSON.parse(userData);
            
            // Update form fields
            document.getElementById('username').value = currentUser.username || 'Unknown';
            document.getElementById('email').value = currentUser.email || 'No email';
            
            // Calculate level from XP
            const xp = currentUser.xp || 0;
            const level = Math.floor(Math.sqrt(xp / 100)) + 1;
            
            // Update stats
            document.getElementById('statLevel').textContent = level;
            document.getElementById('statXp').textContent = xp.toLocaleString();
            document.getElementById('statCoins').textContent = (currentUser.coins || 0).toLocaleString();
            document.getElementById('statGames').textContent = (currentUser.gamesPlayed || 0).toLocaleString();
            
            // Show admin link if user is admin
            try { parent.DKBackend.isAdmin().then(function (ok) { if (ok) document.getElementById('adminLink').style.display = 'block'; }); } catch (e) {}
        }
        
        function savePassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!password) {
                showNotification('Please enter a new password', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showNotification('Passwords do not match!', 'error');
                return;
            }
            
            if (password.length < 6) {
                showNotification('Password must be at least 6 characters', 'error');
                return;
            }
            
            // Update password in localStorage
            currentUser.password = password;
            localStorage.setItem('arcadeUser', JSON.stringify(currentUser));
            
            showNotification('Password changed successfully!', 'success');
            document.getElementById('password').value = '';
            document.getElementById('confirmPassword').value = '';
        }
        
        function showDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
        }
        
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
        }
        
        function deleteAccount() {
            if (!currentUser) return;
            alert('Account deletion needs a server-side function that has not been deployed yet. Please contact an administrator to delete your account.');
            return;
            // Remove all user data from localStorage
            localStorage.removeItem('arcadeUser');
            localStorage.removeItem('user_' + currentUser.username);
            
            // Clear all user-specific data
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes(currentUser.username) || key.includes(currentUser.email)) {
                    keysToRemove.push(key);
                }
            }
            keysToRemove.forEach(key => localStorage.removeItem(key));
            
            showNotification('Account deleted successfully', 'success');
            
            // Redirect to home after 1 second
            setTimeout(() => {
                window.__go('index.html');
            }, 1000);
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDeleteModal();
        });
        
        // Load user data on page load
        loadUserData();
    <\/script>
</body>

</script>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Admin control center. Every action is re-verified by the database (is_admin()); this page only asks. ===== */
(function () {
  'use strict';
  var S = { info: null, adminList: [], users: [], byId: {}, sec: 'dashboard', memFilter: 'approved', openId: null, audit: [], mem: [], memCount: 0, apps: [], bots: [], botNames: {} };
  function BK() { return parent.DKBackend; }
  function $(id) { return document.getElementById(id); }
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(msg, kind) { var t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (kind || ''); clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'toast'; }, 4500); }
  function fail(e) { toast('❌ ' + ((e && e.message) || e), 'err'); }
  function ago(d) { if (!d) return '—'; var s = Math.max(0, (Date.now() - new Date(d).getTime()) / 1000); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return Math.floor(s / 86400) + ' d ago'; }
  function num(n) { return Number(n || 0).toLocaleString(); }
  function initial(n) { return esc(String(n || '?').charAt(0).toUpperCase()); }
  function avatar(u, size) { return u && u.avatar_url ? '<img class="avatar" ' + (size ? 'style="width:' + size + 'px;height:' + size + 'px" ' : '') + 'src="' + esc(u.avatar_url) + '" alt="">' : '<span class="avatar" ' + (size ? 'style="width:' + size + 'px;height:' + size + 'px" ' : '') + '>' + initial(u && u.username) + '</span>'; }
  function status(u) {
    if (u.banned) return '<span class="pill p-bad">BANNED</span>';
    if (u.restricted_until && new Date(u.restricted_until) > new Date()) return '<span class="pill p-warn">RESTRICTED</span>';
    if (u.is_admin) return '<span class="pill p-adm">ADMIN</span>';
    if (u.is_staff) return '<span class="pill p-staff">STAFF</span>';
    return '<span class="pill p-ok">ACTIVE</span>';
  }
  function setCount(id, n) { var e = $('ct' + id); if (!e) return; e.textContent = n; e.style.display = n > 0 ? 'inline-block' : 'none'; }

  /* ---------- navigation ---------- */
  window.showSection = function (id) {
    S.sec = id;
    Array.prototype.forEach.call(document.querySelectorAll('.sec'), function (s) { s.classList.toggle('active', s.id === 'sec-' + id); });
    Array.prototype.forEach.call(document.querySelectorAll('.nav-i'), function (b) { if (b.getAttribute('data-sec') === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (id === 'dashboard') renderDash(); else if (id === 'users') renderUsers(); else if (id === 'memories') loadMemories(); else if (id === 'shop') loadShop();
    else if (id === 'audit') loadAudit(); else if (id === 'admins') loadAdmins(); else if (id === 'ledger') loadLedger(); else if (id === 'scores') loadScores(); else if (id === 'applications') loadApplications(); else if (id === 'botSubs') loadBots();
    try { window.scrollTo(0, 0); } catch (e) {}
  };
  window.showAlert = function (_id, msg) { toast(msg); };   /* kept so older code that calls it still works */

  /* ---------- data ---------- */
  function loadUsers() {
    return BK().adminUsers().then(function (users) {
      S.users = users || []; S.byId = {}; S.users.forEach(function (u) { S.byId[u.id] = u; });
      renderUsers(); renderDash();
    }).catch(function (e) { $('userBody').innerHTML = '<tr><td colspan="5" class="empty">❌ ' + esc(e.message || e) + '<br>If this says the function does not exist, run 008_admin_tools.sql in Supabase.</td></tr>'; });
  }
  function refreshCounts() {
    var B = BK();
    B.adminMemories('approved').then(function (r) { S.memCount = (r.data || []).length; renderDash(); }).catch(function () {});
    B.adminApplications().then(function (r) { S.apps = r.data || []; setCount('Applications', S.apps.length); renderDash(); }).catch(function () {});
    B.adminFlags().then(function (r) { setCount('Scores', (r.data || []).length); }).catch(function () {});
    B.adminBotSubs().then(function (r) { S.bots = (r.data || []).filter(function (x) { return x.status === 'pending_activation'; }); setCount('BotSubs', S.bots.length); renderDash(); }).catch(function () {});
  }

  /* ---------- dashboard ---------- */
  function renderDash() {
    if (S.sec !== 'dashboard') return;
    var us = S.users, week = Date.now() - 7 * 86400000;
    var newU = us.filter(function (u) { return u.created_at && new Date(u.created_at).getTime() > week; }).length;
    var coins = us.reduce(function (a, u) { return a + (u.coins || 0); }, 0);
    var banned = us.filter(function (u) { return u.banned || (u.restricted_until && new Date(u.restricted_until) > new Date()); }).length;

            tvById('tvPrFrom').innerHTML = '<option value="">— choose —</option>' + its.map(function (it) { return '<option value="' + it.id + '">' + tvEsc(it.title) + '</option>'; }).join('');
        }
        function tvClearItemForm() { TV.itemId = null; ['tvItUrl', 'tvItTitle', 'tvItYear', 'tvItDesc'].forEach(function (i) { tvById(i).value = ''; }); }
        function tvEditItem(id) { var it = TV.items.filter(function (x) { return x.id === id; })[0]; if (!it) return; TV.itemId = id; tvById('tvItUrl').value = it.url || it.video_id || ''; tvById('tvItTitle').value = it.title; tvById('tvItYear').value = it.year || ''; tvById('tvItDesc').value = it.description || ''; tvById('tvItTitle').focus(); }
        function tvSaveItem() {
            if (!TV.chId) return tvSay('❌ Select a channel first.', true);
            var src = tvById('tvItUrl').value.trim(), title = tvById('tvItTitle').value.trim();
            if (!src) return tvSay('❌ Paste a YouTube link or video ID.', true);
            if (!title) return tvSay('❌ Title is required. Use "Look up real title" to fetch it from YouTube.', true);

            if (TV.itemId) { row.id = TV.itemId; var old = TV.items.filter(function (x) { return x.id === TV.itemId; })[0]; if (old) row.position = old.position; } else row.position = pos;
            tvB().tvSaveItem(row).then(tvChk).then(function () { tvSay('✅ Video saved to Supabase.'); tvClearItemForm(); return tvReload(); }).catch(tvFail);
        }
        function tvDeleteItem(id) { if (!confirm('Remove this video from the channel?')) return; tvB().tvRemoveItem(id).then(tvChk).then(function () { tvSay('✅ Video removed.'); return tvReload(); }).catch(tvFail); }
        function tvMoveItem(i, d) {
            var a = tvChItems(), j = i + d; if (j < 0 || j >= a.length) return;
            var t = a[i]; a[i] = a[j]; a[j] = t;

        /* YouTube oEmbed returns the REAL title, and fails for removed/private/non-embeddable videos, so it doubles as an availability check. */
        function tvOembed(vid) {
            return fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + vid))
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });

        /* ---- schedule / guide ---- */
        function tvRenderPrograms() {

                return '<tr><td>' + tvShow(p.starts_at) + '</td><td>' + tvShow(p.ends_at) + '</td><td>' + tvEsc(p.title) + '</td><td>' + tvEsc(tvYt(p.media_url) || p.media_url) + '</td><td><button class="tv-mini" onclick="tvEditProgram(\'' + p.id + '\')">✎</button><button class="tv-mini danger" onclick="tvDeleteProgram(\'' + p.id + '\')">🗑</button></td></tr>';
            }).join('') || '<tr><td colspan="5" class="tv-dim">' + (TV.chId ? 'Nothing scheduled. With no schedule the channel plays its videos on demand.' : 'Select a channel.') + '</td></tr>';
        }
        function tvRenderNowNext() {
            var el = tvById('tvNowNext'); if (!TV.chId) { el.textContent = ''; return; }

            tvChProgs().forEach(function (p) { var s = +new Date(p.starts_at), e = +new Date(p.ends_at); if (s <= t && t < e) cur = p; else if (s > t && !next) next = p; });
            el.innerHTML = '<b>Playing now:</b> ' + (cur ? tvEsc(cur.title) + ' <span class="tv-dim">(until ' + tvShow(cur.ends_at) + ')</span>' : '<span class="tv-dim">nothing scheduled right now (channel plays on demand)</span>') +
                '<br><b>Up next:</b> ' + (next ? tvEsc(next.title) + ' <span class="tv-dim">(' + tvShow(next.starts_at) + ')</span>' : '<span class="tv-dim">nothing scheduled</span>');
        }
        function tvClearProgramForm() { TV.progId = null; ['tvPrTitle', 'tvPrUrl', 'tvPrDesc', 'tvPrStart', 'tvPrDur', 'tvPrEnd'].forEach(function (i) { tvById(i).value = ''; }); tvById('tvPrFrom').value = ''; }
        function tvPrFill() {

            tvById('tvPrTitle').value = it.title; tvById('tvPrUrl').value = it.url || it.video_id || ''; tvById('tvPrDesc').value = it.description || '';
            if (it.duration_seconds) { tvById('tvPrDur').value = Math.round(it.duration_seconds / 60); tvPrCalcEnd(); }
        }
        function tvPrCalcEnd() { var s = tvById('tvPrStart').value, d = parseInt(tvById('tvPrDur').value, 10); if (s && d > 0) tvById('tvPrEnd').value = tvLocalInput(+new Date(s) + d * 60000); }
        function tvEditProgram(id) { var p = TV.programs.filter(function (x) { return x.id === id; })[0]; if (!p) return; TV.progId = id; tvById('tvPrTitle').value = p.title; tvById('tvPrUrl').value = p.media_url; tvById('tvPrDesc').value = p.description || ''; tvById('tvPrStart').value = tvLocalInput(p.starts_at); tvById('tvPrEnd').value = tvLocalInput(p.ends_at); tvById('tvPrDur').value = Math.round((new Date(p.ends_at) - new Date(p.starts_at)) / 60000); tvById('tvPrTitle').focus(); }
        function tvSaveProgram() {
            if (!TV.chId) return tvSay('❌ Select a channel first.', true);
            var title = tvById('tvPrTitle').value.trim(), url = tvById('tvPrUrl').value.trim(), s = tvById('tvPrStart').value, e = tvById('tvPrEnd').value;
            if (!title) return tvSay('❌ Program title is required.', true);
            if (!url) return tvSay('❌ A video link is required.', true);
            if (!s || !e) return tvSay('❌ Set a start time and either a duration or an end time.', true);
            var st = new Date(s), en = new Date(e);
            if (!(en > st)) return tvSay('❌ The end time must be after the start time.', true);

            var clash = tvChProgs().filter(function (p) { return p.id !== TV.progId && new Date(p.starts_at) < en && new Date(p.ends_at) > st; })[0];
            if (clash && !confirm('This overlaps "' + clash.title + '" (' + tvShow(clash.starts_at) + ' – ' + tvShow(clash.ends_at) + ').\nSave anyway?')) return;
            var row = { channel_id: TV.chId, title: title, description: tvById('tvPrDesc').value.trim() || null, media_url: media, starts_at: st.toISOString(), ends_at: en.toISOString(), position: tvChProgs().length };
            if (TV.progId) row.id = TV.progId;
            tvB().tvSaveProgram(row).then(tvChk).then(function () { tvSay('✅ Program saved to Supabase. The guide updates live for viewers.'); tvClearProgramForm(); return tvReload(); }).catch(tvFail);
        }
        function tvDeleteProgram(id) { if (!confirm('Delete this scheduled program?')) return; tvB().tvRemoveProgram(id).then(tvChk).then(function () { tvSay('✅ Program deleted.'); return tvReload(); }).catch(tvFail); }

        tvClearChannelForm();

<style>
:root{--bg:#050d1f;--ice:#6cc6ff;--ice2:#bfe6ff;--navy:#0a1a33;--text:#e8f3ff;--muted:#8fb0cf;--ns-ice:#6cc6ff;--neon-blue:#6cc6ff;--neon-pink:#6cc6ff;--neon-purple:#6cc6ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;background:radial-gradient(1000px 520px at 85% -10%,rgba(108,198,255,.22),transparent 62%),radial-gradient(800px 420px at 0% 30%,rgba(40,90,170,.25),transparent 65%),var(--bg)}
h1,h2,h3{font-family:Orbitron,Arial,sans-serif;margin:0}a{color:var(--ice)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.hero{text-align:center;padding:42px 0 18px}
.hero img.logo{width:min(560px,86vw);height:auto;border-radius:18px;box-shadow:0 0 60px rgba(108,198,255,.35);border:1px solid rgba(108,198,255,.35)}
.hero p{max-width:720px;margin:20px auto 0;color:var(--muted);font-size:17px}
.own{max-width:820px;margin:18px auto 26px;padding:12px 18px;border-radius:12px;border:1px solid rgba(108,198,255,.3);background:rgba(10,26,51,.7);color:#bcd4ea;font-size:14.5px;text-align:center}
.empty{max-width:700px;margin:0 auto 30px;padding:34px;text-align:center;border:1px dashed rgba(108,198,255,.4);border-radius:16px;color:var(--muted)}
.empty img{width:84px;height:auto;border-radius:16px;margin-bottom:10px}
/* ===== DIANE TV ===== */
        .nstv { max-width: 1100px; margin: 0 auto 50px; padding: 24px; border: 2px solid #6cc6ff; border-radius: 20px; background: rgba(5,5,16,.78); box-shadow: 0 0 30px rgba(108,198,255,.18); }
        .nstv-head { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
        .nstv-head h2 { font-family: 'Orbitron', sans-serif; font-size: 1.8em; color: #6cc6ff; text-align: center; }
        .nstv-badge { background: #e11; color: #fff; font: 700 .85em 'Orbitron', sans-serif; padding: 5px 12px; border-radius: 14px; letter-spacing: 1px; }
        .nstv-badge[hidden], .nstv [hidden] { display: none !important; }
        .nstv-note { text-align: center; opacity: .75; font-size: .9em; margin: 8px 0 16px; }
        .nstv-tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
        .nstv-tab { padding: 10px 18px; border-radius: 24px; border: 2px solid var(--neon-purple, #bf00ff); background: rgba(191,0,255,.08); color: #fff; font: 700 .85em 'Orbitron', sans-serif; cursor: pointer; transition: background .2s, box-shadow .2s; }
        .nstv-tab:hover { background: rgba(191,0,255,.3); }
        .nstv-tab[aria-selected="true"] { background: var(--neon-purple, #bf00ff); box-shadow: 0 0 18px var(--neon-purple, #bf00ff); }
        .nstv-stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
        .nstv-stage iframe, .nstv-stage > div#nstv-player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .nstv-shield { position: absolute; inset: 0; z-index: 3; background: transparent; cursor: default; display: flex; align-items: center; justify-content: center; }
        .nstv-shield.tune { background: rgba(0,0,0,.55); cursor: pointer; }
        .nstv-tune { display: none; padding: 14px 28px; border-radius: 30px; border: 2px solid #fff; background: #e11; color: #fff; font: 700 1.1em 'Orbitron', sans-serif; cursor: pointer; }
        .nstv-shield.tune .nstv-tune { display: block; }
        .nstv-fs { position: absolute; right: 10px; bottom: 10px; z-index: 4; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.6); color: #fff; cursor: pointer; font-size: .85em; }
        .nstv-fallback { position: absolute; inset: 0; z-index: 5; background: #0a0a18; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; }
        .nstv-fallback a, .nstv-open { color: #6cc6ff; font-weight: 700; }
        .nstv-now { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; margin: 14px 0 4px; padding: 10px 14px; border-radius: 10px; background: rgba(108,198,255,.08); font-size: .95em; }
        .nstv-now b { color: #6cc6ff; font-family: 'Orbitron', sans-serif; }
        .nstv-btn { padding: 8px 16px; border-radius: 20px; border: 2px solid var(--neon-green, #39ff14); background: transparent; color: var(--neon-green, #39ff14); font: 700 .8em 'Orbitron', sans-serif; cursor: pointer; }
        .nstv-btn:hover { background: rgba(57,255,20,.15); }
        .nstv-guide h3 { font-family: 'Orbitron', sans-serif; font-size: 1em; color: var(--neon-purple, #bf00ff); margin: 18px 0 8px; letter-spacing: 1px; }
        .nstv-sched { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
        .nstv-sched li { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: baseline; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,.04); }
        .nstv-sched li.now { background: rgba(225,17,17,.18); border-left: 4px solid #e11; }
        .nstv-sched li.next { border-left: 4px solid #6cc6ff; }
        .nstv-sched .t { font-size: .85em; opacity: .8; }
        .nstv-tag { font: 700 .7em 'Orbitron', sans-serif; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,.12); }
        .nstv-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .nstv-item { text-align: left; padding: 12px; border-radius: 10px; border: 2px solid rgba(108,198,255,.3); background: rgba(255,255,255,.04); color: #fff; cursor: pointer; }
        .nstv-item:hover { border-color: #6cc6ff; }
        .nstv-item.active { border-color: var(--neon-green, #39ff14); background: rgba(57,255,20,.1); }
        .nstv-item strong { display: block; margin-bottom: 4px; }
        .nstv-item small { opacity: .75; }
        .nstv-empty, .nstv-msg { text-align: center; opacity: .8; padding: 10px; }
        .nstv-msg.err { color: #ff8080; opacity: 1; }
        @media (max-width: 640px) { .nstv { padding: 14px; } .nstv-head h2 { font-size: 1.3em; } .nstv-sched li { grid-template-columns: 1fr; gap: 2px; } }

.nstv{border-color:rgba(108,198,255,.6)!important;box-shadow:0 0 40px rgba(108,198,255,.22)!important;background:rgba(5,13,31,.82)!important}
@media(max-width:700px){.hero{padding-top:26px}}
</style>
</head>

/* ===== NORTHSTAR TV: ONE reusable YouTube player. Channel switches call loadVideoById on the same player:
           no iframe is ever re-created, so there is no flicker and no stacked/duplicate players. ===== */
        (function () {
            'use strict';
            var $ = function (id) { return document.getElementById(id); };
            var B = null, player = null, apiState = 'idle', apiWaiters = [];

            function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
            function ytId(x) { if (!x) return null; var s = String(x).trim(); if (/^[\w-]{11}$/.test(s)) return s; var m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }
            function fmt(iso) { return new Date(iso).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }); }
            function fmtT(iso) { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
            function msg(t, err) { var el = $('nstv-msg'); el.textContent = t || ''; el.className = 'nstv-msg' + (err ? ' err' : ''); el.hidden = !t; }
            function chById(id) { return S.channels.filter(function (c) { return c.id === id; })[0]; }
            function chItems(id) { return S.items.filter(function (i) { return i.channel_id === id; }).sort(function (a, b) { return a.position - b.position; }); }
            function chProgs(id) { return S.programs.filter(function (p) { return p.channel_id === id; }).sort(function (a, b) { return new Date(a.starts_at) - new Date(b.starts_at); }); }
            function nowNext(id, t) {
                var cur = null, next = null, ps = chProgs(id);
                for (var i = 0; i < ps.length; i++) {
                    var s = +new Date(ps[i].starts_at), e = +new Date(ps[i].ends_at);
                    if (s <= t && t < e) cur = ps[i]; else if (s > t && !next) next = ps[i];
                }
                return { cur: cur, next: next };
            }

            /* ---- YouTube IFrame API (loaded once) ---- */
            function loadApi(cb) {
                if (window.YT && window.YT.Player) return cb(true);
                if (apiState === 'failed') return cb(false);
                apiWaiters.push(cb);
                if (apiState === 'loading') return;

                var flush = function (ok) { apiState = ok ? 'ready' : 'failed'; var w = apiWaiters; apiWaiters = []; w.forEach(function (f) { f(ok); }); };

            function ensurePlayer(cb) {

                loadApi(function (ok) {
                    if (!ok) return cb(null);
                    if (player) return cb(player);
                    var vars = { rel: 0, playsinline: 1, modestbranding: 1 };

                });

            /* ---- player events ---- */
            function onState(e) {

                    if (!p) return showFallback('The YouTube player could not load. Check your connection or any content blocker.', '<a href="https://www.youtube.com/watch?v=' + esc(vid) + '" target="_blank" rel="noopener">Open on YouTube ↗</a>');
                    hideFallback(); S.vid = vid;
                    var o = { videoId: vid }; if (startSec > 0) o.startSeconds = startSec;

                });
            }
            function evaluate() {
                clearTimeout(S.liveTimer);
                var id = S.chId; if (!id) return;
                var t = Date.now(), nn = nowNext(id, t);
                if (nn.cur && !S.userVod) {
                    S.mode = 'live';
                    if (S.progId !== nn.cur.id || S.vidMode !== 'live') {
                        S.progId = nn.cur.id; S.vidMode = 'live'; msg('');
                        var v = ytId(nn.cur.media_url);
                        if (v) startVideo(v, Math.max(0, Math.floor((t - new Date(nn.cur.starts_at)) / 1000)), true);
                        else showFallback('"' + nn.cur.title + '" is not a YouTube source and cannot be embedded.', nn.cur.media_url ? '<a href="' + esc(nn.cur.media_url) + '" target="_blank" rel="noopener">Open in a new tab ↗</a>' : '');
                    }
                    S.liveTimer = setTimeout(evaluate, Math.max(1000, new Date(nn.cur.ends_at) - t) + 300);
                } else {
                    var wasLive = S.mode === 'live';
                    S.mode = 'vod'; S.progId = null;
                    if (wasLive || S.vidMode === null) { var ap = wasLive || S.wantPlay; S.wantPlay = false; var its = chItems(id); if (its.length) selectItem(its[0].id, ap, false); else noContent(); }
                }
                renderNow(); renderGuide(); chrome();
            }
            function noContent() { S.vid = null; S.vidMode = null; try { if (player) player.stopVideo(); } catch (e) {} showFallback('No programming on this channel yet.', ''); }
            function selectItem(itemId, autoplay, fromUser) {
                var it = S.items.filter(function (i) { return i.id === itemId; })[0]; if (!it) return;
                if (fromUser && S.mode === 'live') { S.userVod = true; clearTimeout(S.liveTimer); }

                renderNow(); renderGuide(); chrome();
            }
            function playNext() {
                var its = chItems(S.chId); if (!its.length) return;
                var i = 0; its.forEach(function (x, n) { if (x.id === S.itemId) i = n; });
                selectItem(its[(i + 1) % its.length].id, true, false);
            }
            function selectChannel(id, byUser) {
                if (!chById(id) || id === S.chId) return;                                                              /* same channel: do nothing, never reload */
                S.chId = id; S.userVod = false; S.itemId = null; S.vidMode = null; S.progId = null; S.mode = 'vod'; S.wantPlay = !!byUser;

            /* ---- rendering ---- */
            function renderTabs() {
                $('nstv-tabs').innerHTML = S.channels.map(function (c) {
                    return '<button type="button" role="tab" class="nstv-tab" data-ch="' + esc(c.id) + '" aria-selected="' + (c.id === S.chId) + '">' + esc(c.number) + ' · ' + esc(c.name) + '</button>';
                }).join('');

            function renderNow() {
                var id = S.chId, el = $('nstv-now'); if (!id) { el.innerHTML = ''; return; }

                else { var it = S.items.filter(function (i) { return i.id === S.itemId; })[0]; h = '<span><b>ON DEMAND:</b> ' + (it ? esc(it.title) + (it.year ? ' (' + esc(it.year) + ')' : '') : 'choose a video below') + '</span>'; }
                if (nn.next) h += '<span><b>NEXT:</b> ' + esc(nn.next.title) + ' at ' + fmt(nn.next.starts_at) + '</span>';
                if (S.userVod && nn.cur) h += '<button type="button" class="nstv-btn" id="nstv-golive">⟲ BACK TO LIVE</button>';
                el.innerHTML = h;
            }
            function renderGuide() {
                var id = S.chId, el = $('nstv-guide'); if (!id) { el.innerHTML = ''; return; }
                var t = Date.now(), nn = nowNext(id, t), h = '';
                var ps = chProgs(id).filter(function (p) { return new Date(p.ends_at) > t; }).slice(0, 12);
                if (ps.length) h += '<h3>SCHEDULE</h3><ul class="nstv-sched">' + ps.map(function (p) {
                    var cls = nn.cur && nn.cur.id === p.id ? 'now' : (nn.next && nn.next.id === p.id ? 'next' : '');
                    return '<li class="' + cls + '"><span class="t">' + fmt(p.starts_at) + ' – ' + fmtT(p.ends_at) + '</span><span>' + esc(p.title) + (p.description ? '<br><small>' + esc(p.description) + '</small>' : '') + '</span>' + (cls ? '<span class="nstv-tag">' + (cls === 'now' ? 'NOW' : 'NEXT') + '</span>' : '<span></span>') + '</li>';
                }).join('') + '</ul>';
                var its = chItems(id);
                h += '<h3>ON-DEMAND LIBRARY</h3>' + (its.length ? '<div class="nstv-lib">' + its.map(function (i) {
                    return '<button type="button" class="nstv-item' + (S.mode === 'vod' && i.id === S.itemId ? ' active' : '') + '" data-item="' + esc(i.id) + '"><strong>' + esc(i.title) + '</strong><small>' + esc(i.year || '') + (i.description ? ' · ' + esc(i.description) : '') + '</small></button>';
                }).join('') + '</div>' : '<p class="nstv-empty">No videos on this channel yet.</p>');
                el.innerHTML = h;
            }

            /* ---- data ---- */
            function load() {
                return Promise.all([B.tvChannels(), B.tvAllItems(), B.tvPrograms()]).then(function (r) {
                    for (var i = 0; i < r.length; i++) if (r[i].error) throw r[i].error;
                    S.channels = (r[0].data || []).filter(function (c) { return c.kind === 'northstar'; }); S.items = r[1].data || []; S.programs = r[2].data || [];
                });
            }
            function refresh() {
                load().then(function () {
                    if (!chById(S.chId)) { S.chId = null; if (S.channels.length) { S.chId = S.channels[0].id; S.vidMode = null; } }
                    renderTabs(); if (S.chId) evaluate(); else { renderNow(); renderGuide(); }
                }).catch(function () {});
            }
            function start() {
                load().then(function () {
                    if (!S.channels.length) { msg('NorthStar TV channels will appear here as soon as they are added.'); return; }
                    S.chId = S.channels[0].id; renderTabs(); evaluate();
                    var t; try { B.tvSubscribe(function () { clearTimeout(t); t = setTimeout(refresh, 400); }); } catch (e) {}
                    setInterval(function () { if (!S.hold) { var nn = S.chId ? nowNext(S.chId, Date.now()) : {}; if (S.mode === 'live' && (!nn.cur || nn.cur.id !== S.progId)) evaluate(); else { renderNow(); renderGuide(); } } }, 15000);
                }).catch(function () { msg('NorthStar TV could not load the channel list from the server. Please try again later.', true); });
            }

            /* ---- wiring ---- */
            $('nstv-tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-ch]'); if (b) selectChannel(b.getAttribute('data-ch'), true); });
            $('nstv-guide').addEventListener('click', function (e) { var b = e.target.closest('[data-item]'); if (b) selectItem(b.getAttribute('data-item'), true, true); });
            $('nstv-now').addEventListener('click', function (e) { if (e.target.id === 'nstv-golive') { S.userVod = false; S.vidMode = null; evaluate(); } });
            $('nstv-tune').addEventListener('click', function () { try { player.unMute(); player.playVideo(); } catch (e) {} setTimeout(chrome, 500); });
            $('nstv-fs').addEventListener('click', function () { var s = $('nstv-stage'); (s.requestFullscreen || s.webkitRequestFullscreen || function () {}).call(s); });
            /* never let two videos play at once: pause NorthStar TV while the on-demand modal below is open */
            var _open = window.openMovie, _close = window.closeVideo;
            if (typeof _open === 'function') window.openMovie = function () { S.hold = true; try { if (player) player.pauseVideo(); } catch (e) {} return _open.apply(this, arguments); };
            if (typeof _close === 'function') window.closeVideo = function () { var r = _close.apply(this, arguments); if (S.hold) { S.hold = false; if (S.mode === 'live') { S.vidMode = null; evaluate(); } } return r; };

            var tries = 0;
            (function wait() {
                try { B = parent.DKBackend; } catch (e) { B = null; }
                if (B && B.status === 'unconfigured') { msg('NorthStar TV needs the site backend, which is not configured.', true); return; }
                if (B && B.client) return start();
                if (tries++ < 75) setTimeout(wait, 200); else msg('NorthStar TV could not reach the backend. Please refresh.', true);
            })();
        })();
