    <script>
        const ADMIN_EMAILS = [
            'tannerkurrasch@gmail.com',
            'kurraschgaminmerchstore@gmail.com',
            'gamekillerszone@gmail.com'
        ];
        
        let currentUser = null;
        
        function loadUserData() {
            const userData = localStorage.getItem('arcadeUser');
            
            if (!userData) {
                alert('Please login first!');
                window.__go('index.html');
                return;
            }
            
            currentUser = JSON.parse(userData);
            
            // Update form fields
            document.getElementById('username').value = currentUser.username || 'Unknown';
            document.getElementById('email').value = currentUser.email || 'No email';
            
            // Calculate level from XP
            const xp = currentUser.xp || 0;
            const level = Math.floor(Math.sqrt(xp / 100)) + 1;
            
            // Update stats
            document.getElementById('statLevel').textContent = level;
            document.getElementById('statXp').textContent = xp.toLocaleString();
            document.getElementById('statCoins').textContent = (currentUser.coins || 0).toLocaleString();
            document.getElementById('statGames').textContent = (currentUser.gamesPlayed || 0).toLocaleString();
            
            // Show admin link if user is admin
            if (ADMIN_EMAILS.includes(currentUser.email)) {
                document.getElementById('adminLink').style.display = 'block';
            }
        }
        
        function savePassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!password) {
                showNotification('Please enter a new password', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showNotification('Passwords do not match!', 'error');
                return;
            }
            
            if (password.length < 6) {
                showNotification('Password must be at least 6 characters', 'error');
                return;
            }
            
            // Update password in localStorage
            currentUser.password = password;
            localStorage.setItem('arcadeUser', JSON.stringify(currentUser));
            
            showNotification('Password changed successfully!', 'success');
            document.getElementById('password').value = '';
            document.getElementById('confirmPassword').value = '';
        }
        
        function showDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
        }
        
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
        }
        
        function deleteAccount() {
            if (!currentUser) return;
            
            // Remove all user data from localStorage
            localStorage.removeItem('arcadeUser');
            localStorage.removeItem('user_' + currentUser.username);
            
            // Clear all user-specific data
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes(currentUser.username) || key.includes(currentUser.email)) {
                    keysToRemove.push(key);
                }
            }
            keysToRemove.forEach(key => localStorage.removeItem(key));
            
            showNotification('Account deleted successfully', 'success');
            
            // Redirect to home after 1 second
            setTimeout(() => {
                window.__go('index.html');
            }, 1000);
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDeleteModal();
        });
        
        // Load user data on page load
        loadUserData();
    <\/script>

</head>
<body>

            <button class="admin-tab" onclick="showSection('applications')">📋 BADGE APPLICATIONS <span id="appCount" class="notification-badge" style="display:none;"></span></button>
            <button class="admin-tab" onclick="showSection('botSubs')">🤖 BOT SUBSCRIPTIONS <span id="botSubCount" class="notification-badge" style="display:none;"></span></button>

                <div class="alert alert-success" id="botSubAlert"></div>
                <div id="botSubList"></div>
            </div>
        </div>
        
        <\!-- MODERATION -->
        <div class="admin-section" id="moderation">
            <div class="admin-panel">
                <h2 class="panel-header">⚖️ Moderation Tools</h2>
                
                <div class="form-group">
                    <label class="form-label">Select User</label>
                    <input type="text" class="form-input" id="modUsername" placeholder="Enter username">
                </div>
                
                <h3 style="font-family: 'Orbitron', sans-serif; color: var(--neon-orange); margin: 30px 0 20px;">🖼️ Moderate User Images</h3>
                <button class="btn btn-warning" onclick="moderateImages()">🖼️ VIEW USER IMAGES</button>
                <div id="imagePreview" style="margin-top: 20px;"></div>
                
                <h3 style="font-family: 'Orbitron', sans-serif; color: var(--neon-purple); margin: 30px 0 20px;">👮 Staff Management</h3>
                <button class="btn btn-primary" onclick="giveStaffRole()">⭐ GIVE STAFF ROLE</button>
                <button class="btn btn-warning" onclick="removeStaffRole()">❌ REMOVE STAFF ROLE</button>

                <h3 style="font-family: 'Orbitron', sans-serif; color: var(--neon-orange); margin: 30px 0 20px;">📊 Reset User Progress</h3>
                <button class="btn btn-warning" onclick="resetLevel()">🔄 RESET LEVEL</button>
                <button class="btn btn-warning" onclick="resetAchievements()">🏆 RESET ACHIEVEMENTS</button>
                <button class="btn btn-warning" onclick="resetCoins()">🪙 RESET COINS</button>
                <button class="btn btn-danger" onclick="resetAllData()">⚠️ RESET ALL DATA</button>
                
                <h3 style="font-family: 'Orbitron', sans-serif; color: var(--neon-red); margin: 30px 0 20px;">🚫 Restrictions & Bans</h3>
                
                <div class="form-group">
                    <label class="form-label">Restriction Duration</label>

                        <option value="5">5 Days</option>
                        <option value="10">10 Days</option>
                        <option value="20">20 Days</option>
                        <option value="30">30 Days</option>

                        <option value="80">80 Days</option>
                    </select>
                </div>
                
                <button class="btn btn-warning" onclick="restrictUserTime()">⏱️ APPLY RESTRICTION</button>
                <button class="btn btn-danger" onclick="banFromMovies()">🎬 BAN FROM MOVIES</button>
                <button class="btn btn-danger" onclick="banFromSite()">🚫 BAN FROM SITE</button>
                <button class="btn btn-success" onclick="unbanUser()">✅ UNBAN USER</button>
                
                <div class="alert alert-success" id="modAlert" style="margin-top: 30px;"></div>

        <\!-- GIVE REWARDS -->
        <div class="admin-section" id="rewards">
            <div class="admin-panel">
                <h2 class="panel-header">🎁 Give Rewards</h2>

                <button class="btn btn-success" onclick="giveCoins()">💰 GIVE COINS</button>

                </div>
                <button class="btn btn-success" onclick="giveXP()">⚡ GIVE XP</button>

                        <option value="verified_discord">✅ Verified Discord</option>
                        <option value="org_badge">🏢 Organization</option>
                        <option value="roblox_badge">🎮 Roblox Developer</option>
                        <option value="premium_badge">💎 Premium</option>
                        <option value="community_badge">🌟 Community</option>
                    </select>
                </div>
                <button class="btn btn-success" onclick="giveBadge()">🏅 GIVE BADGE</button>

        <\!-- CONTENT MANAGEMENT -->
        <div class="admin-section" id="content">
            <div class="admin-panel">
                <h2 class="panel-header">📄 Content Management</h2>
                <p style="margin-bottom: 30px; opacity: 0.8;">⚠️ Note: Content saved here will be stored in localStorage. To update the actual HTML pages, you'll need to manually copy and update the HTML files.</p>
                
                <h3 style="font-family: 'Orbitron', sans-serif; color: var(--neon-blue); margin-bottom: 20px;">📜 Terms of Service</h3>
                <div class="form-group">
                    <textarea class="form-textarea" id="termsContent" placeholder="Enter Terms of Service content..."></textarea>
                    <button class="btn btn-primary" onclick="saveTerms()" style="margin-top: 15px;">💾 SAVE TERMS</button>
                </div>
                
                <h3 style="font-family: 'Orbitron', sans-serif; color: var(--neon-blue); margin: 40px 0 20px;">🔒 Privacy Policy</h3>
                <div class="form-group">
                    <textarea class="form-textarea" id="privacyContent" placeholder="Enter Privacy Policy content..."></textarea>
                    <button class="btn btn-primary" onclick="savePrivacy()" style="margin-top: 15px;">💾 SAVE POLICY</button>
                </div>
                
                <div class="alert alert-success" id="contentAlert"></div>
            </div>
        </div>
    </div>
    
    <script>
        const ADMIN_EMAILS = [
            'tannerkurrasch@gmail.com',
            'kurraschgaminmerchstore@gmail.com',
            'gamekillerszone@gmail.com'
        ];
        
        function checkAdminAccess() {
            const userData = localStorage.getItem('arcadeUser');
            if (!userData) {
                alert('Access Denied: Please login first');
                window.__go('index.html');
                return false;
            }
            
            const user = JSON.parse(userData);
            if (!ADMIN_EMAILS.includes(user.email)) {
                alert('Access Denied: Admin privileges required');
                window.__go('index.html');
                return false;
            }
            
            document.getElementById('adminEmail').textContent = user.email;
            loadUsers();
            loadApplications();
            loadBotSubscriptions();
            loadContent();
            updateNotificationBadges();
            return true;
        }

        function updateNotificationBadges() {
            const applications = JSON.parse(localStorage.getItem('badgeApplications') || '[]');
            const botSubs = JSON.parse(localStorage.getItem('botSubscriptions') || '[]');
            
            const appCount = document.getElementById('appCount');
            const botSubCount = document.getElementById('botSubCount');
            
            if (applications.length > 0) {
                appCount.textContent = applications.length;
                appCount.style.display = 'inline-block';
            } else {
                appCount.style.display = 'none';
            }
            
            if (botSubs.length > 0) {
                botSubCount.textContent = botSubs.length;
                botSubCount.style.display = 'inline-block';
            } else {
                botSubCount.style.display = 'none';
            }
        }
        
        function getAllUsers() {
            const users = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('user_')) {
                    try {
                        const user = JSON.parse(localStorage.getItem(key));
                        users.push(user);
                    } catch (e) {}
                }
            }
            return users;
        }
        
        function loadUsers() {
            const users = getAllUsers();
            const tbody = document.getElementById('userTableBody');
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px; opacity: 0.6;">No users found</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            users.forEach(user => {
                const level = Math.floor(Math.sqrt((user.xp || 0) / 100)) + 1;
                let statusClass = user.banned ? 'status-banned' : (user.restricted ? 'status-restricted' : 'status-active');
                let statusText = user.banned ? 'BANNED' : (user.restricted ? 'RESTRICTED' : 'ACTIVE');
                
                if (user.isStaff) {
                    statusClass = 'status-staff';
                    statusText = 'STAFF';
                }
                
                const row = `
                    <tr>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>${level}</td>
                        <td>${(user.coins || 0).toLocaleString()}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn btn-warning" style="padding: 8px 20px; font-size: 0.8em;" onclick="viewUserDetails('${user.username}')">👁️ VIEW</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        
        function searchUsers() {
            const searchTerm = document.getElementById('userSearch').value.toLowerCase();
            if (!searchTerm) {
                loadUsers();
                return;
            }
            
            const users = getAllUsers().filter(u => 
                u.username.toLowerCase().includes(searchTerm) || 
                u.email.toLowerCase().includes(searchTerm)
            );
            
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
            
            users.forEach(user => {
                const level = Math.floor(Math.sqrt((user.xp || 0) / 100)) + 1;
                let statusClass = user.banned ? 'status-banned' : (user.restricted ? 'status-restricted' : 'status-active');
                let statusText = user.banned ? 'BANNED' : (user.restricted ? 'RESTRICTED' : 'ACTIVE');
                
                if (user.isStaff) {
                    statusClass = 'status-staff';
                    statusText = 'STAFF';
                }
                
                tbody.innerHTML += `
                    <tr>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>${level}</td>
                        <td>${(user.coins || 0).toLocaleString()}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn btn-warning" style="padding: 8px 20px; font-size: 0.8em;" onclick="viewUserDetails('${user.username}')">👁️ VIEW</button>
                        </td>
                    </tr>
                `;
            });
            
            showAlert('userAlert', `Found ${users.length} user(s)`);
        }
        
        function viewUserDetails(username) {
            const user = JSON.parse(localStorage.getItem('user_' + username));
            if (!user) {
                alert('User not found');
                return;
            }
            
            const level = Math.floor(Math.sqrt((user.xp || 0) / 100)) + 1;
            const badges = user.badges ? user.badges.join(', ') : 'None';
            const staffStatus = user.isStaff ? 'YES' : 'NO';
            
            alert(`User Details:\n\nUsername: ${user.username}\nEmail: ${user.email}\nStaff: ${staffStatus}\nLevel: ${level}\nXP: ${user.xp || 0}\nCoins: ${user.coins || 0}\nGames Played: ${user.gamesPlayed || 0}\nMovies Watched: ${user.moviesWatched || 0}\nBadges: ${badges}\n\nJoined: ${user.joinDate || 'Unknown'}`);
        }

        function loadBotSubscriptions() {
            const botSubs = JSON.parse(localStorage.getItem('botSubscriptions') || '[]');
            const container = document.getElementById('botSubList');
            
            if (botSubs.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.6; padding: 40px;">No bot subscription requests</p>';
                return;
            }
            
            container.innerHTML = '';
            botSubs.forEach((sub, index) => {
                const card = `
                    <div class="application-card">
                        <div class="application-header">
                            <div>
                                <div class="badge-preview">🤖</div>
                                <h3>${sub.username}</h3>
                                <p style="opacity: 0.7;">${sub.email}</p>
                            </div>
                            <div style="text-align: right;">
                                <p><strong>Bot:</strong> ${sub.botName}</p>
                                <p><strong>Duration:</strong> ${sub.months} month(s)</p>
                                <p><strong>Purchased:</strong> ${new Date(sub.timestamp).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div style="margin: 20px 0; background: rgba(0, 243, 255, 0.1); padding: 15px; border-radius: 10px;">
                            <p><strong>💰 Cost:</strong> ${sub.cost.toLocaleString()} coins</p>
                            <p style="margin-top: 10px;"><strong>📝 Instructions:</strong> Activate this subscription manually via Discord bot panel</p>
                        </div>
                        <div>
                            <button class="btn btn-success" onclick="markBotSubComplete(${index})">✅ ACTIVATED</button>
                            <button class="btn btn-danger" onclick="denyBotSub(${index})">❌ CANCEL</button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function markBotSubComplete(index) {
            const botSubs = JSON.parse(localStorage.getItem('botSubscriptions') || '[]');
            const sub = botSubs[index];
            
            if (confirm(`Mark ${sub.botName} subscription for ${sub.username} as activated?`)) {
                botSubs.splice(index, 1);
                localStorage.setItem('botSubscriptions', JSON.stringify(botSubs));
                showAlert('botSubAlert', `✅ ${sub.botName} activated for ${sub.username}!`);
                loadBotSubscriptions();
                updateNotificationBadges();
            }
        }

        function denyBotSub(index) {
            const botSubs = JSON.parse(localStorage.getItem('botSubscriptions') || '[]');
            const sub = botSubs[index];
            
            if (confirm(`Cancel ${sub.botName} subscription for ${sub.username}?\n\nThis will refund their coins.`)) {
                // Refund coins to user
                const user = JSON.parse(localStorage.getItem('user_' + sub.username));
                if (user) {
                    user.coins = (user.coins || 0) + sub.cost;
                    localStorage.setItem('user_' + sub.username, JSON.stringify(user));
                    
                    const currentUser = JSON.parse(localStorage.getItem('arcadeUser'));
                    if (currentUser && currentUser.username === sub.username) {
                        currentUser.coins = user.coins;
                        localStorage.setItem('arcadeUser', JSON.stringify(currentUser));
                    }
                }
                
                botSubs.splice(index, 1);
                localStorage.setItem('botSubscriptions', JSON.stringify(botSubs));

<script>
(function(){

      onReady:function(){playerReady=true;if(pendingLoad)pendingLoad();},
      onStateChange:function(e){if(e.data===0)advance();},
      onError:function(){msg('That video could not be played; skipping.');setTimeout(advance,1500);}
    }});
  };
  function play(){ // reuses the ONE player; never recreates it
    var list=items[cur]||[]; if(!list.length){$('now').innerHTML='This channel has no programming yet.';return}
    curIdx=((curIdx%list.length)+list.length)%list.length; var it=list[curIdx];
    var go=function(){player.loadVideoById(it.youtube_id)};
    if(playerReady)go();else pendingLoad=go;
    var nx=list[(curIdx+1)%list.length];
    $('now').innerHTML='Now playing: '+esc(it.title)+'<small>'+esc(it.description||'')+'</small><small>Next: '+esc(nx.title)+'</small>';

  }
  function advance(){ // transition point: refetch so admin changes apply between videos
    if(!cur)return; var oldId=(items[cur]||[])[curIdx]; oldId=oldId&&oldId.id;

<script>
/* ============================================================
   Diane's Arcade — single-file shell
   Every page of the old multi-file site lives above as its own
   text block. This router loads the right one into the frame.
   Routes:  #/home  #/game?game=motherload  #/profile  etc.
   ============================================================ */
(function () {
  var FILE_ROUTES = {"index.html": "home", "game.html": "game", "achievements.html": "achievements", "leaderboard.html": "leaderboard", "memories.html": "memories", "shop.html": "shop", "movies.html": "movies", "profile.html": "profile", "login.html": "login", "settings.html": "settings", "admin.html": "admin", "bot.html": "bot", "termsofservice.html": "terms", "terms.html": "terms", "privacypolicy.html": "privacy", "privacy.html": "privacy", "tv.html": "tv"};
  var stage = document.getElementById('stage');
  var boot = document.getElementById('boot');
  var current = { route: null, search: '' };

  function pageSource(route) {
    var el = document.getElementById('page-' + route);
    if (!el) return null;
    return el.textContent.replace(/<\\\/script/g, '</script').replace(/<\\!--/g, '<!--');
  }

  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var q = h.indexOf('?');
    var route = (q >= 0 ? h.slice(0, q) : h).toLowerCase() || 'home';
    var search = q >= 0 ? h.slice(q) : '';
    if (route === 'index' || route === 'games') route = 'home';
    return { route: route, search: search };
  }

  function render() {
    var p = parseHash();
    var html = pageSource(p.route);
    if (!html) { p = { route: 'home', search: '' }; html = pageSource('home'); }
    current = p; try { window.__dianeRoute && window.__dianeRoute(p.route); } catch (e) {}
    boot.classList.remove('hide');
    html = html.replace('window.__SEARCH = ""', 'window.__SEARCH = ' + JSON.stringify(p.search));
    stage.onload = function () {
      boot.classList.add('hide');
      try {
        var d = stage.contentDocument;
        if (d && d.title) document.title = d.title;
        if (p.route === 'home' && location.hash === '#/home-games') d.getElementById('games') && d.getElementById('games').scrollIntoView();
      } catch (e) {}
    };
    stage.srcdoc = window.__dianeInject ? window.__dianeInject(p.route, html) : html;
  }

  // Convert an old-style link ("profile.html", "game.html?game=x", "#games") into a route
  window.__arcadeGo = function (href) {
    href = String(href || '');
    if (href === '#games') { var d = stage.contentDocument; var g = d && d.getElementById('games'); if (g) g.scrollIntoView({behavior:'smooth'}); return; }
    var m = href.match(/^\.?\/?([^?#]+?)(\.html?)?(\?.*)?(#.*)?$/i);
    if (!m) return;
    var key = (m[1] + (m[2] || '')).toLowerCase();
    var route = FILE_ROUTES[key] || FILE_ROUTES[(m[1] + '.html').toLowerCase()] || m[1].toLowerCase();
    var target = '#/' + route + (m[3] || '');
    if (location.hash === target) { render(); } else { location.hash = target; }
  };
  window.__arcadeReload = render;

  window.addEventListener('hashchange', render);
  render();
})();
</script>
