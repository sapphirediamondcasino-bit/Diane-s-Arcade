    <script>
        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
            
            hideMessages();
        }
        
        // ---- Real Supabase auth (parent.DKBackend). No fake accounts, no localStorage login. ----
        function BK() { try { return parent.DKBackend; } catch (e) { return null; } }
        function whenReady(cb) {
            var B = BK();
            if (!B) return showError('Backend unavailable. Reload the page.');
            if (B.client) return cb(B);
            showSuccess('Connecting…');
            var t = setInterval(function () {
                if (B.client) { clearInterval(t); hideMessages(); cb(B); }
                else if (B.status === 'offline' || B.status === 'unconfigured') { clearInterval(t); showError('Cannot reach the server right now. Try again shortly.'); }
            }, 300);
        }
        function handleLogin(e) {
            e.preventDefault();
            var email = document.getElementById('login-username').value.trim();
            var password = document.getElementById('login-password').value;
            if (!email || !password) return showError('Please fill in all fields!');
            if (email.indexOf('@') < 0) return showError('Sign in with your email address. Usernames are for display only.');
            whenReady(function (B) {
                B.login(email, password).then(function () {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(function () { window.__go('profile.html'); }, 800);
                }).catch(function (err) { showError(err.message || 'Login failed.'); });
            });
        }
        function handleSignup(e) {
            e.preventDefault();
            var username = document.getElementById('signup-username').value.trim();
            var email = document.getElementById('signup-email').value.trim();
            var password = document.getElementById('signup-password').value;
            var confirm = document.getElementById('signup-confirm').value;
            if (password !== confirm) return showError('Passwords do not match!');
            if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) return showError('Username must be 3–20 letters, numbers or _.');
            if (password.length < 8) return showError('Password must be at least 8 characters.');
            whenReady(function (B) {
                B.register(username, email, password).then(function (r) {
                    if (r.needsConfirm) showSuccess('Account created. Check your email to confirm it, then log in.');
                    else { showSuccess('Account created! Redirecting to your profile...'); setTimeout(function () { window.__go('profile.html'); }, 800); }
                }).catch(function (err) { showError(err.message || 'Sign-up failed.'); });
            });
        }
        function handleForgot(ev) {
            ev.preventDefault();
            var email = document.getElementById('login-username').value.trim();
            if (email.indexOf('@') < 0) return showError('Type your email address in the login box first, then click "Forgot password".');
            whenReady(function (B) {
                B.resetPassword(email).then(function (r) {
                    if (r && r.error) showError(r.error.message); else showSuccess('If that email has an account, a reset link is on its way.');
                }).catch(function (err) { showError(err.message || 'Could not send reset email.'); });
            });
        }
        function socialLogin(provider) {
            showError(provider + ' sign-in is not enabled yet. Use email and password.');
        }

        // Show Error
        function showError(message) {
            const errorEl = document.getElementById('error-msg');
            errorEl.textContent = '⚠️ ' + message;
            errorEl.style.display = 'block';
            document.getElementById('success-msg').style.display = 'none';
        }
        
        // Show Success
        function showSuccess(message) {
            const successEl = document.getElementById('success-msg');
            successEl.textContent = '✅ ' + message;
            successEl.style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
        }
        
        // Hide Messages
        function hideMessages() {
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('success-msg').style.display = 'none';
        }
        
        // Already signed in? (real Supabase session)
        (function () {
            var B = BK(); if (!B) return;
            var t = setInterval(function () {
                if (B.client && B.status === 'online') { clearInterval(t); if (B.user) { showSuccess('Already logged in! Redirecting...'); setTimeout(function () { window.__go('profile.html'); }, 600); } }
            }, 400);
            setTimeout(function () { clearInterval(t); }, 10000);
        })();
    <\/script>

        <div class="modal-content">
            <h2 class="modal-title">⚠️ DELETE ACCOUNT?</h2>
            <p class="modal-text">
                Are you sure you want to delete your account on<br>
                <strong>Diane Keaton's Memorial Arcade?</strong>
            </p>
            <p class="modal-text" style="color: var(--neon-red);">
                This action is <strong>PERMANENT</strong> and cannot be undone!<br>
                You will lose all your:
            </p>
            <ul style="text-align: left; margin: 20px auto; max-width: 400px; font-size: 1.1em;">
                <li>✗ Achievements</li>
                <li>✗ XP and Level Progress</li>
                <li>✗ Coins</li>
                <li>✗ Friends List</li>
                <li>✗ Game Scores</li>
                <li>✗ Profile Data</li>
            </ul>
            
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="closeDeleteModal()">↩️ CANCEL</button>
                <button class="btn btn-danger" onclick="deleteAccount()">🗑️ YES, DELETE MY ACCOUNT</button>
            </div>
        </div>
    </div>
    
    <script>
        const ADMIN_EMAILS = [
            'tannerkurrasch@gmail.com',
            'kurraschgamingmerchstore@gmail.com',
            'gamekillerszone@gmail.com'
        ];
        
        let currentUser = null;
        
        function loadUserData() {
            const userData = localStorage.getItem('arcadeUser');
            
            if (!userData) {
                alert('Please login first!');
                window.__go('index.html');
                return;
            }
            
            currentUser = JSON.parse(userData);
            
            // Update form fields
            document.getElementById('username').value = currentUser.username || 'Unknown';
            document.getElementById('email').value = currentUser.email || 'No email';
            
            // Calculate level from XP
            const xp = currentUser.xp || 0;
            const level = Math.floor(Math.sqrt(xp / 100)) + 1;
            
            // Update stats
            document.getElementById('statLevel').textContent = level;
            document.getElementById('statXp').textContent = xp.toLocaleString();
            document.getElementById('statCoins').textContent = (currentUser.coins || 0).toLocaleString();
            document.getElementById('statGames').textContent = (currentUser.gamesPlayed || 0).toLocaleString();
            
            // Show admin link if user is admin
            try { parent.DKBackend.isAdmin().then(function (ok) { if (ok) document.getElementById('adminLink').style.display = 'block'; }); } catch (e) {}
        }
        
        function savePassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!password) {
                showNotification('Please enter a new password', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showNotification('Passwords do not match!', 'error');
                return;
            }
            
            if (password.length < 6) {
                showNotification('Password must be at least 6 characters', 'error');
                return;
            }
            
            // Update password in localStorage
            currentUser.password = password;
            localStorage.setItem('arcadeUser', JSON.stringify(currentUser));
            
            showNotification('Password changed successfully!', 'success');
            document.getElementById('password').value = '';
            document.getElementById('confirmPassword').value = '';
        }
        
        function showDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
        }
        
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
        }
        
        function deleteAccount() {
            if (!currentUser) return;
            alert('Account deletion needs a server-side function that has not been deployed yet. Please contact an administrator to delete your account.');
            return;
            // Remove all user data from localStorage
            localStorage.removeItem('arcadeUser');
            localStorage.removeItem('user_' + currentUser.username);
            
            // Clear all user-specific data
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes(currentUser.username) || key.includes(currentUser.email)) {
                    keysToRemove.push(key);
                }
            }
            keysToRemove.forEach(key => localStorage.removeItem(key));
            
            showNotification('Account deleted successfully', 'success');
            
            // Redirect to home after 1 second
            setTimeout(() => {
                window.__go('index.html');
            }, 1000);
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDeleteModal();
        });
        
        // Load user data on page load
        loadUserData();
    <\/script>
</body>
</html>
</script>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-label="Member details" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Admin control center. Every action is re-verified by the database (is_admin()); this page only asks. ===== */
(function () {
  'use strict';
  var S = { users: [], byId: {}, sec: 'dashboard', memFilter: 'approved', openId: null, audit: [], mem: [], memCount: 0, apps: [], bots: [], botNames: {} };
  function BK() { return parent.DKBackend; }
  function $(id) { return document.getElementById(id); }
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(msg, kind) { var t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (kind || ''); clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'toast'; }, 4500); }
  function fail(e) { toast('❌ ' + ((e && e.message) || e), 'err'); }
  function ago(d) { if (!d) return '—'; var s = Math.max(0, (Date.now() - new Date(d).getTime()) / 1000); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return Math.floor(s / 86400) + ' d ago'; }
  function num(n) { return Number(n || 0).toLocaleString(); }
  function initial(n) { return esc(String(n || '?').charAt(0).toUpperCase()); }
  function avatar(u, size) { return u && u.avatar_url ? '<img class="avatar" ' + (size ? 'style="width:' + size + 'px;height:' + size + 'px" ' : '') + 'src="' + esc(u.avatar_url) + '" alt="">' : '<span class="avatar" ' + (size ? 'style="width:' + size + 'px;height:' + size + 'px" ' : '') + '>' + initial(u && u.username) + '</span>'; }
  function status(u) {
    if (u.banned) return '<span class="pill p-bad">BANNED</span>';
    if (u.restricted_until && new Date(u.restricted_until) > new Date()) return '<span class="pill p-warn">RESTRICTED</span>';
    if (u.is_admin) return '<span class="pill p-adm">ADMIN</span>';
    if (u.is_staff) return '<span class="pill p-staff">STAFF</span>';
    return '<span class="pill p-ok">ACTIVE</span>';
  }
  function setCount(id, n) { var e = $('ct' + id); if (!e) return; e.textContent = n; e.style.display = n > 0 ? 'inline-block' : 'none'; }

  /* ---------- navigation ---------- */
  window.showSection = function (id) {
    S.sec = id;
    Array.prototype.forEach.call(document.querySelectorAll('.sec'), function (s) { s.classList.toggle('active', s.id === 'sec-' + id); });
    Array.prototype.forEach.call(document.querySelectorAll('.nav-i'), function (b) { if (b.getAttribute('data-sec') === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (id === 'dashboard') renderDash(); else if (id === 'users') renderUsers(); else if (id === 'memories') loadMemories(); else if (id === 'shop') loadShop();
    else if (id === 'audit') loadAudit(); else if (id === 'scores') loadScores(); else if (id === 'applications') loadApplications(); else if (id === 'botSubs') loadBots();
    try { window.scrollTo(0, 0); } catch (e) {}
  };
  window.showAlert = function (_id, msg) { toast(msg); };   /* kept so older code that calls it still works */

  /* ---------- data ---------- */
  function loadUsers() {
    return BK().adminUsers().then(function (users) {
      S.users = users || []; S.byId = {}; S.users.forEach(function (u) { S.byId[u.id] = u; });
      renderUsers(); renderDash();
    }).catch(function (e) { $('userBody').innerHTML = '<tr><td colspan="5" class="empty">❌ ' + esc(e.message || e) + '<br>If this says the function does not exist, run 008_admin_tools.sql in Supabase.</td></tr>'; });
  }
  function refreshCounts() {
    var B = BK();
    B.adminMemories('approved').then(function (r) { S.memCount = (r.data || []).length; renderDash(); }).catch(function () {});
    B.adminApplications().then(function (r) { S.apps = r.data || []; setCount('Applications', S.apps.length); renderDash(); }).catch(function () {});
    B.adminFlags().then(function (r) { setCount('Scores', (r.data || []).length); }).catch(function () {});
    B.adminBotSubs().then(function (r) { S.bots = (r.data || []).filter(function (x) { return x.status === 'pending_activation'; }); setCount('BotSubs', S.bots.length); renderDash(); }).catch(function () {});
  }

  /* ---------- dashboard ---------- */
  function renderDash() {
    if (S.sec !== 'dashboard') return;
    var us = S.users, week = Date.now() - 7 * 86400000;
    var newU = us.filter(function (u) { return u.created_at && new Date(u.created_at).getTime() > week; }).length;
    var coins = us.reduce(function (a, u) { return a + (u.coins || 0); }, 0);
    var banned = us.filter(function (u) { return u.banned || (u.restricted_until && new Date(u.restricted_until) > new Date()); }).length;
    var staff = us.filter(function (u) { return u.is_staff || u.is_admin; }).length;
    function st(l, v, cls) { return '<div class="stat ' + (cls || '') + '"><small>' + l + '</small><b>' + v + '</b></div>'; }
    $('dashStats').innerHTML = st('Members', num(us.length)) + st('New this week', num(newU), newU ? 'good' : '') + st('Coins held by members', num(coins)) + st('Banned / restricted', num(banned), banned ? 'bad' : '') +
      st('Memories posted', num(S.memCount)) + st('Applications waiting', num(S.apps.length), S.apps.length ? 'warn' : '') + st('Bot requests waiting', num(S.bots.length), S.bots.length ? 'warn' : '') + st('Staff + admins', num(staff));
    var items = [];
    if (S.apps.length) items.push(['📋', S.apps.length + ' badge application' + (S.apps.length === 1 ? '' : 's') + ' to review', 'applications']);
    if (S.bots.length) items.push(['🤖', S.bots.length + ' bot subscription' + (S.bots.length === 1 ? '' : 's') + ' to activate', 'botSubs']);
    $('dashAttn').innerHTML = items.length ? items.map(function (i) { return '<div class="attn"><span style="font-size:22px">' + i[0] + '</span><span class="grow" style="flex:1">' + i[1] + '</span><button class="btn btn-warning btn-sm" data-sec-go="' + i[2] + '">Open</button></div>'; }).join('') : '<div class="attn ok"><span style="font-size:22px">✅</span><span>Nothing is waiting. You are all caught up.</span></div>';
    var recent = us.slice(0, 6);
    $('dashNew').innerHTML = recent.length ? recent.map(function (u) { return '<div class="row" style="padding:7px 0;border-top:1px solid rgba(255,255,255,.06)">' + avatar(u) + '<span class="grow"><b>' + esc(u.username) + '</b><br><small style="color:var(--muted)">' + ago(u.created_at) + '</small></span><button class="btn btn-ghost btn-sm" data-open="' + esc(u.id) + '">View</button></div>'; }).join('') : '<div class="empty">No members yet.</div>';
    BK().adminAudit(6).then(function (r) {
      var rows = r.data || [];
      $('dashAudit').innerHTML = rows.length ? rows.map(function (a) { var ad = S.byId[a.admin_id]; return '<div style="padding:8px 0;border-top:1px solid rgba(255,255,255,.06)"><b>' + esc(a.action) + '</b> <span style="color:var(--muted)">by ' + esc(ad ? ad.username : 'admin') + ' · ' + ago(a.created_at) + '</span></div>'; }).join('') : '<div class="empty">No admin actions recorded yet.</div>';
    }).catch(function () { $('dashAudit').innerHTML = '<div class="empty">Audit log unavailable (run 008_admin_tools.sql).</div>'; });
  }

  /* ---------- users ---------- */
  function filteredUsers() {
    var q = $('userSearch').value.trim().toLowerCase(), f = $('userFilter').value, so = $('userSort').value;
    var list = S.users.filter(function (u) {
      if (q && String(u.username).toLowerCase().indexOf(q) < 0 && String(u.email).toLowerCase().indexOf(q) < 0) return false;
      var restricted = u.restricted_until && new Date(u.restricted_until) > new Date();
      if (f === 'banned') return u.banned; if (f === 'restricted') return restricted; if (f === 'staff') return u.is_staff; if (f === 'admin') return u.is_admin;
      return true;
    });
    list.sort(function (a, b) {
      if (so === 'level') return (b.level || 0) - (a.level || 0); if (so === 'coins') return (b.coins || 0) - (a.coins || 0);
      if (so === 'name') return String(a.username).localeCompare(String(b.username));
      return new Date(b.created_at || 0) - new Date(a.created_at || 0);
    });
    return list;
  }
  function renderUsers() {
    if (S.sec !== 'users') return;
    var list = filteredUsers();
    $('userBody').innerHTML = list.length ? list.map(function (u) {
      return '<tr class="click" data-open="' + esc(u.id) + '"><td><span class="row" style="flex-wrap:nowrap">' + avatar(u) + '<b>' + esc(u.username) + '</b></span></td><td>' + esc(u.email) + '</td><td>' + (u.level || 1) + '</td><td>' + num(u.coins) + '</td><td>' + status(u) + '</td></tr>';
    }).join('') : '<tr><td colspan="5" class="empty">No members match.</td></tr>';
    $('userCount').textContent = list.length + ' of ' + S.users.length + ' members';
  }
  function openUser(id) {
    var u = S.byId[id]; if (!u) return; S.openId = id;
    var admin = u.is_admin;
    var dis = admin ? ' disabled title="Administrators cannot be moderated here"' : '';
    $('drawer').innerHTML =
      '<div class="row" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-act="closeDrawer">✕ Close</button></div>' +
      '<div class="dh">' + avatar(u, 64) + '<div><h3>' + esc(u.username) + '</h3><small>' + esc(u.email) + '</small><div style="margin-top:6px">' + status(u) + (u.movies_banned ? ' <span class="pill p-warn">NO MOVIES</span>' : '') + '</div></div></div>' +
      '<div class="ug"><div><small>Level</small><b>' + (u.level || 1) + '</b></div><div><small>XP</small><b>' + num(u.xp) + '</b></div><div><small>Coins</small><b>' + num(u.coins) + '</b></div><div><small>Games</small><b>' + num(u.games_played) + '</b></div><div><small>Joined</small><b style="font-size:12px">' + (u.created_at ? new Date(u.created_at).toLocaleDateString() : '—') + '</b></div><div><small>Profile</small><b style="font-size:12px"><a style="color:var(--blue)" href="profile.html?user=' + encodeURIComponent(u.username) + '">Open</a></b></div></div>' +
      '<div class="box"><h5>REWARDS</h5><div class="row"><input class="inp grow" id="dCoins" type="number" min="1" placeholder="coins"><button class="btn btn-success btn-sm" data-act="dGive" data-kind="give_coins" data-field="dCoins">Give coins</button></div>' +
      '<div class="row" style="margin-top:8px"><input class="inp grow" id="dXp" type="number" min="1" placeholder="XP"><button class="btn btn-success btn-sm" data-act="dGive" data-kind="give_xp" data-field="dXp">Give XP</button></div>' +
      '<div class="row" style="margin-top:8px"><select class="form-select grow" id="dBadge"><option value="founder_badge">👑 Founder</option><option value="verified_discord">✅ Verified Discord</option><option value="org_badge">🏢 Organization</option><option value="roblox_badge">🎮 Roblox Developer</option><option value="team_badge">👥 Team</option><option value="diane_bot_developer">🤖 Bot Developer</option><option value="premium_badge">💎 Premium</option><option value="community_badge">🌟 Community</option></select><button class="btn btn-success btn-sm" data-act="dBadge">Give badge</button></div></div>' +
      '<div class="box"><h5>MODERATION</h5><div class="row"><button class="btn btn-danger btn-sm" data-act="dDo" data-kind="' + (u.banned ? 'unban' : 'ban') + '"' + dis + '>' + (u.banned ? 'Unban site' : 'Ban from site') + '</button>' +
      '<button class="btn btn-warning btn-sm" data-act="dDo" data-kind="' + (u.movies_banned ? 'movies_unban' : 'movies_ban') + '"' + dis + '>' + (u.movies_banned ? 'Allow movies' : 'Ban from movies') + '</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="dDo" data-kind="' + (u.is_staff ? 'staff_off' : 'staff_on') + '">' + (u.is_staff ? 'Remove staff' : 'Make staff') + '</button></div>' +

/* ===== DKScore: automatic score recording. Players never type scores. =====
   A game (or a per-game adapter) calls DKScore.report(finalScore). The server verifies the play session and
   the score before it reaches a leaderboard (see 011_auto_scores.sql). */
(function () {
  'use strict';
  var adapters = {}, cur = null, listeners = [];
  function B() { return window.DKBackend; }
  function emit(ev) { listeners.forEach(function (f) { try { f(ev); } catch (e) {} }); }
  var api = window.DKScore = {
    register: function (gameId, info) { adapters[gameId] = info || { source: 'adapter' }; },
    hasAdapter: function (gameId) { return !!adapters[gameId]; },
    on: function (fn) { listeners.push(fn); },
    off: function (fn) { listeners = listeners.filter(function (f) { return f !== fn; }); },
    begin: function (gameId) {
      var b = B(); cur = null;
      if (!b || !b.client || !b.user) { emit({ type: 'anon' }); return Promise.resolve(null); }
      return b.scoreBegin(gameId).then(function (id) { cur = { id: id, game: gameId }; emit({ type: 'started', game: gameId }); return id; })
        .catch(function (e) { emit({ type: 'error', message: (e && e.message) || String(e) }); return null; });
    },
    report: function (score) {

        .then(function (r) { return api.begin(c.game).then(function () { return r; }); });   /* ready for the next round */

    end: function () { cur = null; }
