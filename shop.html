<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Shop - Diane's Arcade</title>
    <link rel="icon" href="https://images.unsplash.com/photo-1509023464722-18d996393ca8?w=32&h=32&fit=crop" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bf00ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-gold: #ffd700;
            --neon-red: #ff0000;
            --dark-bg: #050510;
            --darker: #020208;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--dark-bg);
            color: white;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(90deg, transparent 49%, rgba(0, 243, 255, 0.1) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(0, 243, 255, 0.1) 50%, transparent 51%);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .nav-bar {
            position: sticky; top: 0;
            background: rgba(5, 5, 16, 0.98);
            backdrop-filter: blur(30px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--neon-blue);
            box-shadow: 0 5px 40px rgba(0, 243, 255, 0.4);
            z-index: 2000;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .nav-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            font-weight: 900;
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold);
            letter-spacing: 2px;
        }
        
        .nav-links { display: flex; gap: 25px; flex-wrap: wrap; }
        
        .nav-link {
            font-family: 'Orbitron', sans-serif;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border: 2px solid var(--neon-blue);
            border-radius: 30px;
            transition: all 0.3s;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.9em;
        }
        
        .nav-link:hover {
            background: var(--neon-blue);
            color: var(--darker);
            box-shadow: 0 0 30px var(--neon-blue);
            transform: translateY(-3px);
        }
        
        .container { max-width: 1400px; margin: 60px auto; padding: 0 40px; }
        
        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4em;
            font-weight: 900;
            text-align: center;
            margin: 40px 0 20px;
            background: linear-gradient(135deg, var(--neon-gold), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .coin-balance {
            text-align: center;
            font-size: 2em;
            margin-bottom: 50px;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-gold);
            text-shadow: 0 0 30px var(--neon-gold);
        }
        
        .shop-categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            padding: 15px 35px;
            background: rgba(191, 0, 255, 0.1);
            border: 2px solid var(--neon-purple);
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }
        
        .category-btn:hover {
            background: rgba(191, 0, 255, 0.3);
            transform: translateY(-3px);
        }
        
        .category-btn.active {
            background: var(--neon-purple);
            color: white;
            box-shadow: 0 0 40px var(--neon-purple);
        }
        
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
            margin-bottom: 80px;
        }
        
        .shop-item {
            background: rgba(0, 243, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
        }
        
        .shop-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
        }
        
        .shop-item.special {
            border-color: var(--neon-gold);
        }
        
        .shop-item.special:hover {
            box-shadow: 0 0 50px var(--neon-gold);
        }
        
        .shop-item.premium {
            border-color: var(--neon-purple);
            background: rgba(191, 0, 255, 0.1);
        }
        
        .shop-item.premium:hover {
            box-shadow: 0 0 50px var(--neon-purple);
        }
        
        .shop-item.exclusive {
            border-color: var(--neon-red);
            background: rgba(255, 0, 0, 0.1);
        }
        
        .shop-item.exclusive:hover {
            box-shadow: 0 0 50px var(--neon-red);
        }
        
        .item-icon { font-size: 4em; margin-bottom: 20px; }
        
        .item-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            color: var(--neon-blue);
            margin-bottom: 15px;
            font-weight: 900;
        }
        
        .item-description {
            font-size: 1em;
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .item-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            color: var(--neon-gold);
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .buy-btn {
            padding: 12px 40px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1em;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
        }
        
        .buy-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px var(--neon-blue);
        }
        
        .buy-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .apply-btn {
            background: linear-gradient(135deg, var(--neon-gold), var(--neon-green));
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        .apply-btn:hover {
            box-shadow: 0 0 50px var(--neon-gold);
        }
        
        .special-badge {
            position: absolute;
            top: -15px;
            right: 20px;
            background: var(--neon-gold);
            color: var(--darker);
            padding: 5px 15px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.8em;
        }
        
        .requirements {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--neon-gold);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.9em;
        }
        
        .requirements h4 {
            color: var(--neon-gold);
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
        }
        
        .requirements ul { margin-left: 20px; }
        .requirements li { margin: 5px 0; }
        
        .warning-box {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid var(--neon-red);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.9em;
        }
        
        .warning-box h4 {
            color: var(--neon-red);
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: var(--darker);
            border: 3px solid var(--neon-blue);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 60px var(--neon-blue);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-gold);
            margin-bottom: 20px;
        }
        
        .form-group { margin-bottom: 20px; }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--neon-blue);
            border-radius: 10px;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 1em;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px var(--neon-purple);
        }
        
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .close-modal {
            color: var(--neon-pink);
            font-size: 2em;
            float: right;
            cursor: pointer;
            line-height: 1;
            transition: all 0.3s;
        }
        
        .close-modal:hover {
            transform: rotate(90deg);
            text-shadow: 0 0 20px var(--neon-pink);
        }
        
        .notification {
            position: fixed;
            bottom: -100px;
            right: 30px;
            padding: 20px 30px;
            background: var(--neon-blue);
            color: var(--darker);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            z-index: 20000;
            transition: bottom 0.3s;
            box-shadow: 0 0 40px var(--neon-blue);
        }
        
        .notification.show { bottom: 30px; }
        .notification.error { background: var(--neon-pink); color: white; }
        .notification.success { background: var(--neon-green); color: var(--darker); }
        
        @media (max-width: 768px) {
            .page-title { font-size: 2.5em; }
            .shop-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                <div class="form-group">
                    <label>Discord Server Invite Link:</label>
                    <input type="url" name="discord_invite" required placeholder="https://discord.gg/...">
                </div>
                
                <div class="form-group">
                    <label>Server Member Count:</label>
                    <input type="number" name="member_count" required placeholder="e.g., 500">
                </div>
                
                <div id="extra-fields"></div>
                
                <div class="form-group">
                    <label>Additional Information:</label>
                    <textarea name="additional_info" placeholder="Tell us about your community..."></textarea>
                </div>
                
                <button type="submit" class="buy-btn apply-btn">SUBMIT APPLICATION</button>
            </form>
        </div>
    </div>
    
    <!-- Bot Purchase Modal -->

            </div>
            
            <div class="form-group">
                <label>Discord Server ID:</label>

            </div>
            
            <div class="form-group">
                <label>Server Name:</label>
                <input type="text" id="bot-server-name" placeholder="My Awesome Server" required>
            </div>
            
            <div style="background: rgba(255, 215, 0, 0.1); border: 2px solid var(--neon-gold); border-radius: 10px; padding: 15px; margin: 20px 0;">
                <strong>Total Cost:</strong> <span id="bot-total-cost" style="color: var(--neon-gold); font-size: 1.3em;">0 🪙</span>

            <button class="buy-btn" onclick="confirmBotPurchase()">PURCHASE SUBSCRIPTION</button>
        </div>
    </div>

            {

                price: 3000,

                type: 'purchase'
            },
            {
                id: 'lucky_boost',
                name: 'Lucky Boost (7 Days)',
                description: 'Increased rare drop chances for 7 days! Better rewards!',
                icon: '🌟',
                price: 7500,
                category: 'perks',
                type: 'purchase'
            },
            {
                id: 'precision_boost',
                name: 'Precision Boost (3 Days)',
                description: 'Better accuracy in skill-based games for 3 days!',
                icon: '🎯',
                price: 5000,
                category: 'perks',
                type: 'purchase'
            }
        ];
        
        let currentCategory = 'all';
        let userCoins = 0;
        let currentBotItem = null;
        
        function loadShop() {
            const userData = localStorage.getItem('arcadeUser');
            if (userData) {
                const user = JSON.parse(userData);
                userCoins = user.coins || 0;
                document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
            }
            renderShop();
        }
        
        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            
            const filteredItems = currentCategory === 'all' 
                ? shopItems 
                : shopItems.filter(item => item.category === currentCategory);
            
            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'shop-item';
                if (item.type === 'application') card.classList.add('special');
                if (item.category === 'bots') card.classList.add('premium');
                if (item.category === 'exclusive') card.classList.add('exclusive');
                
                const canAfford = typeof item.price === 'number' && userCoins >= item.price;
                const priceDisplay = typeof item.price === 'number' ? `${item.price.toLocaleString()} 🪙` : item.price;
                
                let buttonHTML = '';
                if (item.type === 'application') {
                    buttonHTML = `<button class="buy-btn apply-btn" onclick='openApplication(${JSON.stringify(item)})'>APPLY NOW</button>`;
                } else if (item.type === 'bot_subscription') {
                    buttonHTML = `<button class="buy-btn" onclick='openBotPurchase(${JSON.stringify(item)})' ${!canAfford ? 'disabled' : ''}>SUBSCRIBE</button>`;
                } else {
                    buttonHTML = `<button class="buy-btn" onclick="purchaseItem('${item.id}', ${item.price})" ${!canAfford ? 'disabled' : ''}>BUY NOW</button>`;
                }
                
                let requirementsHTML = '';
                if (item.requirements) {
                    requirementsHTML = `
                        <div class="requirements">
                            <h4>Requirements:</h4>
                            <ul>
                                ${item.requirements.map(req => `<li>${req}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }
                
                let warningHTML = '';
                if (item.warning) {
                    warningHTML = `
                        <div class="warning-box">
                            <h4>⚠️ IMPORTANT:</h4>
                            <p>${item.warning}</p>
                        </div>
                    `;
                }
                
                let badgeText = '';
                if (item.type === 'application') {
                    badgeText = '<div class="special-badge">APPLICATION</div>';
                } else if (item.category === 'bots') {
                    badgeText = '<div class="special-badge" style="background: var(--neon-purple);">BOT SUB</div>';
                } else if (item.category === 'exclusive') {
                    badgeText = '<div class="special-badge" style="background: var(--neon-red);">EXCLUSIVE</div>';
                }
                
                card.innerHTML = `
                    ${badgeText}
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-description">${item.description}</div>
                    ${warningHTML}
                    ${requirementsHTML}
                    <div class="item-price">${priceDisplay}</div>
                    ${buttonHTML}
                `;
                
                container.appendChild(card);
            });
        }
        
        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderShop();
        }
        
        function openApplication(item) {
            document.getElementById('modal-title').textContent = `Apply for ${item.name}`;
            document.getElementById('app-item-id').value = item.id;
            
            const extraFieldsContainer = document.getElementById('extra-fields');
            extraFieldsContainer.innerHTML = '';
            
            if (item.extraFields) {
                item.extraFields.forEach(field => {
                    const div = document.createElement('div');
                    div.className = 'form-group';
                    
                    if (field.type === 'textarea') {
                        div.innerHTML = `
                            <label>${field.label}:</label>
                            <textarea name="${field.name}" ${field.required ? 'required' : ''} placeholder="${field.placeholder || ''}"></textarea>
                        `;
                    } else {
                        div.innerHTML = `
                            <label>${field.label}:</label>
                            <input type="${field.type}" name="${field.name}" ${field.required ? 'required' : ''} placeholder="${field.placeholder || ''}">
                        `;
                    }
                    
                    extraFieldsContainer.appendChild(div);
                });
            }
            
            document.getElementById('application-modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('application-modal').classList.remove('active');
            document.getElementById('application-form').reset();
        }
        
        function submitApplication(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const application = {
                item_id: formData.get('item_id'),
                discord_invite: formData.get('discord_invite'),
                member_count: formData.get('member_count'),
                additional_info: formData.get('additional_info'),
                timestamp: new Date().toISOString(),
                status: 'pending'
            };
            
            const itemId = formData.get('item_id');
            const item = shopItems.find(i => i.id === itemId);
            if (item && item.extraFields) {
                item.extraFields.forEach(field => {
                    application[field.name] = formData.get(field.name);
                });
            }
            
            const userData = localStorage.getItem('arcadeUser');
            if (userData) {
                const user = JSON.parse(userData);
                application.username = user.username;
                application.email = user.email;
            }
            
            const applications = JSON.parse(localStorage.getItem('badgeApplications') || '[]');
            applications.push(application);
            localStorage.setItem('badgeApplications', JSON.stringify(applications));
            
            showNotification('Application submitted! Staff will review it soon. 🎉', 'success');
            closeModal();
        }
        
        function openBotPurchase(item) {
            currentBotItem = item;
            document.getElementById('bot-modal-title').textContent = `Subscribe to ${item.name}`;
            document.getElementById('bot-modal-desc').textContent = item.description;
            updateBotCost();
            document.getElementById('bot-purchase-modal').classList.add('active');
        }
        
        function closeBotModal() {
            document.getElementById('bot-purchase-modal').classList.remove('active');
            currentBotItem = null;
        }
        
        function updateBotCost() {
            const months = parseInt(document.getElementById('bot-months').value);
            const totalCost = currentBotItem.price * months;
            document.getElementById('bot-total-cost').textContent = `${totalCost.toLocaleString()} 🪙`;
        }
        
        document.getElementById('bot-months')?.addEventListener('change', updateBotCost);
        
        function confirmBotPurchase() {
            const serverId = document.getElementById('bot-server-id').value.trim();
            const serverName = document.getElementById('bot-server-name').value.trim();
            const months = parseInt(document.getElementById('bot-months').value);
            
            if (!serverId || !serverName) {
                showNotification('Please fill in all fields!', 'error');
                return;
            }
            
            const totalCost = currentBotItem.price * months;
            
            if (userCoins < totalCost) {
                showNotification('Not enough coins!', 'error');
                return;
            }
            
            const userData = localStorage.getItem('arcadeUser');
            if (!userData) {
                showNotification('Please login first!', 'error');
                return;
            }
            
            const user = JSON.parse(userData);
            user.coins -= totalCost;
            
            const purchase = {
                type: 'bot_subscription',
                item_id: currentBotItem.id,
                item_name: currentBotItem.name,
                months: months,
                server_id: serverId,
                server_name: serverName,
                total_cost: totalCost,
                username: user.username,
                email: user.email,
                timestamp: new Date().toISOString(),
                status: 'pending_activation'
            };
            
            const purchases = JSON.parse(localStorage.getItem('botPurchases') || '[]');
            purchases.push(purchase);
            localStorage.setItem('botPurchases', JSON.stringify(purchases));
            
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            localStorage.setItem('user_' + user.username, JSON.stringify(user));
            
            userCoins = user.coins;
            document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
            
            showNotification(`✅ Purchased ${currentBotItem.name} for ${months} month(s)! Staff will activate within 24 hours.`, 'success');
            closeBotModal();
            renderShop();
        }
        
        function purchaseItem(itemId, price) {
            const userData = localStorage.getItem('arcadeUser');
            if (!userData) {
                showNotification('Please login first!', 'error');
                return;
            }
            
            const user = JSON.parse(userData);
            
            if (user.coins < price) {
                showNotification('Not enough coins!', 'error');
                return;
            }
            
            user.coins -= price;
            
            if (!user.inventory) user.inventory = [];
            if (!user.badges) user.badges = [];
            
            const item = shopItems.find(i => i.id === itemId);
            
            if (item.category === 'badges') {
                if (!user.badges.includes(itemId)) {
                    user.badges.push(itemId);
                }
            } else {
                user.inventory.push({
                    item_id: itemId,
                    purchased_at: new Date().toISOString()
                });
            }
            
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            localStorage.setItem('user_' + user.username, JSON.stringify(user));
            
            userCoins = user.coins;
            document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
            
            showNotification(`✅ Purchased ${item.name}!`, 'success');
            renderShop();
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeBotModal();
            }
        });
        
        loadShop();
    </script>
