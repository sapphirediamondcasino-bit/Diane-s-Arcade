<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Shop - Diane's Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bf00ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-gold: #ffd700;
            --dark-bg: #050510;
            --darker: #020208;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--dark-bg);
            color: white;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 49%, rgba(0, 243, 255, 0.1) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(0, 243, 255, 0.1) 50%, transparent 51%);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .nav-bar {
            position: sticky;
            top: 0;
            background: rgba(5, 5, 16, 0.98);
            backdrop-filter: blur(30px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--neon-blue);
            box-shadow: 0 5px 40px rgba(0, 243, 255, 0.4);
            z-index: 2000;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .nav-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            font-weight: 900;
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold);
            letter-spacing: 2px;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        
        .nav-link {
            font-family: 'Orbitron', sans-serif;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border: 2px solid var(--neon-blue);
            border-radius: 30px;
            transition: all 0.3s;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.9em;
        }
        
        .nav-link:hover {
            background: var(--neon-blue);
            color: var(--darker);
            box-shadow: 0 0 30px var(--neon-blue);
            transform: translateY(-3px);
        }
        
        .container {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 40px;
        }
        
        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4em;
            font-weight: 900;
            text-align: center;
            margin: 40px 0 20px;
            background: linear-gradient(135deg, var(--neon-gold), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .coin-balance {
            text-align: center;
            font-size: 2em;
            margin-bottom: 50px;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-gold);
            text-shadow: 0 0 30px var(--neon-gold);
        }
        
        .earn-coins-link {
            display: block;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .earn-coins-link a {
            color: var(--neon-green);
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid var(--neon-green);
            border-radius: 20px;
            transition: all 0.3s;
            display: inline-block;
        }
        
        .earn-coins-link a:hover {
            background: var(--neon-green);
            color: var(--darker);
            box-shadow: 0 0 30px var(--neon-green);
        }
        
        .shop-categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            padding: 15px 35px;
            background: rgba(191, 0, 255, 0.1);
            border: 2px solid var(--neon-purple);
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }
        
        .category-btn:hover {
            background: rgba(191, 0, 255, 0.3);
            transform: translateY(-3px);
        }
        
        .category-btn.active {
            background: var(--neon-purple);
            color: white;
            box-shadow: 0 0 40px var(--neon-purple);
        }
        
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
            margin-bottom: 80px;
        }
        
        .shop-item {
            background: rgba(0, 243, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
        }
        
        .shop-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
        }
        
        .shop-item.owned {
            border-color: var(--neon-green);
            background: rgba(57, 255, 20, 0.1);
        }
        
        .owned-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--neon-green);
            color: var(--darker);
            padding: 5px 15px;
            border-radius: 15px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.8em;
        }
        
        .item-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .item-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            color: var(--neon-blue);
            margin-bottom: 15px;
            font-weight: 900;
        }
        
        .item-description {
            font-size: 1em;
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .item-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            color: var(--neon-gold);
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .buy-btn {
            padding: 12px 40px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1em;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
        }
        
        .buy-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px var(--neon-blue);
        }
        
        .buy-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .buy-btn.owned {
            background: var(--neon-green);
            box-shadow: 0 0 30px var(--neon-green);
        }
        
        .notification {
            position: fixed;
            bottom: -100px;
            right: 30px;
            padding: 20px 30px;
            background: var(--neon-blue);
            color: var(--darker);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            z-index: 20000;
            transition: bottom 0.3s;
            box-shadow: 0 0 40px var(--neon-blue);
        }
        
        .notification.show {
            bottom: 30px;
        }
        
        .notification.error {
            background: var(--neon-pink);
            color: white;
        }
        
        .notification.success {
            background: var(--neon-green);
        }
        
        /* Confirmation Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: rgba(5, 5, 16, 0.98);
            border: 3px solid var(--neon-blue);
            border-radius: 30px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 80px var(--neon-blue);
        }
        
        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5em;
            color: var(--neon-blue);
            margin-bottom: 20px;
            text-shadow: 0 0 30px var(--neon-blue);
        }
        
        .modal-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }
        
        .modal-text {
            font-size: 1.2em;
            margin: 20px 0;
            line-height: 1.6;
        }
        
        .modal-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .modal-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-btn-confirm {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            color: var(--darker);
            box-shadow: 0 0 30px var(--neon-green);
        }
        
        .modal-btn-confirm:hover {
            box-shadow: 0 0 50px var(--neon-green);
            transform: scale(1.05);
        }
        
        .modal-btn-cancel {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: white;
            box-shadow: 0 0 30px var(--neon-pink);
        }
        
        .modal-btn-cancel:hover {
            box-shadow: 0 0 50px var(--neon-pink);
            transform: scale(1.05);
        }
    </style>
</head>

            },
            {
                id: 'coin_pack_large',
                name: 'Large Coin Pack',

                price: 800,
                category: 'perks',
                type: 'consumable'
            }
        ];
        
        let currentCategory = 'all';
        let userCoins = 0;
        let currentUser = null;
        let selectedItem = null;
        
        // LOAD USER DATA
        function loadUser() {
            const user = localStorage.getItem('arcadeUser');
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = JSON.parse(user);
            userCoins = currentUser.coins || 0;
            document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
        }
        
        function saveUser() {
            localStorage.setItem('arcadeUser', JSON.stringify(currentUser));
        }
        
        // CHECK IF USER OWNS ITEM
        function ownsItem(itemId) {
            if (!currentUser.inventory) currentUser.inventory = [];
            if (!currentUser.badges) currentUser.badges = [];
            
            return currentUser.inventory.includes(itemId) || currentUser.badges.includes(itemId);
        }
        
        // RENDER SHOP
        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            
            const filteredItems = currentCategory === 'all' 
                ? SHOP_ITEMS 
                : SHOP_ITEMS.filter(item => item.category === currentCategory);
            
            filteredItems.forEach(item => {
                const card = document.createElement('div');
                const owned = ownsItem(item.id);
                const canAfford = userCoins >= item.price;
                
                card.className = 'shop-item' + (owned ? ' owned' : '');
                
                const isApplication = item.type === 'application';
                const priceDisplay = isApplication ? 'FREE - APPLICATION' : `${item.price.toLocaleString()} 🪙`;
                const buttonText = owned ? '✓ OWNED' : 
                                   isApplication ? '📝 APPLY' :
                                   canAfford ? '🛒 BUY NOW' : '🔒 NOT ENOUGH COINS';
                
                card.innerHTML = `
                    ${owned ? '<div class="owned-badge">✓ OWNED</div>' : ''}
                    ${isApplication ? '<div style="position: absolute; top: 15px; left: 15px; background: var(--neon-green); color: var(--darker); padding: 5px 15px; border-radius: 15px; font-family: \'Orbitron\', sans-serif; font-weight: 900; font-size: 0.8em;">FREE</div>' : ''}
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-description">${item.description}</div>
                    <div class="item-price">${priceDisplay}</div>
                    <button 
                        class="buy-btn ${owned ? 'owned' : ''}" 
                        onclick='${isApplication ? "openApplicationPage()" : `openPurchaseModal(${JSON.stringify(item)})`}' 
                        ${owned || (!isApplication && !canAfford) ? 'disabled' : ''}
                    >
                        ${buttonText}
                    </button>
                `;
                
                container.appendChild(card);
            });
        }
        
        // FILTER CATEGORIES
        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderShop();
        }
        
        // OPEN PURCHASE MODAL
        function openPurchaseModal(item) {
            selectedItem = item;
            document.getElementById('modal-icon').textContent = item.icon;
            document.getElementById('modal-title').textContent = `Buy ${item.name}?`;
            document.getElementById('modal-text').textContent = `
                Price: ${item.price.toLocaleString()} 🪙
                Your balance: ${userCoins.toLocaleString()} 🪙
                After purchase: ${(userCoins - item.price).toLocaleString()} 🪙
            `;
            document.getElementById('purchase-modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('purchase-modal').classList.remove('active');
            selectedItem = null;
        }
        
        // CONFIRM PURCHASE
        function confirmPurchase() {
            if (!selectedItem) return;
            
            // Check if can afford
            if (userCoins < selectedItem.price) {
                showNotification('Not enough coins!', 'error');
                closeModal();
                return;
            }
            
            // Deduct coins
            currentUser.coins = userCoins - selectedItem.price;
            userCoins = currentUser.coins;
            
            // Add item to inventory
            if (selectedItem.type === 'badge') {
                if (!currentUser.badges) currentUser.badges = [];
                currentUser.badges.push(selectedItem.id);
            } else {
                if (!currentUser.inventory) currentUser.inventory = [];
                currentUser.inventory.push(selectedItem.id);
            }
            
            // Apply consumable effects
            if (selectedItem.type === 'consumable') {
                applyConsumable(selectedItem.id);
            }
            
            // Save user
            saveUser();
            
            // Update display
            document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
            renderShop();
            closeModal();
            
            showNotification(`✓ Purchased ${selectedItem.name}!`, 'success');
        }
        
        // APPLY CONSUMABLE EFFECTS
        function applyConsumable(itemId) {
            const now = new Date().getTime();
            
            if (!currentUser.activeBoosts) currentUser.activeBoosts = {};
            
            switch(itemId) {
                case 'xp_boost':
                    currentUser.activeBoosts.xp = now + (24 * 60 * 60 * 1000); // 24 hours
                    showNotification('XP Boost active for 24 hours!', 'success');
                    break;
                case 'coin_boost':
                    currentUser.activeBoosts.coins = now + (7 * 24 * 60 * 60 * 1000); // 7 days
                    showNotification('Coin Boost active for 7 days!', 'success');
                    break;
                case 'level_boost':
                    currentUser.level = (currentUser.level || 1) + 1;
                    currentUser.xp = Math.pow(currentUser.level, 2) * 100; // Set XP to start of new level
                    showNotification('Level Up! You are now level ' + currentUser.level, 'success');
                    break;
                case 'mega_xp_boost':
                    currentUser.activeBoosts.megaXP = now + (7 * 24 * 60 * 60 * 1000); // 7 days
                    showNotification('Mega XP Boost active for 7 days!', 'success');
                    break;
                case 'coin_pack_small':
                    currentUser.coins = (currentUser.coins || 0) + 500;
                    userCoins = currentUser.coins;
                    document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
                    showNotification('Received 500 bonus coins!', 'success');
                    break;
                case 'coin_pack_large':
                    currentUser.coins = (currentUser.coins || 0) + 2000;
                    userCoins = currentUser.coins;
                    document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
                    showNotification('Received 2000 bonus coins!', 'success');
                    break;
            }
            
            saveUser();
        }
        
        // OPEN APPLICATION PAGE (for verified badges)
        function openApplicationPage() {
            showNotification('Application system coming soon! Contact admin on Discord.', 'info');
            // Future: Link to application form or Discord
        }
        
        // NOTIFICATIONS
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        // CLOSE MODAL ON ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // INITIALIZE
        loadUser();
        renderShop();
    </script>
</body>
</html>
