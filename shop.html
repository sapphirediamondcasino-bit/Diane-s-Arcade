<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Shop - Diane's Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bf00ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-gold: #ffd700;
            --dark-bg: #050510;
            --darker: #020208;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--dark-bg);
            color: white;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 49%, rgba(0, 243, 255, 0.1) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(0, 243, 255, 0.1) 50%, transparent 51%);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .nav-bar {
            position: sticky;
            top: 0;
            background: rgba(5, 5, 16, 0.98);
            backdrop-filter: blur(30px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--neon-blue);
            box-shadow: 0 5px 40px rgba(0, 243, 255, 0.4);
            z-index: 2000;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .nav-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            font-weight: 900;
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold);
            letter-spacing: 2px;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        
        .nav-link {
            font-family: 'Orbitron', sans-serif;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border: 2px solid var(--neon-blue);
            border-radius: 30px;
            transition: all 0.3s;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.9em;
        }
        
        .nav-link:hover {
            background: var(--neon-blue);
            color: var(--darker);
            box-shadow: 0 0 30px var(--neon-blue);
            transform: translateY(-3px);
        }
        
        .container {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 40px;
        }
        
        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4em;
            font-weight: 900;
            text-align: center;
            margin: 40px 0 20px;
            background: linear-gradient(135deg, var(--neon-gold), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .coin-balance {
            text-align: center;
            font-size: 2em;
            margin-bottom: 50px;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-gold);
            text-shadow: 0 0 30px var(--neon-gold);
        }
        
        .shop-categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            padding: 15px 35px;
            background: rgba(191, 0, 255, 0.1);
            border: 2px solid var(--neon-purple);
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }
        
        .category-btn:hover {
            background: rgba(191, 0, 255, 0.3);
            transform: translateY(-3px);
        }
        
        .category-btn.active {
            background: var(--neon-purple);
            color: white;
            box-shadow: 0 0 40px var(--neon-purple);
        }
        
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
            margin-bottom: 80px;
        }
        
        .shop-item {
            background: rgba(0, 243, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
        }
        
        .shop-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
        }
        
        .shop-item.owned {
            border-color: var(--neon-green);
            background: rgba(57, 255, 20, 0.05);
        }
        
        .owned-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--neon-green);
            color: var(--darker);
            padding: 5px 15px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.8em;
        }
        
        .item-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .item-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            color: var(--neon-blue);
            margin-bottom: 15px;
            font-weight: 900;
        }
        
        .item-description {
            font-size: 1em;
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .item-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            color: var(--neon-gold);
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .buy-btn {
            padding: 12px 40px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1em;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
        }
        
        .buy-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px var(--neon-blue);
        }
        
        .buy-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .notification {
            position: fixed;
            bottom: -100px;
            right: 30px;
            padding: 20px 30px;
            background: var(--neon-blue);
            color: var(--darker);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            z-index: 20000;
            transition: bottom 0.3s;
            box-shadow: 0 0 40px var(--neon-blue);
        }
        
        .notification.show {
            bottom: 30px;
        }
        
        .notification.error {
            background: var(--neon-pink);
        }
        
        .notification.success {
            background: var(--neon-green);
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-brand">🪙 COIN SHOP</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">HOME</a>
            <a href="achievements.html" class="nav-link">ACHIEVEMENTS</a>
            <a href="leaderboard.html" class="nav-link">LEADERBOARD</a>
            <a href="profile.html" class="nav-link">MY PROFILE</a>
        </div>
    </nav>
    
    <div class="container">
        <h1 class="page-title">🪙 COIN SHOP 🪙</h1>
        <div class="coin-balance">Your Balance: <span id="coin-balance">0</span> 🪙</div>
        
        <div class="shop-categories">
            <button class="category-btn active" onclick="filterCategory('all')">ALL ITEMS</button>
            <button class="category-btn" onclick="filterCategory('badges')">BADGES</button>
            <button class="category-btn" onclick="filterCategory('cosmetics')">COSMETICS</button>
            <button class="category-btn" onclick="filterCategory('perks')">PERKS</button>
        </div>
        
        <div class="shop-grid" id="shop-items"></div>
    </div>
    
    <script>
        const shopItems = [
            // BADGES
            {
                id: 'verified_discord',
                name: 'Verified Discord Badge',
                description: 'Show you\'re a verified Discord community leader!',
                icon: '🔷',
                price: 0,
                category: 'badges',
                type: 'free'
            },
            {
                id: 'org_badge',
                name: 'Organization Badge',
                description: 'Official badge for gaming organizations and teams',
                icon: '🏢',
                price: 0,
                category: 'badges',
                type: 'free'
            },
            {
                id: 'roblox_badge',
                name: 'Roblox Developer Badge',
                description: 'For Roblox game developers and creators',
                icon: '🎮',
                price: 0,
                category: 'badges',
                type: 'free'
            },
            {
                id: 'premium_badge',
                name: 'Premium Badge',
                description: 'Show your support with a shiny premium badge!',
                icon: '💎',
                price: 5000,
                category: 'badges',
                type: 'purchase'
            },
            {
                id: 'founder_badge',
                name: 'Founder Badge',
                description: 'Limited edition badge for early supporters',
                icon: '👑',
                price: 10000,
                category: 'badges',
                type: 'purchase'
            },
            
            // COSMETICS
            {
                id: 'custom_title',
                name: 'Custom Profile Title',
                description: 'Add a custom title to your profile',
                icon: '✨',
                price: 2500,
                category: 'cosmetics',
                type: 'purchase'
            },
            {
                id: 'profile_frame',
                name: 'Animated Profile Frame',
                description: 'Glowing animated frame for your avatar',
                icon: '🖼️',
                price: 3000,
                category: 'cosmetics',
                type: 'purchase'
            },
            {
                id: 'name_color',
                name: 'Colored Username',
                description: 'Change your username color',
                icon: '🌈',
                price: 1500,
                category: 'cosmetics',
                type: 'purchase'
            },
            
            // PERKS
            {
                id: 'xp_boost',
                name: 'XP Boost (24h)',
                description: 'Earn 2x XP for 24 hours!',
                icon: '⚡',
                price: 1000,
                category: 'perks',
                type: 'purchase'
            },
            {
                id: 'coin_boost',
                name: 'Coin Boost (7 days)',
                description: 'Earn 1.5x coins for a week',
                icon: '💰',
                price: 2000,
                category: 'perks',
                type: 'purchase'
            }
        ];
        
        let currentCategory = 'all';
        let userCoins = 0;
        let userBadges = [];
        
        function loadShop() {
            const user = JSON.parse(localStorage.getItem('arcadeUser'));
            
            if (!user) {
                alert('Please create a profile first!');
                window.location.href = 'profile.html';
                return;
            }
            
            userCoins = user.coins || 0;
            userBadges = user.badges || [];
            document.getElementById('coin-balance').textContent = userCoins.toLocaleString();
            
            renderShop();
        }
        
        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            
            const filteredItems = currentCategory === 'all' 
                ? shopItems 
                : shopItems.filter(item => item.category === currentCategory);
            
            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'shop-item';
                
                const owned = userBadges.includes(item.id);
                if (owned) card.classList.add('owned');
                
                const canAfford = userCoins >= item.price;
                const priceDisplay = item.price === 0 ? 'FREE' : `${item.price.toLocaleString()} 🪙`;
                
                let buttonHTML = '';
                if (owned) {
                    buttonHTML = `<button class="buy-btn" disabled>OWNED ✓</button>`;
                } else if (item.type === 'free') {
                    buttonHTML = `<button class="buy-btn" onclick="claimFree('${item.id}')">CLAIM FREE</button>`;
                } else {
                    buttonHTML = `<button class="buy-btn" onclick="purchaseItem('${item.id}')" ${!canAfford ? 'disabled' : ''}>BUY NOW</button>`;
                }
                
                card.innerHTML = `
                    ${owned ? '<div class="owned-badge">OWNED</div>' : ''}
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-description">${item.description}</div>
                    <div class="item-price">${priceDisplay}</div>
                    ${buttonHTML}
                `;
                
                container.appendChild(card);
            });
        }
        
        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderShop();
        }
        
        function claimFree(itemId) {
            const user = JSON.parse(localStorage.getItem('arcadeUser'));
            
            if (!user.badges) user.badges = [];
            
            if (user.badges.includes(itemId)) {
                showNotification('You already own this badge!', 'error');
                return;
            }
            
            user.badges.push(itemId);
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            
            showNotification('Badge claimed! 🎉', 'success');
            loadShop();
        }
        
        function purchaseItem(itemId) {
            const user = JSON.parse(localStorage.getItem('arcadeUser'));
            const item = shopItems.find(i => i.id === itemId);
            
            if (!user.badges) user.badges = [];
            
            if (user.badges.includes(itemId)) {
                showNotification('You already own this!', 'error');
                return;
            }
            
            if (user.coins < item.price) {
                showNotification('Not enough coins! Play more games to earn coins.', 'error');
                return;
            }
            
            // Deduct coins and add badge
            user.coins -= item.price;
            user.badges.push(itemId);
            localStorage.setItem('arcadeUser', JSON.stringify(user));
            
            showNotification(`${item.name} purchased! 🎉`, 'success');
            loadShop();
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
        
        loadShop();
    </script>
</body>
</html>
